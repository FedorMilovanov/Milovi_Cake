name: One-shot TBT series readout

# TEMPORARY diagnostic workflow (remove after use).
# Read-only on production: it never visits the site and never changes CI gates.
# It re-reads the already saved `lighthouse-results` artifacts of every existing
# Lighthouse workflow run, writes one compact evidence JSON into the session
# branch and exits. The file is deleted right after the numbers are folded in.

on:
  push:
    branches: [arena/b2e5e24a-milovi-cake]
    paths:
      - .github/workflows/_temp-tbt-series.yml

permissions:
  actions: read
  contents: write

jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout session branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena/b2e5e24a-milovi-cake

      - name: List Lighthouse runs and saved artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if ! gh api "repos/${{ github.repository }}/actions/workflows/lighthouse.yml/runs?per_page=100" > /tmp/runs.json; then
            echo "::error title=SERIES listing failed::gh api runs failed"
            exit 1
          fi
          python3 -c "
          import json
          data = json.load(open('/tmp/runs.json'))
          pages = data if isinstance(data, list) else [data]
          runs = [run for page in pages for run in page.get('workflow_runs', []) if run.get('status') == 'completed']
          print('::warning title=SERIES runs::%d completed runs listed' % len(runs))
          json.dump(runs, open('/tmp/completed.json', 'w'))
          "

      - name: Collect saved Lighthouse CI results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess
          import tempfile
          import traceback
          import zipfile

          REPO = os.environ['REPO']
          TOKEN = os.environ.get('GH_TOKEN') or os.environ.get('GITHUB_TOKEN')

          def note(title, text):
              text = str(text).replace('%', '%25').replace('\r', '').replace('\n', ' / ')
              print('::warning title=%s::%s' % (title, text))
              print(title, '|', text)

          def gh_json(path):
              result = subprocess.run(
                  ['gh', 'api', path],
                  capture_output=True, text=True, env=dict(os.environ, GH_TOKEN=TOKEN or ''),
              )
              if result.returncode != 0:
                  raise RuntimeError('gh api %s failed: %s' % (path, result.stderr.strip()[:300]))
              return json.loads(result.stdout)

          def download(artifact_id, target):
              url = 'https://api.github.com/repos/%s/actions/artifacts/%d/zip' % (REPO, artifact_id)
              result = subprocess.run(
                  ['curl', '-sSL', '-H', 'Authorization: Bearer ' + (TOKEN or ''),
                   '-H', 'Accept: application/vnd.github+json', url, '-o', target],
                  capture_output=True, text=True,
              )
              if result.returncode != 0:
                  raise RuntimeError('artifact %d download failed: %s' % (artifact_id, result.stderr.strip()[:200]))

          records = []
          run_meta = []
          try:
              runs = json.load(open('/tmp/completed.json'))
              done = 0
              for run in runs:
                  artifacts = gh_json('/repos/%s/actions/runs/%d/artifacts' % (REPO, run['id'])).get('artifacts') or []
                  artifact = next((item for item in artifacts
                                   if item.get('name') == 'lighthouse-results' and not item.get('expired')), None)
                  run_meta.append({
                      'run': run['id'],
                      'sha': run['head_sha'],
                      'created_at': run['created_at'],
                      'conclusion': run['conclusion'],
                      'attempt': run['run_attempt'],
                      'artifact': artifact['id'] if artifact else None,
                      'artifact_bytes': artifact['size_in_bytes'] if artifact else None,
                  })
                  if not artifact:
                      continue
                  done += 1
                  with tempfile.TemporaryDirectory() as workdir:
                      archive = os.path.join(workdir, 'artifact.zip')
                      download(artifact['id'], archive)
                      with zipfile.ZipFile(archive) as bundle:
                          for name in bundle.namelist():
                              if not name.endswith('.json') or 'lhr-' not in os.path.basename(name):
                                  continue
                              try:
                                  lhr = json.loads(bundle.read(name))
                              except Exception:
                                  continue
                              audits = lhr.get('audits') or {}
                              metrics = ((audits.get('metrics') or {}).get('details') or {}).get('items') or [{}]
                              diagnostics = ((audits.get('diagnostics') or {}).get('details') or {}).get('items') or [{}]
                              groups = ((audits.get('mainthread-work-breakdown') or {}).get('details') or {}).get('items') or []
                              by_group = {item.get('group'): item.get('duration') for item in groups}

                              def value(key):
                                  return (audits.get(key) or {}).get('numericValue')

                              user_agent = lhr.get('userAgent') or ''
                              records.append({
                                  'run': run['id'],
                                  'sha': run['head_sha'],
                                  'created_at': run['created_at'],
                                  'url': lhr.get('finalUrl') or lhr.get('requestedUrl'),
                                  'fetch_time': lhr.get('fetchTime'),
                                  'chrome': user_agent.split('Chrome/')[-1].split(' ')[0] if 'Chrome/' in user_agent else None,
                                  'lighthouse': lhr.get('lighthouseVersion'),
                                  'tbt': value('total-blocking-time'),
                                  'lcp': value('largest-contentful-paint'),
                                  'fcp': value('first-contentful-paint'),
                                  'tti': value('interactive'),
                                  'perf': ((lhr.get('categories') or {}).get('performance') or {}).get('score'),
                                  'obs_lcp': metrics[0].get('observedLargestContentfulPaint'),
                                  'obs_fcp': metrics[0].get('observedFirstContentfulPaint'),
                                  'mt_total': round(sum(by_group.values()), 1) if by_group else None,
                                  'mt_style': round(by_group.get('styleLayout'), 1) if by_group.get('styleLayout') is not None else None,
                                  'mt_other': round(by_group.get('other'), 1) if by_group.get('other') is not None else None,
                                  'tasks50': diagnostics[0].get('numTasksOver50ms'),
                                  'tasks100': diagnostics[0].get('numTasksOver100ms'),
                                  'task_time': diagnostics[0].get('totalTaskTime'),
                                  'benchmark': (lhr.get('environment') or {}).get('benchmarkIndex'),
                                  'warnings': len(lhr.get('runWarnings') or []),
                                  'warning_text': ((lhr.get('runWarnings') or [''])[0] or '')[:90] or None,
                              })
                  if done % 5 == 0:
                      note('SERIES progress', 'artifacts=%d lhrs=%d' % (done, len(records)))
              payload = {
                  'generated_at': datetime.datetime.utcnow().isoformat() + 'Z',
                  'runs': run_meta,
                  'lhrs': records,
              }
              os.makedirs('docs', exist_ok=True)
              with open('docs/tbt-series-evidence.json', 'w') as handle:
                  json.dump(payload, handle, indent=1, sort_keys=True)
              note('SERIES done', 'runs_with_artifact=%d runs=%d lhrs=%d' % (
                  sum(1 for item in run_meta if item['artifact']), len(run_meta), len(records)))
          except Exception:
              note('SERIES failed', traceback.format_exc()[-1500:])
              raise
          PY

      - name: Publish evidence file on the session branch
        run: |
          set -euo pipefail
          ls -l docs/tbt-series-evidence.json
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add docs/tbt-series-evidence.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "TBT: temporarily publish saved Lighthouse series evidence"
          git push origin HEAD:arena/b2e5e24a-milovi-cake
