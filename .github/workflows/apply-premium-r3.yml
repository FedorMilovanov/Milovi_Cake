name: Apply premium R3 cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-premium-r3.yml'

permissions:
  contents: write

concurrency:
  group: apply-premium-r3-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true

      - name: Apply isolated index and cleanup patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, required=True):
              global s
              if new in s:
                  return
              if old not in s:
                  if required:
                      raise SystemExit(f'missing expected fragment: {old[:100]!r}')
                  return
              s = s.replace(old, new, 1)

          replace_once(
              '  <link rel="stylesheet" href="/css/final-fixes.css?v=20260728r27" />',
              '  <link rel="stylesheet" href="/css/final-fixes.css?v=20260728r27" />\n  <link rel="stylesheet" href="/css/milovi-premium-r3.css?v=20260803r3" />'
          )
          replace_once('<link rel="prefetch" href="img/bento_maxi.webp" as="image" />', '<link rel="prefetch" href="img/bento_maxi.webp" />')
          replace_once('<link rel="prefetch" href="img/cake_3d.webp" as="image" />', '<link rel="prefetch" href="img/cake_3d.webp" />')
          replace_once('<link rel="prefetch" href="img/cake_3d_2.webp" as="image" />', '<link rel="prefetch" href="img/cake_3d_2.webp" />')

          replacements = {
              '<div class="feature reveal"><div class="feature-icon">🤍</div><h4>Ручная Работа</h4><p>': '<div class="feature reveal"><div class="feature-icon">🤍</div><h3>Ручная Работа</h3><p>',
              '<div class="feature reveal"><div class="feature-icon">🌿</div><h4>Натуральные Ингредиенты</h4><p>': '<div class="feature reveal"><div class="feature-icon">🌿</div><h3>Натуральные Ингредиенты</h3><p>',
              '<div class="feature reveal"><div class="feature-icon">🎯</div><h4>Свежесть под заказ</h4><p>': '<div class="feature reveal"><div class="feature-icon">🎯</div><h3>Свежесть под заказ</h3><p>',
              '<div class="feature reveal"><div class="feature-icon">📦</div><h4>Доставка по СПб</h4><p>': '<div class="feature reveal"><div class="feature-icon">📦</div><h3>Доставка по СПб</h3><p>',
              '<input type="hidden" id="calcWeight" value="2" />': '<input type="hidden" id="calcWeight" value="2" aria-label="Вес торта в килограммах" />',
              '<button type="button" class="reviews-tab active" onclick="switchReviewsTab(\'yandex\')" id="tabYandex">': '<button type="button" class="reviews-tab active" onclick="switchReviewsTab(\'yandex\')" id="tabYandex" aria-label="Отзывы на Яндекс Картах">',
              '<button type="button" class="reviews-tab" onclick="switchReviewsTab(\'google\')" id="tabGoogle">': '<button type="button" class="reviews-tab" onclick="switchReviewsTab(\'google\')" id="tabGoogle" aria-label="Отзывы на Google Картах">',
              '<button type="button" class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:\'smooth\'})" aria-label="Наверх">': '<button type="button" class="back-to-top" id="backToTop" aria-label="Наверх">',
              '<input type="date" id="cdate" placeholder=" " autocomplete="off" />': '<input type="date" id="cdate" class="cart-date-input" autocomplete="off" />',
              '<a id="btnWA" href="#"': '<a id="btnWA" href="https://wa.me/79119038886"',
              '<a id="btnTG" href="#"': '<a id="btnTG" href="https://t.me/+79119038886"',
              '  <script defer src="/js/consent-analytics.js"></script>': '  <script defer src="/js/consent-analytics.js?v=20260803r3"></script>\n  <script defer src="/js/ui-polish-r3.js?v=20260803r3"></script>',
          }
          for old, new in replacements.items():
              replace_once(old, new)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f \
            .github/workflows/apply-index-forensic-fixes.yml \
            .github/workflows/index-forensic-pr.yml \
            .github/workflows/index-forensic-audit.yml \
            .github/workflows/index-forensic-run-witness.yml \
            tests/index-forensic-audit.spec.js

          git rm -f .github/workflows/apply-premium-r3.yml

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          node --check js/ui-polish-r3.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('css/milovi-premium-r3.css').read_text(encoding='utf-8')
          required = [
              'milovi-premium-r3.css?v=20260803r3',
              'ui-polish-r3.js?v=20260803r3',
              'aria-label="Вес торта в килограммах"',
              'href="https://wa.me/79119038886"',
              'href="https://t.me/+79119038886"',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'missing final markers: {missing}')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace imbalance')
          if 'onclick="window.scrollTo({top:0' in html:
              raise SystemExit('legacy back-to-top handler remains')
          if 'href="#"' in '\n'.join(line for line in html.splitlines() if 'id="btnWA"' in line or 'id="btnTG"' in line):
              raise SystemExit('hash cart action remains')
          print('premium R3 verification passed')
          PY

      - name: Commit clean main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: publish audited premium contact UI and remove forensic files'
          git push origin HEAD:main
