name: QA baseline consolidation

on:
  push:
    branches:
      - 'ci/restore-main-qa-baseline'
    paths:
      - '.github/workflows/qa-baseline-consolidate.yml'

permissions:
  contents: write

concurrency:
  group: qa-baseline-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.ref == 'refs/heads/ci/restore-main-qa-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ci/restore-main-qa-baseline
          persist-credentials: true

      - name: Patch runtime references and service worker fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          sw_path = Path('sw.js')
          index = index_path.read_text(encoding='utf-8')
          sw = sw_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source marker, got {count}')
              return text.replace(old, new, 1)

          # HTML: preserve the existing load order, but point only at allowed runtime layers.
          index = replace_once(
              index,
              '  <link rel="stylesheet" href="/css/final-fixes.css?v=20260728r27" />',
              '  <link rel="stylesheet" href="/css/final-fixes.css?v=20260815r78" />',
              'final-fixes cache bust',
          )
          index = replace_once(
              index,
              '  <link rel="stylesheet" href="/css/milovi-premium-r3.css?v=20260803r10" />\n',
              '',
              'retire forbidden premium CSS sidecar',
          )
          index = replace_once(
              index,
              '<script src="js/mc-2026.js?v=20260728r27" defer></script>',
              '<script src="js/mc-2026.js?v=20260815r78" defer></script>',
              'mc-2026 cache bust',
          )
          index = replace_once(
              index,
              '  <script defer src="/js/consent-analytics.js?v=20260803r3"></script>',
              '  <script defer src="/js/consent-analytics.js?v=20260815r78"></script>',
              'consent cache bust',
          )
          index = replace_once(
              index,
              '  <script defer src="/js/ui-polish-r3.js?v=20260803r3"></script>\n',
              '',
              'retire forbidden UI JS sidecar',
          )

          # SW: one release version for the three changed allowed runtime assets.
          sw = replace_once(
              sw,
              'MILOVI CAKE — Service Worker v1.7 (V20260813-R77)',
              'MILOVI CAKE — Service Worker v1.7 (V20260815-R78)',
              'service worker banner',
          )
          sw = replace_once(
              sw,
              "const CACHE_NAME = 'milovi-cake-v2026.08.13-r77';",
              "const CACHE_NAME = 'milovi-cake-v2026.08.15-r78';",
              'service worker cache name',
          )
          sw = replace_once(
              sw,
              "  '/css/final-fixes.css?v=20260728r27',",
              "  '/css/final-fixes.css?v=20260815r78',",
              'final-fixes precache',
          )
          sw = replace_once(
              sw,
              "  '/js/mc-2026.js?v=20260728r27',",
              "  '/js/mc-2026.js?v=20260815r78',",
              'mc-2026 precache',
          )
          sw = replace_once(
              sw,
              "  '/js/consent-analytics.js',",
              "  '/js/consent-analytics.js?v=20260815r78',",
              'consent precache',
          )

          forbidden = ('milovi-premium-r3.css', 'ui-polish-r3.js')
          residue = [token for token in forbidden if token in index or token in sw]
          if residue:
              raise SystemExit(f'forbidden runtime reference residue: {residue}')

          for token in (
              '/css/final-fixes.css?v=20260815r78',
              'js/mc-2026.js?v=20260815r78',
              '/js/consent-analytics.js?v=20260815r78',
          ):
              if token not in index:
                  raise SystemExit(f'index missing release token: {token}')
          for token in (
              '/css/final-fixes.css?v=20260815r78',
              '/js/mc-2026.js?v=20260815r78',
              '/js/consent-analytics.js?v=20260815r78',
          ):
              if token not in sw:
                  raise SystemExit(f'sw missing release token: {token}')

          index_path.write_text(index, encoding='utf-8')
          sw_path.write_text(sw, encoding='utf-8')
          PY

          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html sw.js | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected changed paths:'
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff -- index.html sw.js

      - name: Run deterministic repository guards
        shell: bash
        run: |
          set -euo pipefail
          node --check js/mc-2026.js
          node --check js/consent-analytics.js
          node --check sw.js
          python3 scripts/analytics_contract.py
          python3 scripts/check_prigorody_idempotent.py
          python3 scripts/audit.py

      - name: Commit only validated runtime reference migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --check
          git commit -m 'fix: consolidate allowed runtime layers and cache busts'
          git push origin HEAD:ci/restore-main-qa-baseline
