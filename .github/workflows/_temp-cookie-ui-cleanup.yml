name: One-shot legacy cookie UI cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-cookie-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feat/privacy-consent-deploy-marathon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/privacy-consent-deploy-marathon
          fetch-depth: 0

      - name: Remove balanced legacy UI blocks and analytics prefetch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          excluded = {'.git','node_modules','playwright-report','test-results','audit','_mockups','_review_screens','_site'}

          def remove_element_by_id(text, element_id):
              start_re = re.compile(rf'<div\b(?=[^>]*\bid=["\']{re.escape(element_id)}["\'])[^>]*>', re.I)
              match = start_re.search(text)
              while match:
                  token_re = re.compile(r'<div\b[^>]*>|</div\s*>', re.I)
                  depth = 0
                  end = None
                  for token in token_re.finditer(text, match.start()):
                      if token.group(0).lower().startswith('</div'):
                          depth -= 1
                          if depth == 0:
                              end = token.end()
                              break
                      else:
                          depth += 1
                  if end is None:
                      raise RuntimeError(f'unbalanced div for {element_id}')
                  prefix = text[:match.start()]
                  prefix = re.sub(r'\s*<!--\s*(?:COOKIE BANNER|PRIVACY MODAL[^>]*)\s*-->\s*$', '\n', prefix, flags=re.I)
                  text = prefix + text[end:]
                  match = start_re.search(text)
              return text

          def remove_function(text, name):
              pattern = re.compile(rf'\bfunction\s+{re.escape(name)}\s*\([^)]*\)\s*\{{')
              match = pattern.search(text)
              while match:
                  brace = text.find('{', match.start())
                  depth = 0
                  quote = None
                  escaped = False
                  end = None
                  for i in range(brace, len(text)):
                      ch = text[i]
                      if quote:
                          if escaped: escaped = False
                          elif ch == '\\': escaped = True
                          elif ch == quote: quote = None
                      else:
                          if ch in "'\"`": quote = ch
                          elif ch == '{': depth += 1
                          elif ch == '}':
                              depth -= 1
                              if depth == 0:
                                  end = i + 1
                                  break
                  if end is None:
                      raise RuntimeError(f'unbalanced function {name}')
                  text = text[:match.start()] + text[end:]
                  match = pattern.search(text)
              return text

          changed = []
          for path in sorted(root.rglob('*.html')):
              if any(part in excluded for part in path.parts):
                  continue
              if path.name.lower().startswith(('google','yandex_')):
                  continue
              original = path.read_text('utf-8')
              text = remove_element_by_id(original, 'cookieBanner')
              text = remove_element_by_id(text, 'cookiePrivacyOverlay')
              for name in ('openCookiePrivacy','closeCookiePrivacy'):
                  text = remove_function(text, name)
              text = re.sub(r'\s*<link\s+rel=["\'](?:dns-prefetch|preconnect)["\'][^>]*href=["\']https://(?:mc\.yandex\.ru|www\.googletagmanager\.com)[^"\']*["\'][^>]*>\s*', '\n', text, flags=re.I)
              text = re.sub(r'[ \t]+$', '', text, flags=re.M)
              if text != original:
                  path.write_text(text, 'utf-8')
                  changed.append(str(path))
          print(f'changed {len(changed)} files')
          for path in changed: print(path)
          PY
          python3 scripts/analytics_contract.py
          git diff --check
          ! grep -RIl --include='*.html' 'id="cookieBanner"\|id="cookiePrivacyOverlay"\|openCookiePrivacy\|closeCookiePrivacy' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=_site

      - name: Commit cleanup and remove diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-cookie-ui-cleanup.yml
          rm -f CAKE_QA_DIAGNOSTIC.txt
          git add -A
          git commit -m "refactor(privacy): remove legacy cookie banners and modals"
          git push origin HEAD:feat/privacy-consent-deploy-marathon
