name: Temporary homepage LCP patch

on:
  push:
    branches: [perf/homepage-remove-page-reveal-20260907]

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/homepage-remove-page-reveal-20260907
          persist-credentials: true

      - name: Apply exact causal patch and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text('utf-8')
          old = '\n'.join([
              '  // [PERF v2] page-loaded раньше: на DOMContentLoaded, не ждём картинки',
              "  function _mcPageLoaded(){ document.body.classList.add('page-loaded'); }",
              "  if (document.readyState !== 'loading') _mcPageLoaded();",
              "  else document.addEventListener('DOMContentLoaded', _mcPageLoaded);",
          ]) + '\n'
          new = '  // [PERF] Keep the homepage main continuously paintable through DOMContentLoaded.\n'
          if text.count(old) != 1:
              raise SystemExit(f'index exact reveal block count != 1: {text.count(old)}')
          text = text.replace(old, new, 1)
          index.write_text(text, 'utf-8')

          regress = Path('scripts/lighthouse_regressions.py')
          text = regress.read_text('utf-8')
          needle = "require('body:not(.ready){opacity:0}' not in home, 'homepage can still be hidden before DOMContentLoaded')\n"
          insert = needle + "require(\"classList.add('page-loaded')\" not in home, 'homepage DOMContentLoaded main reveal reset returned')\n"
          if text.count(needle) != 1:
              raise SystemExit(f'lighthouse guard anchor count != 1: {text.count(needle)}')
          text = text.replace(needle, insert, 1)
          regress.write_text(text, 'utf-8')

          tests = Path('tests/protected-interactions.spec.js')
          text = tests.read_text('utf-8')
          needle = "  test('keeps gyroscope parallax sensor-driven and bounded after motion settles', async ({ page }, testInfo) => {\n"
          test_block = """  test('keeps homepage main continuously paintable through DOMContentLoaded', async ({ page }) => {
            await page.goto('/', { waitUntil: 'domcontentloaded' });

            const main = page.locator('main#main-content');
            await expect(main).toBeVisible();
            await expect(page.locator('body')).not.toHaveClass(/\\bpage-loaded\\b/);
            await expect.poll(
              () => main.evaluate((element) => getComputedStyle(element).animationName),
            ).toBe('none');
          });

          """
          if text.count(needle) != 1:
              raise SystemExit(f'Playwright insert anchor count != 1: {text.count(needle)}')
          text = text.replace(needle, test_block + needle, 1)
          tests.write_text(text, 'utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full repository QA
        run: npm run qa

      - name: Verify surgical diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(index.html scripts/lighthouse_regressions.py tests/protected-interactions.spec.js)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]; then
            printf 'unexpected causal diff:\n%s\n' "${changed[@]}" >&2
            exit 1
          fi

      - name: Commit verified patch and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-homepage-lcp-patch.yml
          git config user.name 'FedorMilovanov'
          git config user.email '258225528+FedorMilovanov@users.noreply.github.com'
          git add index.html scripts/lighthouse_regressions.py tests/protected-interactions.spec.js .github/workflows/tmp-homepage-lcp-patch.yml
          git diff --cached --check
          git commit -m 'Perf: keep homepage main paintable through DOMContentLoaded'
          git push origin HEAD:perf/homepage-remove-page-reveal-20260907
