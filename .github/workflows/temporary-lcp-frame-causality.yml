# Temporary PR-only review of saved consent-control traces; remove after review.
# Digest-verified existing artifact; no new browser visits, field data or production changes.
name: Temporary consent first-frame artifact review

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-frame-causality.yml
      - scripts/diagnostics/lcp_hero_motion_temp.mjs

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact published-test SHA and saved artifact digest before reading
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/40615617077 --jq '.head_sha')" = \
            'c638592db2371a0917b1a4b69b41d1a296ca22dc'
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12784868656 --jq '.digest')" = \
            'sha256:57ade51a02936bdde2af67bfd668137bc469c25a6efa862543c96632345eab13'
          gh run download 40615617077 --repo "${{ github.repository }}" \
            -n temporary-lcp-hero-consent-40615617077-1 -D /tmp/milovi-consent-review
      - name: Recompute paired results from all sixteen pinned live reports and traces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, json, statistics
          root = Path('/tmp/milovi-consent-review')
          report = json.loads((root/'summary.json').read_text())
          assert report['control'] == 'consent'
          assert report['release'] == 'e4cc47a5478a2cd1cc29096f51e310633919f3e2'
          assert report['browser'].startswith('155.')
          rows = report['rows']
          assert len(rows) == 16 and len(report['deltas']) == 8
          assert {r['block'] for r in rows} == set(range(1,9))
          assert all(r['resources']['fontFiles'] > 0 and r['resources']['fontCss'] > 0
              and r['resources']['avif'] > 0 and r['resources']['webp'] > 0
              and r['page']['consent']['choice'] == 'denied'
              and r['page']['consent']['analyticsLoaded'] is False
              and r['page']['consent']['open'] == (r['arm'] == 'original')
              for r in rows)
          for r in rows:
              stem = f"{r['block']:02d}-{r['arm']}"
              lhr = json.loads((root/(stem+'.lhr.json')).read_text())
              with gzip.open(root/(stem+'.trace.json.gz'),'rt') as f:
                  trace = json.load(f)
              assert lhr['lighthouseVersion'] == '12.6.1'
              assert lhr['finalUrl'] == 'https://milovicake.ru/prigorody/gatchina/'
              assert len(trace['traceEvents']) == r['traceEvents'] > 1000
          def summary(arm):
              runs = [r for r in rows if r['arm'] == arm]
              return {'rawFcp': [r['rawFcp'] for r in runs],
                  'rawMedian': statistics.median(r['rawFcp'] for r in runs),
                  'simMedian': statistics.median(r['simLcp'] for r in runs),
                  'slowAfter750': sum(r['rawFcp'] >= 750 for r in runs),
                  'rawOver2500': sum(r['rawFcp'] > 2500 for r in runs),
                  'heroCandidate': sum('hero-photo-bg' in r['hero'] for r in runs),
                  'lateAfterDcl': sum(r['rawFcp'] > next(x['ms'] for x in
                      r['page']['lab']['milestones'] if x['kind'] == 'domcontentloaded')
                      for r in runs)}
          a, b = summary('original'), summary('pre-denied')
          pairs = [{'block': i, 'deltaRaw': next(r['rawFcp'] for r in rows if r['block'] == i
              and r['arm'] == 'pre-denied') - next(r['rawFcp'] for r in rows if r['block'] == i
              and r['arm'] == 'original'), 'sameCandidate': next(d['sameLcpElement']
              for d in report['deltas'] if d['block'] == i)} for i in range(1,9)]
          notice = {'release':report['release'],'browser':report['browser'],
              'freshDialog':a,'preDeniedNoDialog':b,'pairs':pairs,
              'pairedMedianDelta':statistics.median(p['deltaRaw'] for p in pairs)}
          print('::notice title=consent-reviewed::'+json.dumps(notice,separators=(',',':')))
          PY
