# Temporary PR-only lab control on the unchanged published release; remove after review.
# Anonymous Lighthouse/Chrome reports only, no production code, CI or field telemetry change.
name: Temporary consent first-frame control

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-frame-causality.yml
      - scripts/diagnostics/lcp_hero_motion_temp.mjs

permissions:
  contents: read

jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_RELEASE_SHA: e4cc47a5478a2cd1cc29096f51e310633919f3e2
      LCP_CONTROL: consent
    steps:
      - name: Checkout the PR-only laboratory runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Prove the exact published release before the control
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 scripts/production_release_smoke.py --retries 2 --delay 5
      - name: Install isolated Lighthouse 12.6.1 and pinned Chrome 155
        run: |
          npm install --prefix /tmp/milovi-lighthouse --no-save --ignore-scripts \
            lighthouse@12.6.1 @puppeteer/browsers@3.2.6
          /tmp/milovi-lighthouse/node_modules/.bin/browsers install \
            chrome@155.0.8059.39 --path /tmp/milovi-browser
          CHROME_PATH=/tmp/milovi-browser/chrome/linux-155.0.8059.39/chrome-linux64/chrome
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version | grep -F 155.0.8059.39
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Pair first visit with pre-denied analytics; neither group loads analytics
        run: |
          if node scripts/diagnostics/lcp_hero_motion_temp.mjs > /tmp/milovi-lh-consent.log 2>&1; then
            cat /tmp/milovi-lh-consent.log
          else
            cat /tmp/milovi-lh-consent.log
            echo "::error title=Consent first-frame control failed::$(tail -n 12 /tmp/milovi-lh-consent.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Re-prove the exact published release after the control
        if: always()
        run: python3 scripts/production_release_smoke.py --retries 1
      - name: Retain bounded anonymous laboratory reports outside Git
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-lcp-hero-consent-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/milovi-lh-consent-control/
          if-no-files-found: warn
          retention-days: 21
