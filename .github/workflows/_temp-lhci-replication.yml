name: One-shot Lighthouse replication

# TEMPORARY measurement job (delete after use).
# Purpose: re-run the *same* Lighthouse CI configuration (12.6.1, mobile,
# 412x915 @1.75, simulate, 150ms RTT, 1638.4kbps, CPU x4) against the same
# eight production URLs, so the red TBT assertion of run 40736722642 can be
# tested for reproducibility on an independent runner.
#
# It does NOT change the repository's Lighthouse config, its thresholds or any
# production byte: `.github/lighthouse-config.json` and the site are untouched.
# The live release is re-proved before, between and after the audits.

on:
  push:
    branches: [arena/b2e5e24a-milovi-cake]
    paths:
      - .github/workflows/_temp-lhci-replication.yml

permissions:
  contents: read

jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_RELEASE_SHA: c0d1a516a19e62952abb580981f1def358413338
    steps:
      - name: Checkout session branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove exact live release before audit A
        run: python3 scripts/production_release_smoke.py --retries 3 --delay 10

      - name: Audit A - the eight production URLs, three runs each
        id: audit-a
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.github/_temp-lhci-replication-a.json
          uploadArtifacts: true
          artifactName: lh-replication-a
          temporaryPublicStorage: true

      - name: Snapshot audit A results
        run: |
          set -euo pipefail
          rm -rf /tmp/lh-a /tmp/lh-b
          mkdir -p /tmp/lh-a
          cp -a .lighthouseci/. /tmp/lh-a/
          ls /tmp/lh-a/lhr-*.json | wc -l

      - name: Prove exact live release after audit A
        run: python3 scripts/production_release_smoke.py --retries 2 --delay 10

      - name: Audit B - order page and control page, five runs each
        id: audit-b
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.github/_temp-lhci-replication-b.json
          uploadArtifacts: true
          artifactName: lh-replication-b
          temporaryPublicStorage: true

      - name: Snapshot audit B results
        run: |
          set -euo pipefail
          mkdir -p /tmp/lh-b
          for file in .lighthouseci/lhr-*.json; do
            if [ ! -f "/tmp/lh-a/$(basename "$file")" ]; then
              cp -a "$file" /tmp/lh-b/
            fi
          done
          echo "A: $(ls /tmp/lh-a/lhr-*.json | wc -l) LHRs, B: $(ls /tmp/lh-b/lhr-*.json | wc -l) LHRs"

      - name: Prove exact live release after audit B
        run: python3 scripts/production_release_smoke.py --retries 2 --delay 10

      - name: Publish per-run metrics as annotations
        env:
          LINKS_A: ${{ steps.audit-a.outputs.links }}
          LINKS_B: ${{ steps.audit-b.outputs.links }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os

          def esc(text):
              return str(text).replace('%', '%25').replace('\r', '').replace('\n', '%0A')

          def note(title, body):
              print('::warning title=%s::%s' % (esc(title), esc(body)))
              print(title)
              print(body)
              print('-' * 70)

          def short(value):
              return (value or '?').replace('https://milovicake.ru', '') or '/'

          def num(value):
              if value is None:
                  return 'n/a'
              if isinstance(value, float):
                  text = ('%.3f' % value).rstrip('0').rstrip('.')
                  return text or '0'
              return str(value)

          def seq(values):
              return '[' + ', '.join(num(value) for value in values) + ']'

          def groups(lhr):
              items = ((lhr.get('audits', {}).get('mainthread-work-breakdown') or {})
                       .get('details', {}).get('items') or [])
              return {item.get('group'): item.get('duration') for item in items}

          def diagnostics(lhr):
              items = ((lhr.get('audits', {}).get('diagnostics') or {})
                       .get('details', {}).get('items') or [{}])
              return items[0]

          def value(lhr, key):
              return ((lhr.get('audits', {}).get(key) or {}).get('numericValue'))

          def observed(lhr, key):
              items = ((lhr.get('audits', {}).get('metrics') or {})
                       .get('details', {}).get('items') or [{}])
              return items[0].get(key)

          def round1(value_in):
              return None if value_in is None else round(value_in, 1)

          for label, directory, links in (('A', '/tmp/lh-a', os.environ.get('LINKS_A', '')),
                                          ('B', '/tmp/lh-b', os.environ.get('LINKS_B', ''))):
              paths = sorted(glob.glob(os.path.join(directory, 'lhr-*.json')))
              lhrs = []
              for path in paths:
                  with open(path) as handle:
                      lhrs.append(json.load(handle))
              if not lhrs:
                  note('REPLICATE %s empty' % label, 'no LHR files in %s' % directory)
                  continue
              first = lhrs[0]
              user_agent = first.get('userAgent') or ''
              note('REPLICATE %s environment' % label,
                   'lhrs=%d | lighthouse=%s | chrome=%s | throttling=%s | formFactor=%s | benchmarkIndex range=%s..%s' % (
                       len(lhrs), first.get('lighthouseVersion'),
                       user_agent.split('Chrome/')[-1].split(' ')[0] if 'Chrome/' in user_agent else 'n/a',
                       (first.get('configSettings') or {}).get('throttlingMethod'),
                       (first.get('configSettings') or {}).get('formFactor'),
                       num(min((lhr.get('environment') or {}).get('benchmarkIndex') or 0 for lhr in lhrs)),
                       num(max((lhr.get('environment') or {}).get('benchmarkIndex') or 0 for lhr in lhrs))))
              if links.strip() and links.strip() not in ('', '{}'):
                  note('REPLICATE %s report links' % label, links)

              grouped = {}
              for lhr in lhrs:
                  grouped.setdefault(lhr.get('finalUrl') or '?', []).append(lhr)
              lines = []
              for url, runs in sorted(grouped.items()):
                  runs.sort(key=lambda item: item.get('fetchTime') or '')
                  lines.append(short(url))
                  lines.append('  TBT %s | LCP %s | perf %s' % (
                      seq([value(run, 'total-blocking-time') for run in runs]),
                      seq([value(run, 'largest-contentful-paint') for run in runs]),
                      seq([((run.get('categories', {}).get('performance') or {}).get('score')) for run in runs])))
                  lines.append('  benchIndex %s | mainthread %s | style %s | observedLCP %s' % (
                      seq([(run.get('environment') or {}).get('benchmarkIndex') for run in runs]),
                      seq([round1(sum(groups(run).values())) if groups(run) else None for run in runs]),
                      seq([round1(groups(run).get('styleLayout')) for run in runs]),
                      seq([observed(run, 'observedLargestContentfulPaint') for run in runs])))
                  lines.append('  tasks>50ms %s | runWarnings %s' % (
                      seq([diagnostics(run).get('numTasksOver50ms') for run in runs]),
                      seq([len(run.get('runWarnings') or []) for run in runs])))
              note('REPLICATE %s per-URL' % label, '\n'.join(lines))

              for url, runs in sorted(grouped.items()):
                  if 'zakazat-tort-spb' not in url:
                      continue
                  detail = []
                  for run in sorted(runs, key=lambda item: item.get('fetchTime') or ''):
                      tasks = ((run.get('audits', {}).get('long-tasks') or {})
                               .get('details', {}).get('items') or [])
                      detail.append('%s | other=%s style=%s scriptEval=%s mainthread=%s | TBT=%s' % (
                          run.get('fetchTime'),
                          num(round1(groups(run).get('other'))),
                          num(round1(groups(run).get('styleLayout'))),
                          num(round1(groups(run).get('scriptEvaluation'))),
                          num(round1(sum(groups(run).values())) if groups(run) else None),
                          num(value(run, 'total-blocking-time'))))
                      detail.append('    ' + (' | '.join(
                          '%s %s@%s' % (short(task.get('url')), num(task.get('duration')), num(task.get('startTime')))
                          for task in tasks) or 'no long tasks'))
                  note('REPLICATE %s zakazat detail' % label, '\n'.join(detail))
          PY
