name: Apply social brand colors R10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-social-r10-colors.yml'

permissions:
  contents: write

concurrency:
  group: apply-social-r10-colors-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true

      - name: Restore persistent brand colours
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('css/milovi-premium-r3.css')
          html_path = Path('index.html')
          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          marker = '/* R10 — persistent brand colours for social links. */'
          pos = css.find(marker)
          if pos != -1:
              css = css[:pos].rstrip() + '\n'

          patch = r'''

          /* R10 — persistent brand colours for social links.
             Form fields, textarea, floating labels and phone icon are untouched. */
          #contacts .social-link {
            color:rgb(var(--soc-rgb)) !important;
            background:rgba(var(--soc-rgb),.075) !important;
            border-color:rgba(var(--soc-rgb),.42) !important;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.035) !important;
          }
          #contacts .social-link svg {
            color:inherit !important;
            fill:currentColor !important;
            opacity:1 !important;
          }
          #contacts .social-link.vk { --soc-rgb:74,118,168; }
          #contacts .social-link.tg { --soc-rgb:39,166,229; }
          #contacts .social-link.max { --soc-rgb:129,92,246; }
          #contacts .social-link.yt { --soc-rgb:230,53,46; }
          #contacts .social-link.ya { --soc-rgb:232,73,32; }
          #contacts .social-link.google { --soc-rgb:66,133,244; }
          #contacts .social-link.ig,
          #contacts .social-link.instagram { --soc-rgb:214,72,145; }

          @media (hover:hover) and (pointer:fine) {
            #contacts .social-link:hover,
            #contacts .social-link:focus-visible {
              color:rgb(var(--soc-rgb)) !important;
              background:rgba(var(--soc-rgb),.18) !important;
              border-color:rgba(var(--soc-rgb),.82) !important;
              box-shadow:
                0 10px 28px rgba(var(--soc-rgb),.25),
                0 0 0 1px rgba(var(--soc-rgb),.12),
                inset 0 1px 0 rgba(255,255,255,.055) !important;
              transform:translateY(-2px) !important;
            }
            #contacts .social-link:hover svg,
            #contacts .social-link:focus-visible svg {
              filter:drop-shadow(0 0 7px rgba(var(--soc-rgb),.58)) !important;
            }
          }
          '''

          css = css.rstrip() + patch + '\n'
          html = html.replace('milovi-premium-r3.css?v=20260803r9', 'milovi-premium-r3.css?v=20260803r10')
          css_path.write_text(css, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Verify and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css = Path('css/milovi-premium-r3.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          base = Path('css/v20-fixes.css').read_text(encoding='utf-8')

          required = [
              'R10 — persistent brand colours for social links',
              'color:rgb(var(--soc-rgb))',
              'background:rgba(var(--soc-rgb),.075)',
              'background:rgba(var(--soc-rgb),.18)',
              'border-color:rgba(var(--soc-rgb),.82)',
              'milovi-premium-r3.css?v=20260803r10',
          ]
          missing = [item for item in required if item not in css and item not in html]
          if missing:
              raise SystemExit(f'missing R10 markers: {missing}')
          for item in (
              'border:1px solid var(--mc-field-border) !important',
              'border-radius:15px !important',
              'min-height:112px !important',
          ):
              if item not in base:
                  raise SystemExit(f'form regression: {item}')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace imbalance')
          print('R10 social colour restoration verified')
          PY

          git rm -f .github/workflows/apply-social-r10-colors.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add css/milovi-premium-r3.css index.html
          git commit -m 'fix: restore colorful social buttons and brand hover glow'
          git push origin HEAD:main
