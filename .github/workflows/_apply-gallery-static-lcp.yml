name: Apply gallery static LCP patch

on:
  push:
    branches:
      - perf/gallery-static-lcp-card-20260906

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == 'FedorMilovanov' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/gallery-static-lcp-card-20260906
          fetch-depth: 0

      - name: Apply exact source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_reserve = "/* The module renders gallery cards after HTML parse. Reserve one viewport only while\n   the grid is in its initial empty state so the SEO panel never paints above the\n   hydrated grid. Once JS removes gxEmpty's inline display:none (or cards exist),\n   this rule stops matching and does not add whitespace to empty filter results. */\n#galleryGrid:empty:has(+ #gxEmpty[style*=\"display: none\"]) { min-height: 100svh; }"
          new_reserve = "/* Keep the SEO panel below the viewport while the parser-visible LCP card is\n   hydrated into the full client gallery. The static-root marker also disables the\n   decorative grid entrance animation so it cannot gate first paint. */\n#galleryGrid[data-hydrating=\"true\"] { min-height: 100svh; }\n#galleryGrid[data-static-lcp-root=\"true\"] { animation: none; }"
          replace_once('gallery/index.html', old_reserve, new_reserve)

          old_grid = '      <div class="gallery-grid" id="galleryGrid" role="list"></div>'
          new_grid = '      <div class="gallery-grid" id="galleryGrid" role="list" data-hydrating="true" data-static-lcp-root="true">\n        <button type="button" class="card col-span-2 row-span-2 is-loaded" data-index="0" data-id="p01" data-static-lcp="p01" aria-label="Шоколадный торт с мишками. Открыть в 3D-галерее" role="listitem" style="animation:none">\n          <picture>\n            <source type="image/avif" srcset="/img/gallery/gallery-01.avif">\n            <img class="card-media" alt="Шоколадный торт с мишками" loading="eager" decoding="async" fetchpriority="high" src="/img/gallery/gallery-01.webp">\n          </picture>\n          <div class="card-overlay"><span class="card-title">Шоколадный торт с мишками</span></div>\n        </button>\n      </div>'
          replace_once('gallery/index.html', old_grid, new_grid)
          replace_once('gallery/index.html', '/js/gallery/main.js?v=20260906r02', '/js/gallery/main.js?v=20260906r03')

          old_boot = "  const grid=$('#galleryGrid'), empty=$('#gxEmpty'); \n  grid.innerHTML=''; \n  if(empty) {"
          new_boot = "  const grid=$('#galleryGrid'), empty=$('#gxEmpty');\n  const staticCard = grid.querySelector('[data-static-lcp=\"p01\"]');\n  const reuseStaticLcp = state.filter === 'all' && staticCard && state.visible[0]?.id === staticCard.dataset.id;\n  if (reuseStaticLcp) {\n    Array.from(grid.children).forEach(child => { if (child !== staticCard) child.remove(); });\n    staticCard.dataset.index = '0';\n  } else {\n    grid.innerHTML='';\n  }\n  if(empty) {"
          replace_once('js/gallery/main.js', old_boot, new_boot)

          old_loop = "  state.visible.forEach((item,index)=>{\n    const card=document.createElement('button'); "
          new_loop = "  state.visible.forEach((item,index)=>{\n    if (reuseStaticLcp && index === 0) {\n      if (staticCard.dataset.hydrated !== 'true') {\n        staticCard.addEventListener('click',()=>openLightbox(0));\n        attachCardTilt(staticCard);\n        staticCard.dataset.hydrated = 'true';\n      }\n      return;\n    }\n    const card=document.createElement('button'); "
          replace_once('js/gallery/main.js', old_loop, new_loop)
          replace_once('js/gallery/main.js', "  grid.appendChild(frag);\n  if(document.readyState==='complete') setupVideoObserver();", "  grid.appendChild(frag);\n  grid.removeAttribute('data-hydrating');\n  if(document.readyState==='complete') setupVideoObserver();")

          replace_once('sw.js', 'V20260906-R79', 'V20260906-R80')
          replace_once('sw.js', "const CACHE_NAME = 'milovi-cake-v2026.09.06-r79';", "const CACHE_NAME = 'milovi-cake-v2026.09.06-r80';")
          replace_once('sw.js', "'/js/gallery/main.js?v=20260906r02',", "'/js/gallery/main.js?v=20260906r03',")

          replace_once('scripts/lighthouse_regressions.py', "require('/js/gallery/main.js?v=20260906r02' in gallery, 'gallery runtime revision drift')", "require('/js/gallery/main.js?v=20260906r03' in gallery, 'gallery runtime revision drift')")
          old_layout_contract = "require(\n    '#galleryGrid:empty:has(+ #gxEmpty[style*=\"display: none\"]) { min-height: 100svh; }' in gallery,\n    'gallery initial empty grid no longer reserves one viewport before hydration',\n)\nrequire(\n    'id=\"gxEmpty\" style=\"display: none;\"' in gallery,\n    'gallery initial-layout reserve sentinel drifted',\n)"
          new_layout_contract = "require('#galleryGrid[data-hydrating=\"true\"] { min-height: 100svh; }' in gallery, 'gallery hydration reserve missing')\nrequire('#galleryGrid[data-static-lcp-root=\"true\"] { animation: none; }' in gallery, 'gallery grid animation gates initial LCP again')\nrequire('data-static-lcp=\"p01\"' in gallery, 'gallery initial LCP card is no longer parser-visible')\nrequire('data-hydrating=\"true\" data-static-lcp-root=\"true\"' in gallery, 'gallery static-LCP hydration markers missing')\nrequire('<source type=\"image/avif\" srcset=\"/img/gallery/gallery-01.avif\">' in gallery, 'gallery static LCP AVIF source drifted')\nrequire('fetchpriority=\"high\" src=\"/img/gallery/gallery-01.webp\"' in gallery, 'gallery static LCP fallback lost high priority')\nrequire(\n    'id=\"gxEmpty\" style=\"display: none;\"' in gallery,\n    'gallery initial-layout reserve sentinel drifted',\n)"
          replace_once('scripts/lighthouse_regressions.py', old_layout_contract, new_layout_contract)

          old_js_guard = "require(\"if(index===0) img.fetchPriority='high';\" in gallery_js, 'gallery first image lost high fetch priority')"
          new_js_guard = old_js_guard + "\nrequire(\"const staticCard = grid.querySelector('[data-static-lcp=\\\"p01\\\"]');\" in gallery_js, 'gallery static LCP lookup missing')\nrequire(\"const reuseStaticLcp = state.filter === 'all'\" in gallery_js, 'gallery initial LCP is not reused during hydration')\nrequire(\"staticCard.dataset.hydrated = 'true';\" in gallery_js, 'gallery static LCP interaction hydration missing')\nrequire(\"grid.removeAttribute('data-hydrating');\" in gallery_js, 'gallery hydration reserve is never released')"
          replace_once('scripts/lighthouse_regressions.py', old_js_guard, new_js_guard)
          replace_once('scripts/lighthouse_regressions.py', "require(\"const CACHE_NAME = 'milovi-cake-v2026.09.06-r79';\" in sw, 'service-worker cache generation did not roll with shared CSS')", "require(\"const CACHE_NAME = 'milovi-cake-v2026.09.06-r80';\" in sw, 'service-worker cache generation drifted')")
          old_sw_guard = "require(\"'/css/style.css?v=20260906r03',\" in sw, 'service-worker precache still points at stale shared CSS revision')"
          new_sw_guard = old_sw_guard + "\nrequire(\"'/js/gallery/main.js?v=20260906r03',\" in sw, 'service-worker precache still points at stale gallery runtime revision')"
          replace_once('scripts/lighthouse_regressions.py', old_sw_guard, new_sw_guard)
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          node --check js/gallery/main.js
          node --check sw.js
          python3 scripts/lighthouse_regressions.py
          git diff --check

      - name: Commit clean source patch and remove staging workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-gallery-static-lcp.yml
          git add gallery/index.html js/gallery/main.js sw.js scripts/lighthouse_regressions.py
          git commit -m "Perf: render gallery LCP card in initial HTML"
          git push origin HEAD:perf/gallery-static-lcp-card-20260906
