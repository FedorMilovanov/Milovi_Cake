name: Temporary stale branch cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_delete-stale-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Delete reviewed stale branches
        run: |
          python3 - <<'PY'
          import os, urllib.error, urllib.parse, urllib.request
          branches = [
            'ci/verify-live-release-5568389',
            'ci/verify-live-release-ea968c1',
            'claude/seo-audit-russian-market-083hpb',
            'feat/privacy-consent-deploy-marathon',
            'fix/deep-polish-round2',
            'seo-audit-bot',
            'audit/repository-hygiene-20260728',
          ]
          repo=os.environ['REPOSITORY']
          token=os.environ['GH_TOKEN']
          failures=[]
          for branch in branches:
              if branch == 'main':
                  failures.append('refused to delete main')
                  continue
              ref=urllib.parse.quote(f'heads/{branch}', safe='/')
              url=f'https://api.github.com/repos/{repo}/git/refs/{ref}'
              req=urllib.request.Request(url, method='DELETE', headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
              })
              try:
                  with urllib.request.urlopen(req) as response:
                      print(f'deleted {branch}: HTTP {response.status}')
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode('utf-8',errors='replace')
                  if exc.code == 422 and 'Reference does not exist' in body:
                      print(f'already absent: {branch}')
                  else:
                      failures.append(f'{branch}: HTTP {exc.code} {body}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
