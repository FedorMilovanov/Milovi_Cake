name: One-shot analytics migration

on:
  push:
    branches: [feat/privacy-consent-deploy-marathon]
    paths:
      - '.github/workflows/_temp-analytics-migration.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-analytics-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feat/privacy-consent-deploy-marathon' || github.ref_name == 'feat/privacy-consent-deploy-marathon'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/privacy-consent-deploy-marathon
          fetch-depth: 0

      - name: Apply deterministic analytics migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/analytics_contract.py')
          text = path.read_text('utf-8')
          text = text.replace("'        \"js/consent-analytics.js\",\\n'", "'    \"js/consent-analytics.js\",\\n'")
          text = text.replace("'        \"js/mc-2026.js\",\\n'", "'    \"js/mc-2026.js\",\\n'")
          path.write_text(text, 'utf-8')
          PY
          python3 scripts/analytics_contract.py --fix-only
          python3 -m py_compile scripts/analytics_contract.py scripts/audit.py
          git diff --check

      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-analytics-migration.yml
          git add -A
          git commit -m "refactor(privacy): centralize analytics behind explicit consent"
          git push origin HEAD:feat/privacy-consent-deploy-marathon
