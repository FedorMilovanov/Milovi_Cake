name: Hardening control-plane bootstrap

on:
  push:
    branches:
      - 'hardening/control-plane-20260906'
    paths:
      - '.github/workflows/hardening-control-plane-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/control-plane-20260906
          persist-credentials: true

      - name: Apply deterministic migration
        run: python3 scripts/hardening_20260906.py

      - name: Rebuild generated suburb pages
        run: python3 prigorody/build.py

      - name: Refresh Playwright lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check playwright.config.js
          node --check tests/layout-matrix.spec.js
          python3 scripts/a11y_static.py
          python3 scripts/release_contract.py
          python3 scripts/analytics_contract.py
          python3 scripts/check_prigorody_idempotent.py
          python3 scripts/audit.py
          npm audit --audit-level=high

      - name: Commit clean hardening state
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/hardening-control-plane-bootstrap.yml scripts/hardening_20260906.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'hardening: promote forensic findings into permanent contracts'
          git push origin HEAD:hardening/control-plane-20260906
