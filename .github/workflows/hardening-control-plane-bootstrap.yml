      - name: Rebuild canonical generated suburb pages
        run: python3 prigorody/build.py

      - name: Refresh Playwright lockfile at current stable
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate deterministic source contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check playwright.config.js
          node --check tests/layout-matrix.spec.js
          python3 scripts/a11y_static.py
          python3 scripts/release_contract.py
          python3 scripts/analytics_contract.py
          python3 scripts/check_prigorody_idempotent.py
          python3 scripts/audit.py
          npm audit --audit-level=high

      - name: Commit final clean branch state and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/hardening-control-plane-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'hardening: promote forensic findings into permanent contracts'
          git push origin HEAD:hardening/control-plane-20260906
