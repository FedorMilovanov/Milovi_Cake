name: One-off theme contract origin diagnostic

on:
  push:
    branches:
      - ci/restore-main-qa-baseline
    paths:
      - .github/workflows/oneoff-theme-contract-origin-diagnostic.yml

permissions:
  contents: read

jobs:
  trace-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/restore-main-qa-baseline
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Trace first appearance of generated theme contract
        shell: bash
        run: |
          set -euo pipefail

          snapshot() {
            local label="$1"
            echo "===== SNAPSHOT: ${label} ====="
            find tests -maxdepth 1 -type f -printf '%P\n' | sort
            git status --short --untracked-files=all
            if [[ -f tests/theme-contract.spec.js ]]; then
              echo "THEME_CONTRACT_PRESENT=${label}"
              stat tests/theme-contract.spec.js
              nl -ba tests/theme-contract.spec.js | sed -n '220,280p'
              exit 78
            fi
          }

          snapshot checkout
          npm ci
          snapshot npm-ci
          npm run audit:js
          snapshot audit-js
          npm run audit:analytics
          snapshot audit-analytics
          python3 scripts/check_prigorody_idempotent.py
          snapshot audit-prigorody
          npm run audit:security
          snapshot audit-security
          npm run audit
          snapshot source-audit
          npx playwright test --list >/tmp/playwright-list.txt
          cat /tmp/playwright-list.txt
          snapshot playwright-list

          echo "theme-contract.spec.js was not created by any pre-test QA step"
