name: Temporary clean gallery diff

on:
  push:
    branches:
      - hardening/lighthouse-root-causes-20260906

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/lighthouse-root-causes-20260906
          fetch-depth: 0
      - name: Rebuild gallery runtime surgically
        shell: bash
        run: |
          git checkout a7c50f0ca1fcba7e580a87b121ced9ebcbf90101 -- js/gallery/main.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/gallery/main.js')
          s = p.read_text('utf-8')

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          once(
              "    card.style.animationDelay=`${Math.min(index*0.04, 1.2)}s`; ",
              "    if(index<4) card.style.animation='none';\n    else card.style.animationDelay=`${Math.min(index*0.04, 1.2)}s`;",
              'above-fold animation',
          )
          once("      v.autoplay=true; \n", '', 'video autoplay')
          once("      v.preload='metadata'; ", "      v.preload='none';", 'video preload')
          once(
              "      img.loading=index<8?'eager':'lazy'; \n      img.decoding='async'; ",
              "      img.loading=index<4?'eager':'lazy';\n      img.decoding='async';\n      if(index===0) img.fetchPriority='high';",
              'image priority',
          )
          once(
              '  grid.appendChild(frag); \n  setupVideoObserver();\n}',
              "  grid.appendChild(frag);\n  if(document.readyState==='complete') setupVideoObserver();\n  else if(!state.videoObserverPending){\n    state.videoObserverPending=true;\n    window.addEventListener('load',()=>{state.videoObserverPending=false;setupVideoObserver();},{once:true});\n  }\n}",
              'observer scheduling',
          )
          s, n = re.subn(
              r'\nfunction hidePreloader\(delay=650\)\{.*?\n\}\n',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'hidePreloader function: expected 1, got {n}')
          s = re.sub(r'^\s*hidePreloader\([^\n]*\);\s*$', '', s, flags=re.M)
          s = re.sub(r'^\s*setTimeout\(\(\)=>hidePreloader\(0\),5000\);\s*$', '', s, flags=re.M)
          if 'hidePreloader' in s:
              raise SystemExit('hidePreloader reference remains')

          p.write_text(s, 'utf-8')
          PY
      - name: Validate exact final diff
        run: |
          python3 scripts/check_prigorody_idempotent.py
          python3 scripts/a11y_static.py
          python3 scripts/release_contract.py
          python3 scripts/lighthouse_regressions.py
          python3 scripts/audit.py
          node --check js/gallery/main.js
          git diff --check
      - name: Commit clean product diff
        run: |
          rm .github/workflows/tmp-clean-gallery-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hardening: keep gallery runtime diff surgical"
          git push origin HEAD:hardening/lighthouse-root-causes-20260906
