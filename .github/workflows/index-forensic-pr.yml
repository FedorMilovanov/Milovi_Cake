name: INDEX forensic PR evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: index-forensic-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  forensic:
    name: Browser atlas, interactions and external checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INDEX_FORENSIC: '1'
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install exact dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run forensic INDEX audit
        id: browser
        shell: bash
        run: |
          set +e
          npx playwright test tests/index-forensic-audit.spec.js 2>&1 | tee forensic-playwright.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build combined protocol
        id: protocol
        if: always()
        shell: bash
        env:
          BROWSER_STATUS: ${{ steps.browser.outputs.status }}
          ARTIFACT_NAME: index-forensic-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('test-results/ui-audit/index-forensic')
          root.mkdir(parents=True, exist_ok=True)
          reports = []
          for file in sorted(root.glob('*-report.json')):
              try:
                  reports.append(json.loads(file.read_text(encoding='utf-8')))
              except Exception as exc:
                  reports.append({
                      'project': file.name,
                      'checks': 0,
                      'screenshotCount': 0,
                      'critical': 1,
                      'warnings': 0,
                      'findings': [{
                          'severity': 'critical',
                          'check': 'Чтение отчёта',
                          'message': str(exc),
                          'data': None,
                      }],
                  })
          if not reports:
              reports = [{
                  'project': 'runner',
                  'checks': 0,
                  'screenshotCount': 0,
                  'critical': 1,
                  'warnings': 0,
                  'findings': [{
                      'severity': 'critical',
                      'check': 'Playwright не создал отчёт',
                      'message': 'Смотрите forensic-playwright.log',
                      'data': None,
                  }],
              }]

          browser_status = int(os.environ.get('BROWSER_STATUS') or 1)
          checks = sum(int(r.get('checks', 0)) for r in reports)
          screenshots = sum(int(r.get('screenshotCount', 0)) for r in reports)
          critical = sum(int(r.get('critical', 0)) for r in reports) + (1 if browser_status else 0)
          warnings = sum(int(r.get('warnings', 0)) for r in reports)
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          artifact = os.environ['ARTIFACT_NAME']

          lines = [
              '<!-- index-forensic-pr-report -->',
              '# Недоверчивый forensic-аудит всей INDEX',
              '',
              f'- **Exact head:** `{os.environ.get("RELEASE_SHA", "unknown")}`',
              f'- **Actions run:** {run_url}',
              f'- **Artifact:** `{artifact}`',
              f'- **Проверок:** {checks}',
              f'- **Скриншотов:** {screenshots}',
              f'- **Критических замечаний:** {critical}',
              f'- **Замечаний «дошлифовать»:** {warnings}',
              f'- **Playwright status:** {browser_status}',
              '',
              'Покрытие: desktop и Pixel 7; light/dark; полные скриншоты INDEX; 11 секций в каждой теме; геометрия и overflow; header/mobile-nav; форма и floating-label; телефон; цветные соцсети; footer; privacy; аналитика до consent; калькулятор; корзина; вкладки; FAQ; отзывы; внутренние URL; W3C; PageSpeed; MDN Observatory.',
              '',
          ]
          severity_order = {'critical': 0, 'warning': 1, 'info': 2}
          material = []
          for report in reports:
              for finding in report.get('findings', []):
                  if finding.get('severity') != 'info':
                      material.append((report.get('project', 'unknown'), finding))
          material.sort(key=lambda item: severity_order.get(item[1].get('severity'), 9))
          if material:
              lines.extend(['## Что найдено', ''])
              for project, finding in material[:80]:
                  label = 'КРИТИЧНО' if finding.get('severity') == 'critical' else 'ДОШЛИФОВАТЬ'
                  lines.extend([
                      f'### {label} · {project} · {finding.get("check", "Без названия")}',
                      '',
                      str(finding.get('message', '')),
                      '',
                  ])
                  if finding.get('data') is not None:
                      payload = json.dumps(finding['data'], ensure_ascii=False, indent=2)
                      lines.extend(['```json', payload[:3500], '```', ''])
          elif browser_status == 0:
              lines.extend(['## Итог', '', 'Автоматический прогон не выявил критических или визуальных предупреждений.', ''])

          if browser_status:
              lines.extend([
                  '### КРИТИЧНО · Playwright process',
                  '',
                  f'Процесс завершился с кодом {browser_status}; полный лог лежит в артефакте.',
                  '',
              ])

          lines.extend([
              '## Визуальные доказательства',
              '',
              f'Скачайте artifact **{artifact}** из Actions-run. Внутри находятся полные INDEX light/dark и отдельные макро/микро-состояния интерфейса.',
              '',
          ])
          summary = '\n'.join(lines)
          (root / 'PR-SUMMARY.md').write_text(summary, encoding='utf-8')
          combined = {
              'head_sha': os.environ.get('RELEASE_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_url': run_url,
              'artifact': artifact,
              'browser_status': browser_status,
              'checks': checks,
              'screenshots': screenshots,
              'critical': critical,
              'warnings': warnings,
              'reports': reports,
          }
          (root / 'combined-report.json').write_text(json.dumps(combined, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('forensic-critical-count.txt').write_text(str(critical), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"critical={critical}\n")
              out.write(f"artifact={artifact}\n")
          PY
          cp forensic-playwright.log test-results/ui-audit/index-forensic/forensic-playwright.log

      - name: Upload full forensic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.protocol.outputs.artifact }}
          path: test-results/ui-audit/index-forensic/
          if-no-files-found: error
          retention-days: 14

      - name: Publish protocol to PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body='test-results/ui-audit/index-forensic/PR-SUMMARY.md'
          marker='<!-- index-forensic-pr-report -->'
          existing="$(gh api "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)"
          if [ -n "$existing" ]; then
            jq -Rs '{body: .}' < "$body" | gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input -
          else
            gh pr comment "$PR_NUMBER" --body-file "$body"
          fi

      - name: Gate critical regressions
        if: always()
        shell: bash
        env:
          BROWSER_STATUS: ${{ steps.browser.outputs.status }}
          CRITICAL: ${{ steps.protocol.outputs.critical }}
        run: |
          set -euo pipefail
          echo "browser=${BROWSER_STATUS:-1}; critical=${CRITICAL:-1}"
          if [ "${BROWSER_STATUS:-1}" -ne 0 ] || [ "${CRITICAL:-1}" -ne 0 ]; then
            exit 1
          fi
