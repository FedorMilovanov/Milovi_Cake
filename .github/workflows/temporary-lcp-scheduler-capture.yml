# Temporary PR-only browser-feature control; delete with its runner after review.
# Same unchanged release, 12 balanced triplets; one flag differs within Chrome 158.
name: Temporary LCP upstream Viz feature control

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-scheduler-capture.yml
      - scripts/diagnostics/lcp_scheduler_state_temp.mjs

permissions:
  contents: read

jobs:
  upstream-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_RELEASE_SHA: e4cc47a5478a2cd1cc29096f51e310633919f3e2
    steps:
      - name: Checkout exact PR-only lab control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Verify unchanged published SHA and exact PR head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 scripts/production_release_smoke.py --retries 2 --delay 5
      - name: Install isolated Lighthouse trace categories and two pinned Chromes
        run: |
          npm install --prefix /tmp/milovi-lighthouse --no-save --ignore-scripts \
            lighthouse@12.6.1 @puppeteer/browsers@3.2.6
          for VERSION in 155.0.8059.39 158.0.8117.2; do
            /tmp/milovi-lighthouse/node_modules/.bin/browsers install \
              "chrome@$VERSION" --path /tmp/milovi-browser
            CHROME_PATH="/tmp/milovi-browser/chrome/linux-$VERSION/chrome-linux64/chrome"
            test -x "$CHROME_PATH"
            "$CHROME_PATH" --version | grep -F "$VERSION"
          done
          echo 'CHROME_155_PATH=/tmp/milovi-browser/chrome/linux-155.0.8059.39/chrome-linux64/chrome' >> "$GITHUB_ENV"
          echo 'CHROME_158_PATH=/tmp/milovi-browser/chrome/linux-158.0.8117.2/chrome-linux64/chrome' >> "$GITHUB_ENV"
      - name: Compare Chromium upstream Viz guard on identical Chrome 158
        run: |
          if node --expose-gc scripts/diagnostics/lcp_scheduler_state_temp.mjs \
              > /tmp/milovi-upstream-feature.log 2>&1; then
            cat /tmp/milovi-upstream-feature.log
          else
            grep -E '^([A-Za-z]+Error|Error):' /tmp/milovi-upstream-feature.log | tail -n 2 || true
            echo "::error title=Upstream feature control failed::$(grep -E '^([A-Za-z]+Error|Error):' /tmp/milovi-upstream-feature.log | tail -n 1 | cut -c 1-180)"
            exit 1
          fi
      - name: Verify same published SHA again
        if: always()
        run: python3 scripts/production_release_smoke.py --retries 1
      - name: Retain anonymous lab reports and selected traces outside Git
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-lcp-upstream-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/milovi-lcp-upstream-control/
          if-no-files-found: warn
          retention-days: 21
