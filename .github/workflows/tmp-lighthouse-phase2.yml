name: Temporary Lighthouse phase 2

on:
  push:
    branches: [hardening/lighthouse-root-causes-20260906]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout phase-2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/lighthouse-root-causes-20260906
          fetch-depth: 0

      - name: Apply deterministic root-cause fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def read(path): return Path(path).read_text('utf-8')
          def write(path, text): Path(path).write_text(text, 'utf-8')
          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          # Homepage: theme is already applied synchronously to <html>. Do not hide the whole body.
          p = Path('index.html'); s = read(p)
          pattern = re.compile(
              r'\n  <!-- ANTI-FOUC v1: body opacity reveal \(theme handled above\) -->\n'
              r'  <style id="anti-fouc-body">.*?</script>\n', re.S)
          s, n = pattern.subn('\n', s, count=1)
          if n != 1: raise SystemExit(f'anti-FOUC: expected 1 block, got {n}')
          write(p, s)

          # Stabilize metrics under throttled mobile audit: no late metric-changing webfont swap.
          # Scope only to URLs in the audited performance set plus the canonical suburb template.
          font_paths = [
              'index.html', 'gallery/index.html', 'svadebnye-torty/index.html',
              'bento-torty/index.html', 'zakazat-tort-spb/index.html',
              'prigorody/_template.html'
          ]
          for path in font_paths:
              s = read(path)
              n = s.count('display=swap')
              if n < 1: raise SystemExit(f'{path}: expected Google Fonts display=swap')
              write(path, s.replace('display=swap', 'display=optional'))

          # On the three slow audited landing pages, below-fold media must not compete with hero LCP.
          for path in ['svadebnye-torty/index.html','bento-torty/index.html','zakazat-tort-spb/index.html']:
              s = read(path)
              n = s.count('loading="eager"')
              if n < 1: raise SystemExit(f'{path}: expected below-fold eager images')
              write(path, s.replace('loading="eager"', 'loading="lazy"'))

          # Order page: serve the already-existing mobile hero asset to mobile Lighthouse/users.
          path = 'zakazat-tort-spb/index.html'; s = read(path)
          s = once(s,
              '<link rel="preload" as="image" type="image/avif" href="/img/head_desktop.avif" fetchpriority="high" />',
              '<link rel="preload" as="image" type="image/avif" href="/img/head_mobile.avif" media="(max-width: 768px)" fetchpriority="high" />\n  <link rel="preload" as="image" type="image/avif" href="/img/head_desktop.avif" media="(min-width: 769px)" fetchpriority="high" />',
              'order responsive preload')
          s = once(s,
              '<picture><source type="image/avif" srcset="/img/head_desktop.avif"><img src="/img/head_desktop.webp" alt="Заказать торт в СПб — Milovi Cake" width="900" height="1200" fetchpriority="high" decoding="async"/></picture>',
              '<picture><source type="image/avif" media="(max-width: 768px)" srcset="/img/head_mobile.avif"><source type="image/avif" media="(min-width: 769px)" srcset="/img/head_desktop.avif"><source type="image/webp" media="(max-width: 768px)" srcset="/img/head_mobile.webp"><img src="/img/head_desktop.webp" alt="Заказать торт в СПб — Milovi Cake" width="900" height="1200" fetchpriority="high" decoding="async"/></picture>',
              'order responsive picture')
          write(path, s)

          # Gallery: make the LCP image discoverable from initial HTML and remove blocking overlay.
          path = 'gallery/index.html'; s = read(path)
          anchor = '  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />\n'
          s = once(s, anchor, anchor + '  <link rel="preload" as="image" type="image/avif" href="/img/gallery/gallery-01.avif" fetchpriority="high" />\n', 'gallery preload')
          s, n = re.subn(r'\n  <div id="preloader">.*?\n  </div>\n', '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'gallery preloader: expected 1, got {n}')
          s = once(s, '/js/gallery/main.js?v=20260906r01', '/js/gallery/main.js?v=20260906r02', 'gallery JS revision')
          write(path, s)

          path = 'js/gallery/main.js'; s = read(path)
          s = once(s,
              "    card.style.animationDelay=`${Math.min(index*0.04, 1.2)}s`; ",
              "    if(index<4) card.style.animation='none';\n    else card.style.animationDelay=`${Math.min(index*0.04, 1.2)}s`; ",
              'gallery above-fold animation')
          s = once(s, "      v.autoplay=true; \n", '', 'gallery autoplay')
          s = once(s, "      v.preload='metadata'; ", "      v.preload='none'; ", 'gallery video preload')
          s = once(s,
              "      img.loading=index<8?'eager':'lazy'; \n      img.decoding='async'; ",
              "      img.loading=index<4?'eager':'lazy'; \n      img.decoding='async'; \n      if(index===0) img.fetchPriority='high'; ",
              'gallery image priority')
          s = once(s,
              '  grid.appendChild(frag); \n  setupVideoObserver();\n}',
              "  grid.appendChild(frag); \n  if(document.readyState==='complete') setupVideoObserver();\n  else if(!state.videoObserverPending){\n    state.videoObserverPending=true;\n    window.addEventListener('load',()=>{state.videoObserverPending=false;setupVideoObserver();},{once:true});\n  }\n}",
              'gallery observer scheduling')
          s, n = re.subn(r'\nfunction hidePreloader\(delay=650\)\{.*?\n\}\n', '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'hidePreloader function: expected 1, got {n}')
          s = re.sub(r'^\s*hidePreloader\([^\n]*\);\s*$', '', s, flags=re.M)
          s = re.sub(r'^\s*setTimeout\(\(\)=>hidePreloader\(0\),5000\);\s*$', '', s, flags=re.M)
          if 'hidePreloader' in s: raise SystemExit('hidePreloader reference remains')
          write(path, s)

          path = 'sw.js'; s = read(path)
          s = once(s, "'/js/gallery/main.js?v=20260906r01'", "'/js/gallery/main.js?v=20260906r02'", 'SW gallery JS revision')
          write(path, s)

          # Suburb canonical source: native FAQ buttons, sequential headings, remaining proven contrast.
          path = 'prigorody/_template.html'; s = read(path)
          old_style = '''  <style id="suburb-a11y-contrast">\n    :root:not([data-theme="dark"]) .prigorody-page .calc-opt.selected{color:#2c1a10}\n    :root:not([data-theme="dark"]) .prigorody-page .calc-stepper-val{color:#8a5723}\n    :root:not([data-theme="dark"]) .prigorody-page .nearby-city-card__info{color:#725f50}\n  </style>'''
          new_style = '''  <style id="suburb-a11y-contrast">\n    :root:not([data-theme="dark"]) .prigorody-page .calc-opt.selected{color:#2c1a10}\n    :root:not([data-theme="dark"]) .prigorody-page .calc-stepper-val{color:#8a5723}\n    :root:not([data-theme="dark"]) .prigorody-page .nearby-city-card__info{color:#725f50}\n    :root:not([data-theme="dark"]) .prigorody-page .hero .btn-primary--hero{background:#8f5f25}\n    :root:not([data-theme="dark"]) .prigorody-page .geo-section p,\n    :root:not([data-theme="dark"]) .prigorody-page .seo-section p{color:#725f50}\n    .prigorody-page .delivery-faq .cb-faq-q{width:100%;min-height:48px;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}\n    .prigorody-page .site-footer .wave-text .w,\n    .prigorody-page .site-footer .footer-col>h3{color:#9a8a6d}\n    .prigorody-page .site-footer .footer-col>h3{font-family:'Jost',sans-serif;font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px}\n  </style>'''
          s = once(s, old_style, new_style, 'extend suburb a11y contract')
          for title in ['Ручная Работа','Натуральные Ингредиенты','Свежесть под заказ','Доставка по СПб']:
              s = once(s, f'<h4>{title}</h4>', f'<h3>{title}</h3>', f'feature heading {title}')
          s = once(s, '<h4>Навигация</h4>', '<h3>Навигация</h3>', 'footer heading nav')
          s = once(s, '<h4>Контакты</h4>', '<h3>Контакты</h3>', 'footer heading contacts')

          for i in (1,2,3):
              old = f'''      <div class="faq-item" onclick="cbFaq(this)">\n        <div class="cb-faq-q"><span>{{{{faq_q{i}}}}}</span><div class="cb-faq-ico">+</div></div>'''
              new = f'''      <div class="faq-item">\n        <button type="button" class="cb-faq-q" onclick="cbFaq(this.parentElement)" aria-expanded="false"><span>{{{{faq_q{i}}}}}</span><span class="cb-faq-ico" aria-hidden="true">+</span></button>'''
              s = once(s, old, new, f'FAQ {i} native button')

          old_cb = "function cbFaq(el){\n  var isOpen = el.classList.contains('open');\n  document.querySelectorAll('.faq-item.open').forEach(function(i){ i.classList.remove('open'); });\n  if(!isOpen) el.classList.add('open');\n}"
          new_cb = "function cbFaq(el){\n  var isOpen = el.classList.contains('open');\n  document.querySelectorAll('.faq-item.open').forEach(function(i){ i.classList.remove('open'); var b=i.querySelector('.cb-faq-q'); if(b)b.setAttribute('aria-expanded','false'); });\n  var button=el.querySelector('.cb-faq-q');\n  if(!isOpen){ el.classList.add('open'); if(button)button.setAttribute('aria-expanded','true'); }\n  else if(button)button.setAttribute('aria-expanded','false');\n}"
          s = once(s, old_cb, new_cb, 'FAQ state semantics')
          write(path, s)

          # Three runs makes the post-deploy metric signal less dependent on one noisy sample.
          path = '.github/lighthouse-config.json'; cfg = json.loads(read(path))
          if cfg['ci']['collect'].get('numberOfRuns') != 1: raise SystemExit('unexpected Lighthouse run count')
          cfg['ci']['collect']['numberOfRuns'] = 3
          write(path, json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')

          # Targeted regression coverage for the exact root causes fixed here.
          Path('tests/lighthouse-regressions.spec.js').write_text(r'''const { test, expect } = require('@playwright/test');

test('homepage is paintable at DOMContentLoaded', async ({ page }) => {
  await page.goto('/', { waitUntil: 'domcontentloaded' });
  expect(Number(await page.locator('body').evaluate(el => getComputedStyle(el).opacity))).toBeGreaterThan(0.99);
});

test('gallery exposes its initial LCP candidate without a blocking preloader', async ({ page }) => {
  await page.goto('/gallery/', { waitUntil: 'domcontentloaded' });
  await expect(page.locator('#preloader')).toHaveCount(0);
  const first = page.locator('#galleryGrid .card img.card-media').first();
  await expect(first).toBeVisible();
  await expect(first).toHaveAttribute('fetchpriority', 'high');
  const card = first.locator('xpath=ancestor::button[1]');
  expect(await card.evaluate(el => getComputedStyle(el).animationName)).toBe('none');
  const video = page.locator('#galleryGrid video').first();
  if (await video.count()) await expect(video).toHaveAttribute('preload', 'none');
});

test('Gatchina uses native FAQ buttons and sequential section headings', async ({ page }) => {
  await page.setViewportSize({ width: 412, height: 915 });
  await page.goto('/prigorody/gatchina/', { waitUntil: 'domcontentloaded' });
  await expect(page.locator('#why .feature h4')).toHaveCount(0);
  await expect(page.locator('#why .feature h3')).toHaveCount(4);
  await expect(page.locator('.site-footer .footer-col > h4')).toHaveCount(0);
  const buttons = page.locator('#faq .faq-item > button.cb-faq-q');
  await expect(buttons).toHaveCount(3);
  for (let i=0;i<3;i++) {
    const box = await buttons.nth(i).boundingBox();
    expect(box && box.height).toBeGreaterThanOrEqual(44);
    await expect(buttons.nth(i)).toHaveAttribute('aria-expanded','false');
  }
  await buttons.first().click();
  await expect(buttons.first()).toHaveAttribute('aria-expanded','true');
});
''', 'utf-8')
          PY

          python3 prigorody/build.py
          python3 scripts/check_prigorody_idempotent.py
          python3 scripts/a11y_static.py
          python3 scripts/release_contract.py
          python3 scripts/audit.py
          node --check js/gallery/main.js

      - name: Commit only final source
        shell: bash
        run: |
          rm .github/workflows/tmp-lighthouse-phase2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hardening: fix Lighthouse paint and layout root causes"
          git push origin HEAD:hardening/lighthouse-root-causes-20260906
