name: Docs source-of-truth bootstrap

on:
  push:
    branches: [docs/control-plane-source-of-truth-20260906]

permissions:
  contents: write

jobs:
  sync-docs:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/control-plane-source-of-truth-20260906

      - name: Apply deterministic documentation corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text('utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, 'utf-8')

          # AGENTS.md: make executable contracts authoritative and remove volatile/stale claims.
          replace_exact('AGENTS.md', '**Дата документа:** 2026-09-06 | **Версия:** AGENTS-r3', '**Дата документа:** 2026-09-06 | **Версия:** AGENTS-r5')
          replace_exact('AGENTS.md', 'Сейчас в репо **1458 использований `!important`**. Это плохо. Новые правки:', 'Фактический `!important` debt задаётся **per-file baseline** в `scripts/audit.py` (`IMPORTANT_BUDGET`). Не копируйте сюда агрегатную цифру: executable baseline — единственный источник истины. Новые правки:')
          replace_exact('AGENTS.md', '- Новые `!important` сверх baseline — warning и требуют осознанного объяснения.', '- Новые `!important` сверх baseline — **FAIL/ERROR** в `scripts/audit.py`; повышать baseline можно только отдельным осознанным review, а не вслед за случайно выросшим долгом.')
          replace_exact('AGENTS.md', '''1. `npm run audit:js` — синтаксис runtime JS + `sw.js`.
2. `npm run audit:analytics` — privacy/analytics contract.
3. `npm run audit:a11y` — permanent conformance guards.
4. `npm run audit:release` — exact asset→revision contract.
5. `python3 scripts/check_prigorody_idempotent.py` — генератор пригородов без дрейфа.
6. `npm run audit:security` + `npm run audit` — dependency/security и zero-dependency site audit.
7. `npm run test:playwright` — protected interactions + responsive layout matrix.''', '''1. `npm run audit:js` — синтаксис runtime JS + `sw.js`.
2. `npm run audit:analytics` — privacy/analytics contract.
3. `npm run audit:a11y` — permanent conformance guards.
4. `npm run audit:release` — exact asset→revision contract.
5. `npm run audit:ip-copy` — запрет возврата customer-facing franchise/trademark naming.
6. `npm run audit:video-schema` — provenance/timezone contract для VideoObject.
7. `python3 scripts/check_prigorody_idempotent.py` — генератор пригородов без дрейфа.
8. `npm run audit:security` + `npm run audit` — dependency/security и zero-dependency site audit.
9. `npm run test:playwright` — protected interactions + responsive layout matrix.''')
          replace_exact('AGENTS.md', '2. Поднять `?v=` синхронно', '2. Если менялся runtime CSS/JS — поднять revision **только изменённого asset** во всех его ссылках и в exact entry этого же asset в `sw.js`')
          replace_exact('AGENTS.md', '| «Создать новый JS-файл для…» | См. §2 ⛔. Используй существующие 5. |', '| «Создать новый JS-файл для…» | См. §2 ⛔. Используй существующий runtime allowlist; новый runtime-файл требует явного архитектурного изменения. |')
          replace_exact('AGENTS.md', '| «Один HTML на одной версии, другой на другой — нормально» | См. §6.3. НЕ нормально. |', '| «Один и тот же asset можно подключить с разными `?v=` на разных страницах» | См. §6.2. НЕЛЬЗЯ: revision должен совпадать для конкретной пары `asset → revision`; разные assets могут иметь разные revisions. |')
          replace_exact('AGENTS.md', '''✅ Все 5 проверок из §7 — зелёные
✅ В `git diff` минимум строк изменено
✅ Структура файлов осталась той же (нет новых .css/.js файлов)
✅ Версия `?v=...` поднята и одинакова везде''', '''✅ Все применимые проверки из §7 — зелёные, включая полный `npm run qa`
✅ В `git diff` минимум строк изменено
✅ Структура файлов осталась той же (нет новых .css/.js файлов без явного изменения архитектуры)
✅ Для каждого изменённого runtime asset его `?v=` одинаков во всех ссылках и точно совпадает с entry этого asset в `sw.js`; разные assets могут иметь разные revisions''')
          replace_exact('AGENTS.md', 'alpha ≥ 0.95 (панель непрозрачна)', 'alpha ≥ 0.94 (approved mobile app-shell token; любое снижение ниже token — regression)')
          replace_exact('AGENTS.md', 'alpha фона ≥0.95 + `.has-mc-nav` padding на body', 'alpha фона ≥0.94 + `.has-mc-nav` padding на body')
          replace_exact('AGENTS.md', '| AGENTS-r4 | 2026-06-06 | Добавлены §11 (визуальный контроль — Playwright НЕ достаточно, протокол скриншотов на 8 ширинах, content-aware guard\'ы, правило «верблюда», коварные зоны) и §12 (что можно трогать и в какую сторону + список «не нашего стиля» + премиум-фичи: видео-полоса с магнитным hover, прототип в `_mockups/video-strip-demo.html`). Зафиксировано: синий wave-text hover — ОРИГИНАЛ владельца, не баг. |', '| AGENTS-r4 | 2026-06-06 | Добавлены §11 (визуальный контроль — Playwright НЕ достаточно, протокол скриншотов на 8 ширинах, content-aware guard\'ы, правило «верблюда», коварные зоны) и §12 (что можно трогать и в какую сторону + список «не нашего стиля» + премиум-фичи: видео-полоса с магнитным hover, прототип в `_mockups/video-strip-demo.html`). Зафиксировано: синий wave-text hover — ОРИГИНАЛ владельца, не баг. |\n| AGENTS-r5 | 2026-09-06 | Синхронизированы executable contracts: per-asset revisions, fail-closed `!important` baseline, актуальная QA-цепочка (IP/video-schema), mobile-nav alpha 0.94 и запрет volatile aggregate/version claims. |')

          # README.md: align workflow/QA/deploy descriptions with actual files and package scripts.
          replace_exact('README.md', '    ├── cake-sanity.yml           # npm run qa on push/PR/manual\n    ├── deploy.yml                # sanitized Pages artifact → deploy → exact-SHA witness → IndexNow\n    ├── production-smoke.yml      # scheduled live smoke + exact release semantics\n    └── lighthouse.yml            # post-deploy performance/accessibility telemetry', '    ├── cake-sanity.yml           # npm run qa on PR/manual\n    ├── deep-polish-audit.yml      # PR-only deep source/browser/Pages contract\n    ├── repository-hygiene.yml    # PR + main supply-chain/repository guard\n    ├── branch-cleanup.yml         # cleanup temporary/merged PR branches\n    ├── deploy.yml                 # main → QA → sanitized Pages → exact-SHA witness/smoke → IndexNow\n    ├── production-smoke.yml      # scheduled live smoke + exact release semantics\n    └── lighthouse.yml            # post-deploy performance/accessibility telemetry')
          replace_exact('README.md', '''`npm run qa` запускает:

1. JS syntax check.
2. Prigorody idempotency.
3. `scripts/audit.py`.
4. Playwright desktop/mobile.''', '''`npm run qa` запускает:

1. Runtime JS + Service Worker syntax check.
2. Privacy/analytics contract.
3. Static a11y/conformance guards.
4. Exact asset→revision release contract.
5. IP/customer-copy contract.
6. Video structured-data provenance/timezone contract.
7. Prigorody idempotency.
8. `npm audit --audit-level=high` + `scripts/audit.py`.
9. Playwright desktop/mobile + responsive matrix.''')
          replace_exact('README.md', 'Workflow `.github/workflows/indexnow.yml` автоматически отправляет URL из sitemap после релевантных push.', 'IndexNow встроен в `.github/workflows/deploy.yml`: URL отправляются **только после** успешного deploy, exact-SHA live witness и production smoke. Отдельного `indexnow.yml` в текущей архитектуре нет.')
          replace_exact('README.md', 'Raw CSS/JS totals выводятся как INFO, не как deploy-blocker. Текущий `!important` debt зафиксирован baseline-бюджетом: аудит не шумит на исторический protected debt, но предупредит, если будущая правка увеличит количество `!important` сверх baseline.', 'Raw CSS/JS totals выводятся как INFO, не как deploy-blocker. `!important` debt зафиксирован per-file baseline-бюджетом в `scripts/audit.py`: исторический protected debt допускается, но любое превышение baseline является **ошибкой/FAIL**, а не warning.')
          replace_exact('README.md', '''При изменении CSS/JS обязательно поднять `?v=` синхронно:

- все HTML;
- `js/gallery/main.js` ESM import `data.js`;
- `sw.js` `CACHE_NAME` и `PRECACHE`;
- `prigorody/_template.html`, затем `python3 prigorody/build.py`.''', '''При изменении runtime CSS/JS обновляется revision **только изменённого asset**:

- все HTML/ESM ссылки именно на этот asset;
- exact entry этого же asset в `sw.js` `PRECACHE`;
- `prigorody/_template.html` + `python3 prigorody/build.py`, если asset подключён на generated suburb pages;
- `CACHE_NAME` менять только при осознанном изменении Service Worker cache namespace/semantics, а не автоматически для каждого asset bump;
- затем обязательно `npm run audit:release`.''')

          # llms.txt: align the public maintainer guard with the executable matrix token.
          replace_exact('llms.txt', 'fixed bars are opaque (alpha ≥ 0.95)', 'fixed bars match the approved app-shell surface token (alpha ≥ 0.94)')

          # Fail closed against the exact stale claims we are removing.
          agents = Path('AGENTS.md').read_text('utf-8')
          readme = Path('README.md').read_text('utf-8')
          llms = Path('llms.txt').read_text('utf-8')
          stale = [
              ('AGENTS.md', agents, 'Сейчас в репо **1458 использований `!important`**'),
              ('AGENTS.md', agents, 'Новые `!important` сверх baseline — warning'),
              ('AGENTS.md', agents, 'Версия `?v=...` поднята и одинакова везде'),
              ('AGENTS.md', agents, 'alpha ≥ 0.95'),
              ('README.md', readme, '.github/workflows/indexnow.yml'),
              ('README.md', readme, 'но предупредит, если будущая правка увеличит'),
              ('llms.txt', llms, 'alpha ≥ 0.95'),
          ]
          bad = [f'{path}: {needle}' for path, text, needle in stale if needle in text]
          if bad:
              raise SystemExit('stale documentation claims remain:\n' + '\n'.join(bad))
          print('Documentation source-of-truth transform passed')
          PY

          python3 scripts/audit.py
          python3 scripts/a11y_static.py
          python3 scripts/release_contract.py

      - name: Commit documentation-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md llms.txt
          git diff --cached --quiet && { echo "No documentation changes"; exit 1; }
          git commit -m "docs: align control-plane sources with executable contracts"
          git push origin HEAD:docs/control-plane-source-of-truth-20260906
