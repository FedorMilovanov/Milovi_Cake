name: Temporary Cake live release probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-live-release-probe.yml'

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_BASE: https://milovicake.ru
      EXPECTED_SHA: 5568389e117fd4192e1b0c203599e86fbc96c359
    steps:
      - name: Prove exact release witness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_BASE/release.json?probe=$attempt" || true)"
            echo "attempt=$attempt body=$body"
            if BODY="$body" python3 -c 'import json,os,sys; p=json.loads(os.environ["BODY"]); sys.exit(0 if p.get("repository")=="FedorMilovanov/Milovi_Cake" and p.get("sha")==os.environ["EXPECTED_SHA"] else 1)' 2>/dev/null; then
              echo "Exact live release proven: $EXPECTED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Live release witness did not reach $EXPECTED_SHA" >&2
          exit 1

      - name: Smoke privacy and main surfaces
        shell: bash
        run: |
          set -euo pipefail
          for path in / /privacy/ /gallery/ /o-konditere/; do
            status="$(curl -sS -o /tmp/page.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "$LIVE_BASE$path")"
            echo "$path -> $status"
            test "$status" = "200"
          done

      - name: Prove true 404 contract
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/not-found.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "$LIVE_BASE/__release-proof-missing-page__?probe=${GITHUB_RUN_ID}")"
          echo "missing page -> $status"
          test "$status" = "404"
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('/tmp/not-found.html').read_text('utf-8', errors='replace')
          tags = re.findall(r'<meta\b[^>]*>', html, flags=re.I)
          valid = any(
              re.search(r'\bname=["\x27]robots["\x27]', tag, flags=re.I)
              and re.search(r'\bcontent=["\x27]noindex,\s*follow["\x27]', tag, flags=re.I)
              for tag in tags
          )
          if not valid:
              raise SystemExit('404 response lacks robots noindex, follow')
          print('404 robots contract proven')
          PY

      - name: Prove consent loader is present without inline analytics
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_BASE/" -o /tmp/home.html
          grep -q '/js/consent-analytics.js' /tmp/home.html
          ! grep -q 'googletagmanager.com/gtag/js' /tmp/home.html
          ! grep -q 'mc.yandex.ru/metrika/tag.js' /tmp/home.html
          echo 'Live home uses the local consent loader and contains no direct analytics URL'
