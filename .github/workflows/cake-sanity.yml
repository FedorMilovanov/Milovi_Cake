name: Cake Sanity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cake-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full source and browser QA
        run: npm run qa

      - name: Build sanitized Pages candidate
        run: npm run build:pages

      - name: Audit exact Pages candidate
        run: npm run audit:pages

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  preserve-existing-lcp-traces:
    # Temporary PR #104 job; rearchive the EXISTING 12 traces, no new audit.
    # Remove this job after verifying the archive and its 90-day expiry.
    if: ${{ github.event.pull_request.number == 104 && github.event.pull_request.head.ref == 'arena/6233a51b-milovi-cake' }}
    name: Temporary 12-run raw trace retention (PR 104 only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download original production measurements; verify their digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/milovi-lcp-evidence
          gh run download 40248432996 --repo "$GITHUB_REPOSITORY" \
            --name live-lcp-traces-40248432996-1 --dir /tmp/milovi-lcp-evidence
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/milovi-lcp-evidence')
          expected_sha = 'f325e00de47be2e6723f1c9e8e492b59d1a14843'
          checks = [line.split()[-1] for line in (root / 'release-checks.txt').read_text().splitlines()]
          assert len(checks) == 14 and set(checks) == {expected_sha}, 'Original release checks drifted'
          summary = json.loads((root / 'summary.json').read_text())
          names = sorted([f'bento-{n:02d}' for n in range(1, 9)] +
                         [f'home-{n:02d}' for n in range(1, 5)])
          assert sorted(row['name'] for row in summary) == names, 'Not all original measurements exist'
          files = {}
          for row in summary:
              name = row['name']
              assert row['sha'] == expected_sha and row['lighthouse'] == '12.6.1'
              assert 'HeadlessChrome/155.' in row['userAgent']
              trace = root / f'{name}.report-0.trace.json'
              report = root / f'{name}.report.json'
              trace_hash = hashlib.sha256(trace.read_bytes()).hexdigest()
              assert trace_hash == row['traceSha256'], f'Original raw trace changed: {name}'
              assert report.stat().st_size > 1000, f'Report missing: {name}'
              files[trace.name] = trace_hash
              files[report.name] = hashlib.sha256(report.read_bytes()).hexdigest()
          evidence = {'sourceRun': 40248432996, 'sourceArtifactId': 12619237716,
                      'originalArtifactDigest': 'sha256:ed1b1641e1f1ce117f3600fdd96adcf318ef1bd38e68939d07d62de1b18d8a70',
                      'productionSha': expected_sha, 'releaseChecks': len(checks), 'files': files}
          manifest = root / 'preservation-manifest.json'
          manifest.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n')
          print('Verified 14 original release SHA checks, 12 existing Lighthouse reports '
                'and 12 raw traces against their saved SHA-256; manifest SHA-256: '
                + hashlib.sha256(manifest.read_bytes()).hexdigest())
          PY

      - name: Retain exact verified source files for 90 days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: original-lcp-12-raw-traces-40248432996-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/milovi-lcp-evidence/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
