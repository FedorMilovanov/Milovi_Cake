name: Cake Sanity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cake-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full source and browser QA
        run: npm run qa

      - name: Build sanitized Pages candidate
        run: npm run build:pages

      - name: Audit exact Pages candidate
        run: npm run audit:pages

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  lcp-live-diagnostic:
    if: ${{ github.event.pull_request.number == 104 }}
    name: Temporary live LCP traces (PR 104)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PROD_SHA: f325e00de47be2e6723f1c9e8e492b59d1a14843
      TRACE_DIR: /tmp/milovi-lcp-${{ github.run_id }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'

      - name: Install pinned Lighthouse
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund lighthouse@12.6.1

      - name: Capture sequential cold Lighthouse traces of deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TRACE_DIR"
          lh="$PWD/node_modules/.bin/lighthouse"
          "$lh" --version
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -x "$CHROME_PATH" || { echo '::error::Chrome not found on runner'; exit 1; }
          export CHROME_PATH
          "$CHROME_PATH" --version
          printf 'expected_sha=%s\n' "$EXPECTED_PROD_SHA" > "$TRACE_DIR/environment.txt"
          "$lh" --version >> "$TRACE_DIR/environment.txt"
          "$CHROME_PATH" --version >> "$TRACE_DIR/environment.txt"
          verify_release() {
            local observed
            observed="$(curl --fail --silent --show-error --location --max-time 25 \
              -H 'Cache-Control: no-cache' \
              "https://milovicake.ru/release.json?probe=${GITHUB_RUN_ID}-${RANDOM}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
            printf '%s %s\n' "$(date -u +%FT%TZ)" "$observed" >> "$TRACE_DIR/release-checks.txt"
            test "$observed" = "$EXPECTED_PROD_SHA" || {
              echo "::error::Live SHA $observed does not match $EXPECTED_PROD_SHA"; return 1;
            }
          }
          verify_release
          for page in bento home; do
            if [[ "$page" == bento ]]; then count=8; url=https://milovicake.ru/bento-torty/;
            else count=4; url=https://milovicake.ru/; fi
            for index in $(seq 1 "$count"); do
              verify_release
              name="$(printf '%s-%02d' "$page" "$index")"
              echo "Collecting $name against $EXPECTED_PROD_SHA"
              "$lh" "$url" --output=json --output-path="$TRACE_DIR/$name.report.json" --save-assets \
                --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage' \
                --form-factor=mobile --screenEmulation.mobile=true \
                --screenEmulation.width=412 --screenEmulation.height=915 \
                --screenEmulation.deviceScaleFactor=1.75 --screenEmulation.disabled=false \
                --throttling-method=simulate --throttling.rttMs=150 \
                --throttling.throughputKbps=1638.4 \
                --throttling.cpuSlowdownMultiplier=4 --quiet
            done
          done
          verify_release

      - name: Emit trace analysis as downloadable summary and check annotations
        if: always()
        run: python3 scripts/diagnostics/ci_lighthouse_trace.py "$TRACE_DIR" "$EXPECTED_PROD_SHA"

      - name: Preserve raw Lighthouse artifacts for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-lcp-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/milovi-lcp-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
