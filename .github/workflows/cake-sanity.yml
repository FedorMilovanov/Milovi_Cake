name: Cake Sanity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cake-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full source and browser QA
        run: npm run qa

      - name: Build sanitized Pages candidate
        run: npm run build:pages

      - name: Audit exact Pages candidate
        run: npm run audit:pages

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  inspect-existing-realfont-frames:
    # PR #104 only: read prior completed paired experiment; no new Lighthouse run.
    # Each frame is a separate step to respect the ten-notices-per-step cap.
    if: ${{ github.event.pull_request.number == 104 && github.event.pull_request.head.ref == 'arena/6233a51b-milovi-cake' }}
    name: Temporary saved first-pair visuals (PR 104 only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download original first-pair frames from successful CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 40367413639 --repo "$GITHUB_REPOSITORY" \
            --name oldnew-realfonts-40367413639-1 --dir /tmp/milovi-original-pair-frames

      - name: Review saved bento old frame
        run: python3 scripts/diagnostics/ci_transfer_saved_lcp_frame.py /tmp/milovi-original-pair-frames bento-old
      - name: Review saved bento new frame
        run: python3 scripts/diagnostics/ci_transfer_saved_lcp_frame.py /tmp/milovi-original-pair-frames bento-newer
      - name: Review saved home old frame
        run: python3 scripts/diagnostics/ci_transfer_saved_lcp_frame.py /tmp/milovi-original-pair-frames home-old
      - name: Review saved home new frame
        run: python3 scripts/diagnostics/ci_transfer_saved_lcp_frame.py /tmp/milovi-original-pair-frames home-newer
