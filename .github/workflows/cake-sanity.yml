name: Cake Sanity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cake-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full source and browser QA
        run: npm run qa

      - name: Build sanitized Pages candidate
        run: npm run build:pages

      - name: Audit exact Pages candidate
        run: npm run audit:pages

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  inspect-one-failed-qa:
    # Temporary read-only log transfer for the failed Deep polish audit run.
    # Must be removed before PR 104 is considered ready. No deploy or rerun.
    if: ${{ github.event.pull_request.number == 104 && github.event.pull_request.head.ref == 'arena/6233a51b-milovi-cake' }}
    name: Temporary CI failure diagnosis (PR 104 only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Inspect already-failed browser QA log without rerunning it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/121493036312/logs" \
            --output /tmp/pr104-failed-qa-log.zip
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          import zipfile

          with zipfile.ZipFile('/tmp/pr104-failed-qa-log.zip') as archive:
              choices = [f for f in archive.infolist() if not f.is_dir()]
              assert choices, 'Empty job-log ZIP'
              step = max(choices, key=lambda item: item.file_size)
              text = archive.read(step).decode('utf-8', errors='replace')
              # Carry the first actual Playwright failure and final summary only;
              # no GitHub token, full job archive or other step logs are emitted.
              match = re.search(r'(?m)^\s*1\) \[', text)
              start = text[match.start():match.start() + 9000] if match else ''
              excerpt = start + '\n-- end of failing step --\n' + text[-11000:]
              payload = gzip.compress(json.dumps({
                  'step': step.filename, 'bytes': step.file_size,
                  'excerpt': excerpt}, ensure_ascii=False).encode())
              data = base64.b64encode(payload).decode('ascii')
              chunks = [data[i:i + 3200] for i in range(0, len(data), 3200)]
              assert 1 <= len(chunks) <= 9, 'GitHub annotation limit'
              digest = hashlib.sha256(payload).hexdigest()[:16]
              for index, part in enumerate(chunks, 1):
                  print('::notice file=.github/workflows/cake-sanity.yml,line=1,'
                        f'title=FailedQaLogPart-{digest}-{index:02d}-of-{len(chunks):02d}::{part}',
                        flush=True)
              print(f'Inspected existing failure: {step.filename} ({step.file_size} bytes), '
                    f'{len(chunks)} bounded annotations')
          PY
