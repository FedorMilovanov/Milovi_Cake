name: Cake Sanity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Optional run ID containing a WebKit native investigation artifact'
        required: false
        type: string
      native_run_attempt:
        description: 'Artifact run attempt (default 1)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: cake-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    # A manual artifact inspection is separate from the mandatory PR QA.
    if: github.event_name != 'workflow_dispatch' || inputs.native_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full source and browser QA
        run: npm run qa

      - name: Build sanitized Pages candidate
        run: npm run build:pages

      - name: Audit exact Pages candidate
        run: npm run audit:pages

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  inspect-native-artifact:
    name: Inspect an existing native investigation artifact
    if: github.event_name == 'workflow_dispatch' && inputs.native_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact inspection code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read selected thread stacks from the existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.native_run_id }}
          RUN_ATTEMPT: ${{ inputs.native_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          gh run download "$RUN_ID" --name "webkit-native-$RUN_ID-$RUN_ATTEMPT" --dir "$RUNNER_TEMP/native-artifact"
          python3 scripts/webkit_trace_excerpt.py "$RUNNER_TEMP/native-artifact"
