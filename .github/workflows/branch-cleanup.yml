name: Branch cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-head-branch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch &&
      (
        github.event.pull_request.merged == true ||
        startsWith(github.event.pull_request.head.ref, 'audit/') ||
        startsWith(github.event.pull_request.head.ref, 'ci/') ||
        startsWith(github.event.pull_request.head.ref, 'tmp/') ||
        startsWith(github.event.pull_request.head.ref, 'test/') ||
        startsWith(github.event.pull_request.head.ref, 'diagnostic/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Delete closed PR branch
        run: |
          python3 - <<'PY'
          import os, urllib.error, urllib.parse, urllib.request
          branch=os.environ['HEAD_REF']
          if branch == 'main' or branch.startswith('refs/'):
              raise SystemExit(f'refused unsafe branch: {branch}')
          ref=urllib.parse.quote(f'heads/{branch}', safe='/')
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/refs/{ref}",
              method='DELETE',
              headers={
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
              },
          )
          try:
              with urllib.request.urlopen(req) as response:
                  print(f'deleted {branch}: HTTP {response.status}')
          except urllib.error.HTTPError as exc:
              body=exc.read().decode('utf-8',errors='replace')
              if exc.code == 422 and 'Reference does not exist' in body:
                  print(f'already absent: {branch}')
              else:
                  raise SystemExit(f'HTTP {exc.code}: {body}')
          PY
