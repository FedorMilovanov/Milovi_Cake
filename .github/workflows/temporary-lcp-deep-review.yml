# Temporary PR-only read-only analysis of already captured Lighthouse artifacts.
# No new live browser visits, no production edits, no permanent CI. Delete after review.
name: Temporary LCP multi-release forensic review

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-deep-review.yml
      - scripts/diagnostics/lcp_forensics_temp.py

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostic script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download four existing SHA-verified archives, no new measurement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39945169569 --repo "${{ github.repository }}" -n lighthouse-results -D /tmp/lhr-103
          gh run download 40408519461 --repo "${{ github.repository }}" -n lighthouse-results -D /tmp/lhr-104
          gh run download 40435836396 --repo "${{ github.repository }}" -n lighthouse-results -D /tmp/lhr-106
          gh run download 40340625141 --repo "${{ github.repository }}" \
            -n original-lcp-12-raw-traces-40248432996-40340625141-1 -D /tmp/lcp-raw

      - name: Trace process and compositor work around the historic delayed frame
        run: python3 scripts/diagnostics/lcp_forensics_temp.py trace /tmp/lcp-raw

      - name: Break down all 24 historical #103 Lighthouse results
        run: python3 scripts/diagnostics/lcp_forensics_temp.py release /tmp/lhr-103 103

      - name: Break down all 24 post-telemetry #104 Lighthouse results
        run: python3 scripts/diagnostics/lcp_forensics_temp.py release /tmp/lhr-104 104

      - name: Break down all 24 currently deployed #106 Lighthouse results
        run: python3 scripts/diagnostics/lcp_forensics_temp.py release /tmp/lhr-106 106
