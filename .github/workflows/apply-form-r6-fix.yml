name: Apply exact contact form R6 correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-form-r6-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-form-r6-fix-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true

      - name: Apply R6 form correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('css/milovi-premium-r3.css')
          html_path = Path('index.html')
          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          marker = '/* Corrective R6 — labels float inside fields; outer card contour is explicit. */'
          patch = r'''

          /* Corrective R6 — labels float inside fields; outer card contour is explicit. */
          html:not([data-theme="dark"]) #contacts .card:not(.card--dark) {
            --r6-card-bg:linear-gradient(145deg,#fffdf9 0%,#f7efe4 100%);
            --r6-card-border:rgba(126,82,42,.42);
            --r6-card-ring:rgba(255,255,255,.72);
            --r6-card-shadow:0 28px 70px rgba(74,43,20,.15);
            --r6-field-bg:rgba(255,252,247,.84);
            --r6-field-border:rgba(112,75,42,.31);
            --r6-field-hover:rgba(151,99,50,.50);
            --r6-field-focus:#ae7134;
            --r6-label:#776353;
            --r6-label-active:#9c612b;
            --r6-text:#302117;
            --r6-focus-ring:rgba(174,113,52,.13);
          }
          html[data-theme="dark"] #contacts .card:not(.card--dark) {
            --r6-card-bg:linear-gradient(150deg,#21150e 0%,#100b07 100%);
            --r6-card-border:rgba(226,182,122,.38);
            --r6-card-ring:rgba(255,255,255,.035);
            --r6-card-shadow:0 30px 78px rgba(0,0,0,.40);
            --r6-field-bg:rgba(255,255,255,.025);
            --r6-field-border:rgba(226,198,159,.25);
            --r6-field-hover:rgba(226,198,159,.43);
            --r6-field-focus:#d7a869;
            --r6-label:rgba(231,208,177,.64);
            --r6-label-active:#ddb274;
            --r6-text:#f4e8d5;
            --r6-focus-ring:rgba(215,168,105,.13);
          }

          #contacts .card:not(.card--dark) {
            padding:clamp(36px,4vw,52px) !important;
            border:1px solid var(--r6-card-border) !important;
            border-radius:32px 12px 32px 12px !important;
            background:var(--r6-card-bg) !important;
            box-shadow:0 0 0 1px var(--r6-card-ring),var(--r6-card-shadow) !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark):hover {
            border-color:var(--r6-card-border) !important;
            box-shadow:0 0 0 1px var(--r6-card-ring),var(--r6-card-shadow) !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark) h3 {
            margin:0 0 10px !important;
          }
          #contacts .card:not(.card--dark) form {
            margin-top:26px !important;
          }

          #contacts .card:not(.card--dark) .form-group.float-label {
            position:relative !important;
            min-height:62px !important;
            margin:0 0 16px !important;
            padding:0 !important;
            border:1px solid var(--r6-field-border) !important;
            border-radius:15px !important;
            background:var(--r6-field-bg) !important;
            box-shadow:none !important;
            overflow:hidden !important;
            isolation:isolate !important;
            transform:none !important;
            transition:border-color .20s ease,box-shadow .20s ease,background-color .20s ease !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label::before,
          #contacts .card:not(.card--dark) .form-group.float-label::after {
            content:none !important;
            display:none !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label:hover {
            border-color:var(--r6-field-hover) !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label:focus-within {
            border-color:var(--r6-field-focus) !important;
            box-shadow:0 0 0 3px var(--r6-focus-ring) !important;
            transform:none !important;
          }

          #contacts .card:not(.card--dark) .form-group.float-label input,
          #contacts .card:not(.card--dark) .form-group.float-label textarea {
            position:relative !important;
            z-index:1 !important;
            display:block !important;
            width:100% !important;
            margin:0 !important;
            border:0 !important;
            border-radius:14px !important;
            outline:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            color:var(--r6-text) !important;
            font:400 15px/1.4 'Jost',system-ui,-apple-system,'Segoe UI',sans-serif !important;
            caret-color:var(--r6-field-focus) !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label input {
            min-height:60px !important;
            padding:24px 18px 8px !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label textarea {
            min-height:108px !important;
            padding:29px 18px 14px !important;
            resize:vertical !important;
          }

          #contacts .card:not(.card--dark) .form-group.float-label label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea + label {
            position:absolute !important;
            z-index:3 !important;
            left:18px !important;
            top:50% !important;
            margin:0 !important;
            padding:0 !important;
            border:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            color:var(--r6-label) !important;
            font:400 14px/1 'Jost',system-ui,-apple-system,'Segoe UI',sans-serif !important;
            letter-spacing:0 !important;
            text-transform:none !important;
            transform:translateY(-50%) scale(1) !important;
            transform-origin:left top !important;
            white-space:nowrap !important;
            pointer-events:none !important;
            transition:top .24s cubic-bezier(.22,1,.36,1),transform .24s cubic-bezier(.22,1,.36,1),color .18s ease,font-size .20s ease,letter-spacing .20s ease !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label textarea + label {
            top:18px !important;
            transform:none !important;
          }

          #contacts .card:not(.card--dark) .form-group.float-label input:focus + label,
          #contacts .card:not(.card--dark) .form-group.float-label input:not(:placeholder-shown) + label,
          #contacts .card:not(.card--dark) .form-group.float-label input:-webkit-autofill + label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea:focus + label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea:not(:placeholder-shown) + label {
            top:9px !important;
            padding:0 !important;
            background:transparent !important;
            color:var(--r6-label-active) !important;
            font-size:10.5px !important;
            font-weight:500 !important;
            letter-spacing:.055em !important;
            text-transform:none !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label label::before {
            content:none !important;
            display:none !important;
          }

          #contacts .card:not(.card--dark) .form-note {
            margin:10px 0 0 !important;
            font-size:11.5px !important;
            line-height:1.55 !important;
          }
          #contacts .card:not(.card--dark) .btn-wa {
            margin-top:20px !important;
          }

          @media (max-width:768px) {
            #contacts .card:not(.card--dark) {
              padding:30px 22px !important;
              border-radius:26px 10px 26px 10px !important;
              box-shadow:0 0 0 1px var(--r6-card-ring),0 20px 52px rgba(0,0,0,.14) !important;
            }
            #contacts .card:not(.card--dark) .form-group.float-label {
              min-height:60px !important;
            }
            #contacts .card:not(.card--dark) .form-group.float-label textarea {
              min-height:104px !important;
            }
          }
          '''

          if marker not in css:
              css = css.rstrip() + patch + '\n'
          html = html.replace('milovi-premium-r3.css?v=20260803r5', 'milovi-premium-r3.css?v=20260803r6')

          css_path.write_text(css, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Verify exact R6 state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css = Path('css/milovi-premium-r3.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Corrective R6',
              '--r6-card-border',
              'box-shadow:0 0 0 1px var(--r6-card-ring)',
              'top:9px !important',
              'background:transparent !important',
              'milovi-premium-r3.css?v=20260803r6',
          ]
          missing = [item for item in required if item not in css and item not in html]
          if missing:
              raise SystemExit(f'missing R6 markers: {missing}')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace imbalance')
          print('Exact R6 form verification passed')
          PY

      - name: Commit product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add css/milovi-premium-r3.css index.html
          if git diff --cached --quiet; then
            echo 'R6 already applied.'
            exit 0
          fi
          git commit -m 'fix: keep labels inside fields and restore form contour'
          git push origin HEAD:main
