name: IP copy bootstrap

on:
  push:
    branches: [hardening/ip-copy-contract-20260906]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hardening/ip-copy-contract-20260906

      - name: Apply reviewed commercial-copy replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          targets = [p for p in root.rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts and '_site' not in p.parts]
          targets += [
              Path('js/main.js'),
              Path('js/gallery/data.js'),
              Path('prigorody/_cities.csv'),
              Path('sw.js'),
          ]

          literal_replacements = [
              ('Белый сникерс', 'Ванильная карамель с арахисом'),
              ('Белый Сникерс', 'Ванильная карамель с арахисом'),
              ('Сникерс', 'Шоколадная карамель с арахисом'),
              ('сникерс', 'шоколадная карамель с арахисом'),
              ('Ферреро', 'Шоколадный ореховый хруст'),
              ('ферреро', 'шоколадный ореховый хруст'),
              ('3D-торт в стиле Minecraft', '3D-торт с игровым тематическим декором'),
              ('3D-торт Minecraft с зеленью', '3D-торт с игровым декором и зеленью'),
              ('3D-торт Minecraft', '3D-торт с игровым декором'),
              ('near-identical Minecraft cakes', 'near-identical game-themed cakes'),
              ('детские с персонажами', 'детские с индивидуальным тематическим декором'),
              ('любимыми персонажами', 'индивидуальным тематическим декором'),
              ('торт с персонажами', 'торт с индивидуальным тематическим декором'),
          ]

          for path in targets:
              if not path.exists() or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in literal_replacements:
                  updated = updated.replace(old, new)
              if path.suffix == '.html':
                  updated = updated.replace('js/main.js?v=20260728r27', 'js/main.js?v=20260906r01')
                  updated = updated.replace('/js/main.js?v=20260728r27', '/js/main.js?v=20260906r01')
                  updated = updated.replace('js/gallery/data.js?v=20260728r27', 'js/gallery/data.js?v=20260906r01')
                  updated = updated.replace('/js/gallery/data.js?v=20260728r27', '/js/gallery/data.js?v=20260906r01')
              if path == Path('sw.js'):
                  updated = updated.replace("'/js/main.js?v=20260728r27'", "'/js/main.js?v=20260906r01'")
                  updated = updated.replace("'/js/gallery/data.js?v=20260728r27'", "'/js/gallery/data.js?v=20260906r01'")
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'updated {path}')
          PY

      - name: Rebuild canonical suburb pages
        run: python3 prigorody/build.py

      - name: Run fail-closed source audits
        run: npm run audit:all

      - name: Commit deterministic migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' js/main.js js/gallery/data.js sw.js prigorody
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git commit -m 'fix(ip): replace third-party commercial naming'
          git push origin HEAD:hardening/ip-copy-contract-20260906
