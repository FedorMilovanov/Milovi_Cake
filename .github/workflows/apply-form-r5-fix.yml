name: Apply corrective contact form R5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-form-r5-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-form-r5-fix-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true

      - name: Apply corrective form patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('css/milovi-premium-r3.css')
          html_path = Path('index.html')
          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          marker = '/* Corrective R5 — restore real floating labels and a visible order-form card. */'
          patch = r'''

          /* Corrective R5 — restore real floating labels and a visible order-form card. */
          html:not([data-theme="dark"]) #contacts .card:not(.card--dark) {
            --mc-card-bg:linear-gradient(145deg,#fffaf5 0%,#f8efe2 100%);
            --mc-card-border:rgba(128,87,46,.24);
            --mc-card-shadow:0 30px 76px rgba(81,48,22,.14),inset 0 1px 0 rgba(255,255,255,.90);
            --mc-field-bg:#fffaf2;
            --mc-field-border:rgba(105,72,43,.28);
            --mc-field-border-hover:rgba(154,104,54,.46);
            --mc-field-border-focus:#b47a39;
            --mc-label:#806b59;
            --mc-label-active:#98602c;
            --mc-label-chip-bg:#fffaf2;
            --mc-text:#302117;
          }
          html[data-theme="dark"] #contacts .card:not(.card--dark) {
            --mc-card-bg:linear-gradient(150deg,rgba(33,20,12,.96) 0%,rgba(13,9,6,.96) 100%);
            --mc-card-border:rgba(220,178,117,.27);
            --mc-card-shadow:0 30px 76px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.035);
            --mc-field-bg:rgba(255,255,255,.028);
            --mc-field-border:rgba(226,198,159,.22);
            --mc-field-border-hover:rgba(226,198,159,.38);
            --mc-field-border-focus:#d7a869;
            --mc-label:rgba(231,208,177,.62);
            --mc-label-active:#d7a869;
            --mc-label-chip-bg:#17100b;
            --mc-text:#f4e8d5;
          }

          #contacts .card:not(.card--dark) {
            padding:clamp(34px,3.8vw,52px) !important;
            border:1px solid var(--mc-card-border) !important;
            border-radius:34px 12px 34px 12px !important;
            background:var(--mc-card-bg) !important;
            box-shadow:var(--mc-card-shadow) !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark):hover {
            border-color:var(--mc-card-border) !important;
            box-shadow:var(--mc-card-shadow) !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark) h3 { margin:0 0 8px !important; }
          #contacts .card:not(.card--dark) form { margin-top:28px !important; }

          #contacts .card:not(.card--dark) .form-group.float-label {
            position:relative !important;
            min-height:58px !important;
            margin:0 0 18px !important;
            padding:0 !important;
            border:1px solid var(--mc-field-border) !important;
            border-radius:15px !important;
            background:var(--mc-field-bg) !important;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.025) !important;
            overflow:visible !important;
            isolation:isolate !important;
            transform:none !important;
            transition:border-color .22s ease,box-shadow .22s ease !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label::before {
            content:none !important;
            display:none !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label:hover {
            border-color:var(--mc-field-border-hover) !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label:focus-within {
            border-color:var(--mc-field-border-focus) !important;
            box-shadow:0 0 0 3px color-mix(in srgb,var(--mc-field-border-focus) 12%,transparent),0 12px 28px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.04) !important;
            transform:none !important;
          }

          #contacts .card:not(.card--dark) .form-group.float-label input,
          #contacts .card:not(.card--dark) .form-group.float-label textarea {
            position:relative !important;
            z-index:1 !important;
            display:block !important;
            width:100% !important;
            margin:0 !important;
            border:0 !important;
            border-radius:14px !important;
            outline:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            color:var(--mc-text) !important;
            font:400 15px/1.4 'Jost',system-ui,-apple-system,'Segoe UI',sans-serif !important;
            caret-color:var(--mc-field-border-focus) !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label input {
            min-height:58px !important;
            padding:18px !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label textarea {
            min-height:108px !important;
            padding:21px 18px 14px !important;
            resize:vertical;
          }

          #contacts .card:not(.card--dark) .form-group.float-label label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea + label {
            position:absolute !important;
            z-index:3 !important;
            left:17px !important;
            top:50% !important;
            margin:0 !important;
            padding:0 !important;
            border:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            color:var(--mc-label) !important;
            font:400 14px/1 'Jost',system-ui,-apple-system,'Segoe UI',sans-serif !important;
            letter-spacing:0 !important;
            text-transform:none !important;
            transform:translateY(-50%) scale(1) !important;
            transform-origin:left center !important;
            white-space:nowrap !important;
            pointer-events:none !important;
            transition:top .26s cubic-bezier(.22,1,.36,1),transform .26s cubic-bezier(.22,1,.36,1),color .18s ease,font-size .22s ease,letter-spacing .22s ease,padding .18s ease,background-color .18s ease !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label textarea + label {
            top:20px !important;
            transform:translateY(0) scale(1) !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label input:focus + label,
          #contacts .card:not(.card--dark) .form-group.float-label input:not(:placeholder-shown) + label,
          #contacts .card:not(.card--dark) .form-group.float-label input:-webkit-autofill + label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea:focus + label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea:not(:placeholder-shown) + label {
            top:0 !important;
            transform:translate3d(0,-50%,0) scale(.90) !important;
            padding:0 7px !important;
            background:var(--mc-label-chip-bg) !important;
            color:var(--mc-label-active) !important;
            font-size:12px !important;
            font-weight:500 !important;
            letter-spacing:.025em !important;
            text-transform:none !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label label::before {
            content:none !important;
            display:none !important;
          }

          #contacts .card:not(.card--dark) .form-note {
            margin:10px 0 0 !important;
            font-size:11.5px !important;
            line-height:1.55 !important;
          }
          #contacts .card:not(.card--dark) .btn-wa { margin-top:20px !important; }

          @media (max-width:768px) {
            #contacts .card:not(.card--dark) {
              padding:28px 22px !important;
              border-radius:26px 10px 26px 10px !important;
            }
            #contacts .card:not(.card--dark) .form-group.float-label textarea {
              min-height:104px !important;
            }
          }
          '''

          if marker not in css:
              css = css.rstrip() + patch + '\n'
          html = html.replace('milovi-premium-r3.css?v=20260803r4', 'milovi-premium-r3.css?v=20260803r5')

          css_path.write_text(css, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Verify corrective state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css = Path('css/milovi-premium-r3.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Corrective R5',
              '--mc-card-border',
              'border:1px solid var(--mc-card-border)',
              'input:not(:placeholder-shown) + label',
              'textarea:not(:placeholder-shown) + label',
              'min-height:108px',
              'milovi-premium-r3.css?v=20260803r5',
          ]
          missing = [item for item in required if item not in css and item not in html]
          if missing:
              raise SystemExit(f'missing R5 markers: {missing}')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace imbalance')
          print('Corrective R5 verification passed')
          PY

      - name: Commit clean main
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/apply-form-r5-fix.yml 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'R5 already applied; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: restore order form labels and visible card'
          git push origin HEAD:main

# trigger: initial
