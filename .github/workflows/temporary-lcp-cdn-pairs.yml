# Temporary PR-only free lab experiment on the *already deployed* release.
# Delete this workflow and its runner after collecting evidence. No deploy/merge.
name: Temporary production CDN LCP pairs

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-cdn-pairs.yml
      - scripts/diagnostics/lcp_cdn_pairs_temp.cjs

permissions:
  contents: read
  actions: read

jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # PR #106 deployed while this experiment was being prepared; never mix releases.
      EXPECTED_RELEASE_SHA: e4cc47a5478a2cd1cc29096f51e310633919f3e2
      # Existing Lighthouse release report uses Chrome 155; do not mix Chrome 153.
      LCP_PROBE_CHANNEL: chrome
      LCP_REQUIRE_CHROME_MAJOR: '155'
    steps:
      - name: Checkout PR diagnostic tools only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install isolated browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify deployed release SHA before measurements
        run: |
          if python3 scripts/production_release_smoke.py --retries 2 --delay 5 > /tmp/lcp-release-proof.log 2>&1; then
            cat /tmp/lcp-release-proof.log
          else
            echo "::error title=Live release proof failed::$(head -n 8 /tmp/lcp-release-proof.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Run alternating allow/block SW pairs against real production CDN and fonts
        run: |
          if node scripts/diagnostics/lcp_cdn_pairs_temp.cjs > /tmp/lcp-cdn-pairs.log 2>&1; then
            cat /tmp/lcp-cdn-pairs.log
          else
            cat /tmp/lcp-cdn-pairs.log
            echo "::error title=CDN pairs failed::$(tail -n 8 /tmp/lcp-cdn-pairs.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Summarize all captured trials in compact check annotations
        run: python3 scripts/diagnostics/lcp_cdn_review_temp.py /tmp/milovi-lcp-cdn-pairs

      - name: Verify deployed release SHA after measurements
        run: |
          if python3 scripts/production_release_smoke.py --retries 1 > /tmp/lcp-release-proof.log 2>&1; then
            cat /tmp/lcp-release-proof.log
          else
            echo "::error title=Live release changed during experiment::$(head -n 8 /tmp/lcp-release-proof.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Read already existing new-release Lighthouse results (no new audit)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40435836396 --repo "${{ github.repository }}" -n lighthouse-results -D /tmp/lcp-new-release-lhr
          python3 - <<'PY'
          import json, pathlib, statistics
          rows = {}
          for f in pathlib.Path('/tmp/lcp-new-release-lhr').rglob('*.report.json'):
              d = json.loads(f.read_text())
              url = d.get('finalUrl', '')
              if url in ('https://milovicake.ru/', 'https://milovicake.ru/bento-torty/'):
                  a = d.get('audits', {})
                  rows.setdefault(url, []).append((round(a['largest-contentful-paint']['numericValue']),
                      round(a['metrics']['details']['items'][0].get('observedLargestContentfulPaint', 0))))
          for url, values in rows.items():
              print(f'::notice title=Existing #106 LHR {url}::simulated/raw {values}, simulated median {statistics.median(x[0] for x in values)}')
          if len(rows) != 2:
              raise SystemExit(f'Expected both production URLs, found {list(rows)}')
          PY

      - name: Keep bounded anonymous lab traces outside Git
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-live-lcp-pairs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/milovi-lcp-cdn-pairs/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false
