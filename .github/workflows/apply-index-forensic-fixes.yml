name: Apply audited INDEX fixes

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/INDEX-FORENSIC-APPLY.md'
      - 'scripts/apply_forensic_index_fixes.py'

permissions:
  contents: write

concurrency:
  group: apply-index-forensic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: startsWith(github.head_ref, 'audit/index-forensic-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Apply deterministic audited replacements
        run: python3 scripts/apply_forensic_index_fixes.py

      - name: Commit only when source changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Audited fixes are already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/premium-overrides.css css/v20-fixes.css tests/index-forensic-audit.spec.js
          git commit -m 'fix: resolve forensic index findings'
          git push origin "HEAD:${{ github.head_ref }}"
