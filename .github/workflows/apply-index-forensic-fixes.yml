name: Apply audited INDEX fixes

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/INDEX-FORENSIC-APPLY.md'
      - 'docs/INDEX-FORENSIC-CLEANUP.md'
      - 'scripts/apply_forensic_index_fixes.py'
      - 'scripts/apply_forensic_index_round2.py'
      - 'scripts/apply_forensic_index_round3.py'
      - 'scripts/apply_forensic_index_round4.py'
      - 'scripts/apply_forensic_index_round5.py'
      - 'scripts/apply_forensic_index_round6.py'
      - 'scripts/apply_forensic_index_round7.py'
      - 'scripts/apply_forensic_index_round8.py'
      - 'scripts/apply_forensic_index_round9.py'
      - 'scripts/apply_forensic_index_round10.py'
      - 'scripts/apply_forensic_index_round11.py'
      - 'scripts/apply_forensic_index_round12.py'

permissions:
  contents: write

concurrency:
  group: apply-index-forensic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: startsWith(github.head_ref, 'audit/index-forensic-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Apply or clean forensic worktree
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/INDEX-FORENSIC-CLEANUP.md ]; then
            git rm -f \
              docs/INDEX-FORENSIC-CLEANUP.md \
              scripts/apply_forensic_index_fixes.py \
              scripts/apply_forensic_index_round2.py \
              scripts/apply_forensic_index_round3.py \
              scripts/apply_forensic_index_round4.py \
              scripts/apply_forensic_index_round5.py \
              scripts/apply_forensic_index_round6.py \
              scripts/apply_forensic_index_round7.py \
              scripts/apply_forensic_index_round8.py \
              scripts/apply_forensic_index_round9.py \
              scripts/apply_forensic_index_round10.py \
              scripts/apply_forensic_index_round11.py \
              scripts/apply_forensic_index_round12.py \
              tests/index-forensic-audit.spec.js
            exit 0
          fi
          if [ -f scripts/apply_forensic_index_round12.py ]; then
            python3 scripts/apply_forensic_index_round12.py
          elif [ -f scripts/apply_forensic_index_round11.py ]; then
            python3 scripts/apply_forensic_index_round11.py
          elif [ -f scripts/apply_forensic_index_round10.py ]; then
            python3 scripts/apply_forensic_index_round10.py
          elif [ -f scripts/apply_forensic_index_round9.py ]; then
            python3 scripts/apply_forensic_index_round9.py
          elif [ -f scripts/apply_forensic_index_round8.py ]; then
            python3 scripts/apply_forensic_index_round8.py
          elif [ -f scripts/apply_forensic_index_round7.py ]; then
            python3 scripts/apply_forensic_index_round7.py
          elif [ -f scripts/apply_forensic_index_round6.py ]; then
            python3 scripts/apply_forensic_index_round6.py
          elif [ -f scripts/apply_forensic_index_round5.py ]; then
            python3 scripts/apply_forensic_index_round5.py
          elif [ -f scripts/apply_forensic_index_round4.py ]; then
            python3 scripts/apply_forensic_index_round4.py
          elif [ -f scripts/apply_forensic_index_round3.py ]; then
            python3 scripts/apply_forensic_index_round3.py
          elif [ -f scripts/apply_forensic_index_round2.py ]; then
            python3 scripts/apply_forensic_index_round2.py
          else
            python3 scripts/apply_forensic_index_fixes.py
          fi

      - name: Commit only when source changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --cached && git diff --quiet; then
            echo 'Audited fixes are already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary forensic audit files'
          git push origin "HEAD:${{ github.head_ref }}"
