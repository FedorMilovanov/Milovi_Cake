name: Issue 100 transport protocol lab (no production changes)
on:
  push:
    branches: [arena/issue100-protocol-ab-20261108]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact published main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 25b4ef4633c9ef9cce093c3479a5b31db58f659c
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
      - name: Build exact source artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 25b4ef4633c9ef9cce093c3479a5b31db58f659c
          RELEASE_SHA=25b4ef4633c9ef9cce093c3479a5b31db58f659c npm run build:pages
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Start identical HTTP1 cleartext, HTTPS1 and HTTPS2 servers
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$RUNNER_TEMP/proto.key" -out "$RUNNER_TEMP/proto.crt" -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
          cat > "$RUNNER_TEMP/servers.cjs" <<'SERVER'
          'use strict';
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const http=require('http'),https=require('https'),http2=require('http2');
          const root=path.resolve('_site');
          const types={'.html':'text/html; charset=utf-8','.css':'text/css; charset=utf-8',
            '.js':'application/javascript; charset=utf-8','.json':'application/json',
            '.svg':'image/svg+xml','.png':'image/png','.webp':'image/webp',
            '.avif':'image/avif','.woff2':'font/woff2','.xml':'application/xml'};
          const compressed=new Set(['.html','.css','.js','.json','.svg','.xml','.txt']);
          function respond(req,res){
            try{
              const url=new URL(req.url,'https://localhost');
              const pn=decodeURIComponent(url.pathname);
              const rel=pn.endsWith('/')?pn+'index.html':pn;
              const f=path.resolve(root,'.'+rel);
              if(!f.startsWith(root+path.sep))throw Error('unsafe path');
              const ext=path.extname(f).toLowerCase();
              let body=fs.readFileSync(f);
              const headers={'content-type':types[ext]||'application/octet-stream','cache-control':'no-cache'};
              if(compressed.has(ext)&&body.length>512&&/gzip/.test(req.headers['accept-encoding']||'')){
                body=zlib.gzipSync(body,{level:6});
                headers['content-encoding']='gzip';
                headers['vary']='Accept-Encoding';
              }
              headers['content-length']=String(body.length);
              res.writeHead(200,headers);res.end(body);
            }catch(e){res.writeHead(404);res.end('not found')}
          }
          const tls={key:fs.readFileSync(process.env.RUNNER_TEMP+'/proto.key'),
            cert:fs.readFileSync(process.env.RUNNER_TEMP+'/proto.crt')};
          http.createServer(respond).listen(4400,'127.0.0.1',()=>console.log('LISTEN A http1'));
          https.createServer(tls,respond).listen(4401,'127.0.0.1',()=>console.log('LISTEN B https1'));
          http2.createSecureServer({...tls,allowHTTP1:false},respond).listen(4402,'127.0.0.1',()=>console.log('LISTEN C https2'));
          SERVER
          nohup node "$RUNNER_TEMP/servers.cjs" > "$RUNNER_TEMP/proto-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4400/release.json >/dev/null 2>&1 &&
               curl -kfsS https://127.0.0.1:4401/release.json >/dev/null 2>&1 &&
               curl -kfsS --http2 https://127.0.0.1:4402/release.json >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - name: Verify transport and identical decompressed page bytes
        run: |
          set -euo pipefail
          for r in / /prigorody/gatchina/ /css/style.css /img/head_mobile-640.avif /js/main.js; do
            curl -fsS --compressed http://127.0.0.1:4400$r -o /tmp/assetA
            curl -kfsS --compressed --http1.1 https://127.0.0.1:4401$r -o /tmp/assetB
            curl -kfsS --compressed --http2 https://127.0.0.1:4402$r -o /tmp/assetC
            cmp /tmp/assetA /tmp/assetB && cmp /tmp/assetA /tmp/assetC
            echo "IDENTICAL $r $(stat -c%s /tmp/assetA) bytes"
          done
          test "$(curl -kfsS -o /dev/null -w '%{http_version}' https://127.0.0.1:4401/)" = '1.1'
          test "$(curl -kfsS --http2 -o /dev/null -w '%{http_version}' https://127.0.0.1:4402/)" = '2'
      - name: Install pinned Lighthouse 12.6.1
        run: |
          npm install --prefix "$RUNNER_TEMP/lh" --no-audit --no-fund lighthouse@12.6.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Collect 24 Lighthouse samples in alternating A B C C B A order
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > "$RUNNER_TEMP/lh-config.cjs" <<'CONFIG'
          module.exports={
            extends:'lighthouse:default',
            settings:{
              onlyCategories:['performance'],throttlingMethod:'simulate',formFactor:'mobile',
              screenEmulation:{mobile:true,width:412,height:915,deviceScaleFactor:1.75,disabled:false},
              throttling:{rttMs:150,throughputKbps:1638.4,cpuSlowdownMultiplier:4}
            }
          };
          CONFIG
          LH="$RUNNER_TEMP/lh/node_modules/.bin/lighthouse"
          for route in home gatchina; do
            if [ "$route" = home ]; then rp=/; else rp=/prigorody/gatchina/; fi
            n=0
            for arm in A B C C B A A B C C B A; do
              n=$((n+1))
              case "$arm" in
                A) url="http://127.0.0.1:4400$rp";;
                B) url="https://127.0.0.1:4401$rp";;
                C) url="https://127.0.0.1:4402$rp";;
              esac
              "$LH" "$url" --config-path="$RUNNER_TEMP/lh-config.cjs" --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage --ignore-certificate-errors' --output=json --output-path="evidence/$route-$n-$arm.json" --quiet
              echo "SAMPLE $route $arm $n"
            done
          done
      - name: Assert network protocol from every LHR and compare metrics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,statistics as st
          files=list(Path('evidence').glob('*.json'))
          if len(files)!=24:raise SystemExit('INCOMPLETE '+str(len(files))+'/24 reports')
          for route in ['home','gatchina']:
            for arm,proto in [('A','http/1.1'),('B','http/1.1'),('C','h2')]:
              reports=sorted(p for p in files if p.stem.startswith(route+'-') and p.stem.endswith('-'+arm))
              if len(reports)!=4:raise SystemExit('BAD ARM COUNT '+route+arm)
              values=[]
              for f in reports:
                a=json.loads(f.read_text())
                req=a['audits']['network-requests']['details']['items']
                document=next(x for x in req if x.get('resourceType')=='Document')
                if document['protocol']!=proto:raise SystemExit('WRONG PROTOCOL: '+f.name+' '+document['protocol'])
                m=a['audits']['metrics']['details']['items'][0]
                values.append({k:round(m[k]) for k in ('firstContentfulPaint','largestContentfulPaint','totalBlockingTime','observedLargestContentfulPaint')})
              print('DATA',route,arm,proto,values)
              print('MEDIANS',route,arm,{k:st.median(v[k] for v in values) for k in values[0]})
              print('LCP<=2500',route,arm,sum(v['largestContentfulPaint']<=2500 for v in values),'/4')
          PY
      - name: Keep primary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue100-protocol-A-B-C
          path: evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
