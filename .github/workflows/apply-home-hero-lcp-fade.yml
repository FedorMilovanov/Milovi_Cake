name: Apply homepage LCP fade fix

on:
  push:
    branches: [hardening/home-hero-lcp-fade-20260906]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/home-hero-lcp-fade-20260906

      - name: Apply exact source and regression patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text('utf-8')
          old_img = '      <img src="img/head_desktop.webp" alt="Авторский торт ручной работы — Milovi Cake, Санкт-Петербург" fetchpriority="high" decoding="async" width="1440" height="960" />'
          new_img = '      <img class="hero-img" src="img/head_desktop.webp" alt="Авторский торт ручной работы — Milovi Cake, Санкт-Петербург" fetchpriority="high" decoding="async" width="1440" height="960" />'
          if html.count(old_img) != 1:
              raise SystemExit(f'expected exactly one homepage hero img, found {html.count(old_img)}')
          index.write_text(html.replace(old_img, new_img, 1), 'utf-8')

          guard = Path('scripts/lighthouse_regressions.py')
          text = guard.read_text('utf-8')
          old = '''home = read('index.html')
          require('id="anti-fouc-body"' not in home, 'homepage body-level anti-FOUC gate returned')
          require('body:not(.ready){opacity:0}' not in home, 'homepage can still be hidden before DOMContentLoaded')
          '''
          new = '''home = read('index.html')
          require('id="anti-fouc-body"' not in home, 'homepage body-level anti-FOUC gate returned')
          require('body:not(.ready){opacity:0}' not in home, 'homepage can still be hidden before DOMContentLoaded')
          require(
              '<img class="hero-img" src="img/head_desktop.webp"' in home,
              'homepage LCP hero is not explicitly excluded from the generic image fade',
          )
          main_js = read('js/main.js')
          require(
              'img:not(.hero-img):not([class*="head"])' in main_js,
              'homepage hero exclusion disappeared from the generic image fade selector',
          )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one homepage regression anchor, found {text.count(old)}')
          guard.write_text(text.replace(old, new, 1), 'utf-8')
          PY

          python3 scripts/lighthouse_regressions.py
          git diff --check
          rm .github/workflows/apply-home-hero-lcp-fade.yml

      - name: Commit durable source-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Perf: keep homepage LCP hero visible before load"
          git push origin HEAD:hardening/home-hero-lcp-fade-20260906
