name: Temporary homepage hero-motion patch

on:
  push:
    branches:
      - perf/homepage-defer-hero-motion-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/perf/homepage-defer-hero-motion-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          expected_base='aad21475d732244fdceca95bbff0ed2aa83d127d'
          actual_base="$(git rev-parse HEAD^)"
          [[ "$actual_base" == "$expected_base" ]] || { echo "staging parent drifted: expected $expected_base got $actual_base" >&2; exit 2; }

      - name: Apply exact source and cache-coherence patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          style_path = Path('css/style.css')
          style = read(style_path)
          old_motion = """.hero-photo-bg img{will-change:transform;transform-origin:64% 42%}
          .hero--visible .hero-photo-bg img{animation:heroKenBurns 26s cubic-bezier(.37,0,.63,1) infinite alternate both}
          @media (prefers-reduced-motion:reduce){
            .hero--visible .hero-photo-bg img{animation:none}
          }"""
          new_motion = """.hero-photo-bg img{transform-origin:64% 42%}
          .hero--visible.hero--motion-ready .hero-photo-bg img{will-change:transform;animation:heroKenBurns 26s cubic-bezier(.37,0,.63,1) infinite alternate both}
          @media (prefers-reduced-motion:reduce){
            .hero--visible.hero--motion-ready .hero-photo-bg img{animation:none}
          }"""
          style = replace_once(style, old_motion, new_motion, 'hero motion CSS')
          write(style_path, style)

          main_path = Path('js/main.js')
          main = read(main_path)
          anchor = """})();

          // ── SMOOTH IMAGE FADE ──"""
          inserted = """})();

          // ── DEFER DECORATIVE HOMEPAGE HERO MOTION OUT OF INITIAL LCP WINDOW ──
          (function initDeferredHeroMotion() {
            var hero = document.querySelector('.hero');
            if (!hero) return;
            var path = window.location.pathname.replace(/\\/+$/, '') || '/';
            var isHomepage = path === '/' || path === '/index.html';
            var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) return;
            if (!isHomepage) { hero.classList.add('hero--motion-ready'); return; }

            var enabled = false;
            var fallbackTimer = null;
            function enableHeroMotion() {
              if (enabled) return;
              enabled = true;
              if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
              hero.classList.add('hero--motion-ready');
            }
            function enableAfterIntent() { setTimeout(enableHeroMotion, 0); }
            function armFallback() {
              if (enabled || fallbackTimer) return;
              fallbackTimer = setTimeout(enableHeroMotion, 8000);
            }

            document.addEventListener('pointerdown', enableAfterIntent, { once: true, passive: true });
            document.addEventListener('keydown', enableAfterIntent, { once: true });
            if (document.readyState === 'complete') armFallback();
            else window.addEventListener('load', armFallback, { once: true });
          })();

          // ── SMOOTH IMAGE FADE ──"""
          main = replace_once(main, anchor, inserted, 'hero motion JS anchor')
          write(main_path, main)

          style_old = 'style.css?v=20260906r03'
          style_new = 'style.css?v=20260907r01'
          main_old = 'main.js?v=20260906r01'
          main_new = 'main.js?v=20260907r01'
          style_replacements = 0
          main_replacements = 0
          for path in sorted(Path('.').rglob('*.html')):
              text = read(path)
              next_text = text
              if style_old in next_text:
                  n = next_text.count(style_old); next_text = next_text.replace(style_old, style_new); style_replacements += n
              if main_old in next_text:
                  n = next_text.count(main_old); next_text = next_text.replace(main_old, main_new); main_replacements += n
              if next_text != text: write(path, next_text)
          if style_replacements < 1: raise SystemExit('no shared style revision references were updated')
          if main_replacements < 1: raise SystemExit('no shared main.js revision references were updated')

          sw_path = Path('sw.js')
          sw = read(sw_path)
          for old, new, label in [
              ('V20260906-R80', 'V20260907-R81', 'SW header generation'),
              ("const CACHE_NAME = 'milovi-cake-v2026.09.06-r80';", "const CACHE_NAME = 'milovi-cake-v2026.09.07-r81';", 'SW cache name'),
              ("'/css/style.css?v=20260906r03',", "'/css/style.css?v=20260907r01',", 'SW style precache'),
              ("'/js/main.js?v=20260906r01',", "'/js/main.js?v=20260907r01',", 'SW main precache'),
          ]:
              sw = replace_once(sw, old, new, label)
          write(sw_path, sw)

          reg_path = Path('scripts/lighthouse_regressions.py')
          reg = read(reg_path)
          reg = reg.replace('style.css?v=20260906r03', 'style.css?v=20260907r01')
          reg = replace_once(
              reg,
              "require(\n    'img:not(.hero-img):not([class*=\"head\"])' in main_js,\n    'homepage hero exclusion disappeared from the generic image fade selector',\n)\n",
              "require(\n    'img:not(.hero-img):not([class*=\"head\"])' in main_js,\n    'homepage hero exclusion disappeared from the generic image fade selector',\n)\nrequire(\n    \"var isHomepage = path === '/' || path === '/index.html';\" in main_js,\n    'homepage-specific decorative hero-motion gate missing',\n)\nrequire(\n    \"hero.classList.add('hero--motion-ready');\" in main_js\n    and \"fallbackTimer = setTimeout(enableHeroMotion, 8000);\" in main_js,\n    'homepage decorative hero motion is no longer bounded outside the initial LCP window',\n)\nrequire(\n    \"document.addEventListener('pointerdown', enableAfterIntent, { once: true, passive: true });\" in main_js\n    and \"document.addEventListener('keydown', enableAfterIntent, { once: true });\" in main_js,\n    'homepage hero motion lost its first-intent release path',\n)\n",
              'main.js hero motion regression insertion',
          )
          reg = replace_once(
              reg,
              "landing_css = read('css/style.css')\n",
              "landing_css = read('css/style.css')\nrequire(\n    '.hero-photo-bg img{transform-origin:64% 42%}' in landing_css\n    and '.hero--visible.hero--motion-ready .hero-photo-bg img{will-change:transform;animation:heroKenBurns 26s' in landing_css,\n    'decorative hero motion returned to the initial LCP path',\n)\nrequire(\n    '.hero-photo-bg img{will-change:transform;transform-origin:64% 42%}' not in landing_css,\n    'homepage LCP image regained unconditional will-change',\n)\n",
              'hero motion CSS regression insertion',
          )
          reg = replace_once(
              reg,
              "sw = read('sw.js')\nrequire(\"const CACHE_NAME = 'milovi-cake-v2026.09.06-r80';\" in sw, 'service-worker cache generation drifted')\nrequire(\"'/css/style.css?v=20260907r01',\" in sw, 'service-worker precache still points at stale shared CSS revision')\nrequire(\"'/js/gallery/main.js?v=20260906r03',\" in sw, 'service-worker precache still points at stale gallery runtime revision')\n",
              "# Shared main.js and CSS identities must move together across every HTML consumer.\nfor public_html in sorted(Path('.').rglob('*.html')):\n    html = read(public_html)\n    if 'js/main.js?v=' in html:\n        require('main.js?v=20260907r01' in html, f'{public_html} shared main.js revision drifted')\n        require('main.js?v=20260906r01' not in html, f'{public_html} still references stale shared main.js revision')\n\nsw = read('sw.js')\nrequire(\"const CACHE_NAME = 'milovi-cake-v2026.09.07-r81';\" in sw, 'service-worker cache generation drifted')\nrequire(\"'/css/style.css?v=20260907r01',\" in sw, 'service-worker precache still points at stale shared CSS revision')\nrequire(\"'/js/main.js?v=20260907r01',\" in sw, 'service-worker precache still points at stale shared main.js revision')\nrequire(\"'/js/gallery/main.js?v=20260906r03',\" in sw, 'service-worker precache still points at stale gallery runtime revision')\n",
              'shared runtime/SW coherence contract',
          )
          write(reg_path, reg)
          print(f'updated style refs={style_replacements}, main refs={main_replacements}')
          PY

      - name: Validate exact patch
        shell: bash
        run: |
          set -euo pipefail
          node --check js/main.js
          node --check sw.js
          python3 scripts/lighthouse_regressions.py
          python3 scripts/audit.py
          git diff --check
          if grep -R --include='*.html' -n 'style.css?v=20260906r03\|main.js?v=20260906r01' .; then
            echo 'stale shared asset revision remains in HTML' >&2
            exit 3
          fi

      - name: Commit production-only experiment
        shell: bash
        run: |
          set -euo pipefail
          rm -- '.github/workflows/tmp-homepage-hero-motion-patch.yml'
          git config user.name 'milovi-cake-perf[bot]'
          git config user.email 'milovi-cake-perf@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'patch produced no net change' >&2; exit 4; }
          git commit -m 'Perf: defer decorative homepage hero motion'
          git push origin HEAD:perf/homepage-defer-hero-motion-20260907
