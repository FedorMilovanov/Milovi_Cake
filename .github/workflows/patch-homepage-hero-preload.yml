name: Patch homepage duplicate hero preload

on:
  push:
    branches: ["perf/homepage-remove-duplicate-hero-preload-20260907"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/homepage-remove-duplicate-hero-preload-20260907
          fetch-depth: 0

      - name: Apply exact fail-closed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home_path = Path('index.html')
          home = home_path.read_text('utf-8')
          duplicate = '  <link rel="preload" as="image" type="image/webp" href="img/head_mobile.webp" media="(max-width:768px)" />\n'
          if home.count(duplicate) != 1:
              raise SystemExit(f'expected exactly one duplicate WebP preload, found {home.count(duplicate)}')
          home = home.replace(duplicate, '', 1)
          home_path.write_text(home, 'utf-8')

          guard_path = Path('scripts/lighthouse_regressions.py')
          guard = guard_path.read_text('utf-8')
          marker = "print('Lighthouse root-cause regression contract OK')"
          if guard.count(marker) != 1:
              raise SystemExit('Lighthouse regression print marker drifted')
          addition = '''# Homepage must preload only the preferred AVIF hero candidate. The WebP source remains\n# a real picture fallback, but preloading both formats wastes critical-path bandwidth.\nrequire(\n    '<link rel="preload" as="image" type="image/avif" href="img/head_mobile.avif" media="(max-width:768px)" fetchpriority="high" />' in home,\n    'homepage preferred mobile AVIF hero preload missing',\n)\nrequire(\n    '<link rel="preload" as="image" type="image/webp" href="img/head_mobile.webp"' not in home,\n    'homepage duplicate mobile WebP hero preload returned',\n)\nrequire(\n    '<source type="image/webp" media="(max-width: 768px)" srcset="img/head_mobile.webp" />' in home,\n    'homepage mobile WebP picture fallback was removed',\n)\n\n'''
          guard = guard.replace(marker, addition + marker, 1)
          guard_path.write_text(guard, 'utf-8')
          PY

      - name: Validate focused contracts
        run: |
          python3 scripts/lighthouse_regressions.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'index.html\nscripts/lighthouse_regressions.py'

      - name: Commit clean source diff and remove staging workflow
        shell: bash
        run: |
          rm .github/workflows/patch-homepage-hero-preload.yml
          git config user.name "FedorMilovanov"
          git config user.email "258225528+FedorMilovanov@users.noreply.github.com"
          git add index.html scripts/lighthouse_regressions.py .github/workflows/patch-homepage-hero-preload.yml
          git diff --cached --check
          git commit -m "Perf: avoid duplicate homepage hero preload"
          git push origin HEAD:perf/homepage-remove-duplicate-hero-preload-20260907
