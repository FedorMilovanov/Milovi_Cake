# TEMPORARY, PR-only, no deploy. Delete after collecting paired lab evidence.
name: Temporary Gatchina preload CDN control

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-gatchina-cdn.yml
      - scripts/diagnostics/lcp_gatchina_cdn_temp.cjs

permissions:
  contents: read

jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_RELEASE_SHA: e4cc47a5478a2cd1cc29096f51e310633919f3e2
    steps:
      - name: Checkout diagnostic tool only, not a deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node and isolated browser tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install test dependencies (no runtime production change)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove exact deployed SHA before browser control
        run: |
          if python3 scripts/production_release_smoke.py --retries 2 --delay 5 > /tmp/gatchina-release-proof.log 2>&1; then
            cat /tmp/gatchina-release-proof.log
          else
            echo "::error title=Live release changed; no trial::$(head -n 6 /tmp/gatchina-release-proof.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Pair WebP preload vs matched AVIF on same CDN and real fonts
        run: |
          if node scripts/diagnostics/lcp_gatchina_cdn_temp.cjs > /tmp/gatchina-cdn-control.log 2>&1; then
            cat /tmp/gatchina-cdn-control.log
          else
            cat /tmp/gatchina-cdn-control.log
            echo "::error title=Gatchina paired control failed::$(tail -n 9 /tmp/gatchina-cdn-control.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Prove exact deployed SHA after browser control
        run: |
          if python3 scripts/production_release_smoke.py --retries 1 > /tmp/gatchina-release-proof.log 2>&1; then
            cat /tmp/gatchina-release-proof.log
          else
            echo "::error title=Live release changed during control::$(head -n 6 /tmp/gatchina-release-proof.log | tr '\n' ' ')"
            exit 1
          fi
