name: Temporary map badge label sync

on:
  push:
    branches: [fix/lighthouse-a11y-phase1]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[label-sync-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout phase1 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/lighthouse-a11y-phase1

      - name: Apply exact homepage label sync
        run: |
          python3 scripts/_sync_map_badge_labels.py
          python3 scripts/a11y_static.py
          git diff --check

      - name: Commit durable homepage fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No durable change to commit"; exit 1; }
          git commit -m "fix: align map badge accessible names [label-sync-generated]"
          git push origin HEAD:fix/lighthouse-a11y-phase1
