name: INDEX forensic audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'tests/index-forensic-audit.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/index-forensic-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: index-forensic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forensic:
    name: 50+ point visual, interaction and external audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INDEX_FORENSIC: '1'
      AUDIT_TITLE: 'AUTO INDEX forensic audit'

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install exact dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run forensic browser audit
        id: browser
        shell: bash
        run: |
          set +e
          npx playwright test tests/index-forensic-audit.spec.js 2>&1 | tee forensic-playwright.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build combined audit protocol
        shell: bash
        env:
          BROWSER_STATUS: ${{ steps.browser.outputs.status }}
          ARTIFACT_NAME: index-forensic-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          root = Path('test-results/ui-audit/index-forensic')
          root.mkdir(parents=True, exist_ok=True)
          reports = []
          for file in sorted(root.glob('*-report.json')):
              try:
                  reports.append(json.loads(file.read_text(encoding='utf-8')))
              except Exception as exc:
                  reports.append({
                      'project': file.name,
                      'checks': 0,
                      'screenshotCount': 0,
                      'critical': 1,
                      'warnings': 0,
                      'findings': [{
                          'severity': 'critical',
                          'check': 'Чтение отчёта',
                          'message': str(exc),
                          'data': None,
                      }],
                  })

          if not reports:
              reports = [{
                  'project': 'runner',
                  'checks': 0,
                  'screenshotCount': 0,
                  'critical': 1,
                  'warnings': 0,
                  'findings': [{
                      'severity': 'critical',
                      'check': 'Playwright не создал отчёт',
                      'message': 'Проверьте forensic-playwright.log',
                      'data': None,
                  }],
              }]

          total_checks = sum(int(r.get('checks', 0)) for r in reports)
          total_screens = sum(int(r.get('screenshotCount', 0)) for r in reports)
          total_critical = sum(int(r.get('critical', 0)) for r in reports)
          total_warnings = sum(int(r.get('warnings', 0)) for r in reports)
          browser_status = int(os.environ.get('BROWSER_STATUS') or 0)
          if browser_status:
              total_critical += 1

          lines = [
              '# Недоверчивый forensic-аудит всей INDEX',
              '',
              f'**Commit:** `{os.environ.get("GITHUB_SHA", "unknown")}`  ',
              f'**Run:** https://github.com/{os.environ.get("GITHUB_REPOSITORY")}/actions/runs/{os.environ.get("GITHUB_RUN_ID")}  ',
              f'**Artifact:** `{os.environ.get("ARTIFACT_NAME")}`',
              '',
              '## Сводка',
              '',
              f'- Автоматизированных проверок: **{total_checks}**',
              f'- Сохранённых скриншотов: **{total_screens}**',
              f'- Критических замечаний: **{total_critical}**',
              f'- Замечаний «дошлифовать»: **{total_warnings}**',
              f'- Код завершения Playwright: **{browser_status}**',
              '',
              'Проверены desktop и Pixel 7, светлая и тёмная темы, полный скрин всей INDEX, отдельные макро-скрины всех основных секций, форма/floating-label, телефон, соцсети, footer, навигация, mobile app-bar, калькулятор, корзина, вкладки, FAQ, отзывы, privacy/analytics boundary, внутренние URL и внешние сервисы.',
              '',
          ]

          order = {'critical': 0, 'warning': 1, 'info': 2}
          material = []
          for report in reports:
              project = report.get('project', 'unknown')
              lines.extend([
                  f'## {project}',
                  '',
                  f'- Проверок: {report.get("checks", 0)}',
                  f'- Скриншотов: {report.get("screenshotCount", 0)}',
                  f'- Критично: {report.get("critical", 0)}',
                  f'- Дошлифовать: {report.get("warnings", 0)}',
                  '',
              ])
              for finding in report.get('findings', []):
                  if finding.get('severity') == 'info':
                      continue
                  material.append((project, finding))

          material.sort(key=lambda item: order.get(item[1].get('severity'), 9))
          if not material and browser_status == 0:
              lines.extend(['## Итог', '', 'Критических и визуальных предупреждений автоматический прогон не нашёл.', ''])
          else:
              lines.extend(['## Что найдено', ''])
              for project, finding in material[:60]:
                  severity = finding.get('severity', 'warning')
                  label = 'КРИТИЧНО' if severity == 'critical' else 'ДОШЛИФОВАТЬ'
                  lines.extend([
                      f'### {label} · {project} · {finding.get("check", "Без названия")}',
                      '',
                      str(finding.get('message', '')),
                      '',
                  ])
                  data = finding.get('data')
                  if data is not None:
                      serialized = json.dumps(data, ensure_ascii=False, indent=2)
                      lines.extend(['```json', serialized[:3500], '```', ''])

          if browser_status:
              lines.extend([
                  '### КРИТИЧНО · Playwright process',
                  '',
                  f'Процесс завершился с кодом {browser_status}. Полный лог лежит в артефакте.',
                  '',
              ])

          lines.extend([
              '## Где смотреть скриншоты',
              '',
              f'Откройте Actions-run выше и скачайте artifact **{os.environ.get("ARTIFACT_NAME")}**. Внутри: полные INDEX light/dark, отдельные секции, открытые меню, calculator-варианты, cart, FAQ, reviews modal, privacy и микро-состояния формы.',
              '',
          ])

          summary = '\n'.join(lines)
          (root / 'SUMMARY.md').write_text(summary, encoding='utf-8')
          combined = {
              'commit': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'artifact': os.environ.get('ARTIFACT_NAME'),
              'browser_status': browser_status,
              'checks': total_checks,
              'screenshots': total_screens,
              'critical': total_critical,
              'warnings': total_warnings,
              'reports': reports,
          }
          (root / 'combined-report.json').write_text(json.dumps(combined, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('forensic-critical-count.txt').write_text(str(total_critical), encoding='utf-8')
          PY
          cp forensic-playwright.log test-results/ui-audit/index-forensic/forensic-playwright.log

      - name: Upload complete browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index-forensic-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ui-audit/index-forensic/
          if-no-files-found: error
          retention-days: 14

      - name: Publish or update audit protocol issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body_file="test-results/ui-audit/index-forensic/SUMMARY.md"
          if [ ! -f "$body_file" ]; then
            printf '# Недоверчивый forensic-аудит INDEX\n\nОтчёт не был создан. Смотрите лог workflow: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$body_file"
          fi
          issue_number="$(gh issue list --state open --search "$AUDIT_TITLE in:title" --json number,title --jq '.[] | select(.title == env.AUDIT_TITLE) | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "$AUDIT_TITLE" --body-file "$body_file"
          else
            gh issue create --title "$AUDIT_TITLE" --body-file "$body_file"
          fi

      - name: Gate critical regressions
        if: always()
        shell: bash
        env:
          BROWSER_STATUS: ${{ steps.browser.outputs.status }}
        run: |
          set -euo pipefail
          critical="$(cat forensic-critical-count.txt 2>/dev/null || echo 1)"
          echo "Critical findings: $critical; browser status: ${BROWSER_STATUS:-1}"
          if [ "${BROWSER_STATUS:-1}" -ne 0 ] || [ "$critical" -ne 0 ]; then
            exit 1
          fi
