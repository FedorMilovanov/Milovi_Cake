name: Restore approved contact form interaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-form-r7-restore.yml'

permissions:
  contents: write

concurrency:
  group: apply-form-r7-restore-main
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true

      - name: Restore clean line-field form
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('css/milovi-premium-r3.css')
          html_path = Path('index.html')
          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          # Remove the R5/R6 experiments completely.
          for marker in (
              '/* Corrective R5 — restore real floating labels and a visible order-form card. */',
              '/* Corrective R6 — labels float inside fields; outer card contour is explicit. */',
              '/* Contact form restoration R7 — return the approved clean line-field interaction. */',
          ):
              pos = css.find(marker)
              if pos != -1:
                  css = css[:pos].rstrip() + '\n'

          # Remove the first R3 right-form experiment while preserving the left contacts panel.
          start = css.find('#contacts .card:not(.card--dark) {')
          end = css.find('/* Quiet, single-line contact treatment. */')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit(f'cannot locate R3 form block: start={start}, end={end}')
          css = css[:start] + css[end:]

          # Remove the later rule that explicitly forced the form side to be borderless.
          start = css.find('/* Override the older theme-specific !important card material')
          end = css.find('/* The footer deliberately stays dark in both themes')
          if start != -1 and end != -1 and end > start:
              css = css[:start] + css[end:]

          patch = r'''

          /* Contact form restoration R7 — return the approved clean line-field interaction.
             Labels move inside the field; no notches, chips, outlined field boxes or geometry jumps. */
          html:not([data-theme="dark"]) body #contacts .contacts-grid > .card:not(.card--dark) {
            --r7-card-bg:linear-gradient(145deg,#fffdf9 0%,#f8f0e5 100%);
            --r7-card-border:rgba(126,82,42,.38);
            --r7-card-ring:rgba(255,255,255,.70);
            --r7-card-shadow:0 24px 62px rgba(74,43,20,.13);
            --r7-line:rgba(91,62,40,.28);
            --r7-line-hover:rgba(151,99,50,.50);
            --r7-line-active:#ae7134;
            --r7-label:#78675b;
            --r7-label-active:#9c612b;
            --r7-text:#302117;
          }
          html[data-theme="dark"] body #contacts .contacts-grid > .card:not(.card--dark) {
            --r7-card-bg:linear-gradient(150deg,#21150e 0%,#100b07 100%);
            --r7-card-border:rgba(226,182,122,.36);
            --r7-card-ring:rgba(255,255,255,.035);
            --r7-card-shadow:0 28px 72px rgba(0,0,0,.38);
            --r7-line:rgba(226,198,159,.24);
            --r7-line-hover:rgba(226,198,159,.43);
            --r7-line-active:#d7a869;
            --r7-label:rgba(231,208,177,.64);
            --r7-label-active:#ddb274;
            --r7-text:#f4e8d5;
          }

          html body #contacts .contacts-grid > .card:not(.card--dark),
          html:not([data-theme="dark"]) body #contacts .contacts-grid > .card:not(.card--dark),
          html[data-theme="dark"] body #contacts .contacts-grid > .card:not(.card--dark) {
            padding:clamp(36px,4vw,52px) !important;
            border:1px solid var(--r7-card-border) !important;
            border-radius:32px 12px 32px 12px !important;
            background:var(--r7-card-bg) !important;
            box-shadow:0 0 0 1px var(--r7-card-ring),var(--r7-card-shadow) !important;
            transform:none !important;
          }
          html body #contacts .contacts-grid > .card:not(.card--dark):hover {
            border-color:var(--r7-card-border) !important;
            box-shadow:0 0 0 1px var(--r7-card-ring),var(--r7-card-shadow) !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark) h3 { margin:0 0 26px !important; }
          #contacts .card:not(.card--dark) form { margin-top:0 !important; }

          #contacts .card:not(.card--dark) .form-group.float-label {
            --r7-current-line:var(--r7-line);
            position:relative !important;
            min-height:64px !important;
            margin:0 0 16px !important;
            padding:16px 0 0 !important;
            border:0 !important;
            border-bottom:1px solid var(--r7-current-line) !important;
            border-radius:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            overflow:visible !important;
            isolation:auto !important;
            transform:none !important;
            transition:border-color .20s ease !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label:has(textarea) { min-height:112px !important; }
          #contacts .card:not(.card--dark) .form-group.float-label:hover { --r7-current-line:var(--r7-line-hover); }
          #contacts .card:not(.card--dark) .form-group.float-label:focus-within {
            --r7-current-line:var(--r7-line-active);
            border-color:var(--r7-line-active) !important;
            box-shadow:none !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label::before {
            content:"" !important;
            display:block !important;
            position:absolute !important;
            left:0 !important;
            right:0 !important;
            bottom:-1px !important;
            width:auto !important;
            height:1px !important;
            background:var(--r7-line-active) !important;
            transform:scaleX(0) !important;
            transform-origin:left center !important;
            opacity:1 !important;
            pointer-events:none !important;
            transition:transform .28s cubic-bezier(.22,1,.36,1) !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label:focus-within::before { transform:scaleX(1) !important; }
          #contacts .card:not(.card--dark) .form-group.float-label::after { content:none !important; display:none !important; }

          #contacts .card:not(.card--dark) .form-group.float-label input,
          #contacts .card:not(.card--dark) .form-group.float-label textarea {
            position:relative !important;
            z-index:1 !important;
            display:block !important;
            width:100% !important;
            margin:0 !important;
            border:0 !important;
            border-radius:0 !important;
            outline:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            color:var(--r7-text) !important;
            font:400 15px/1.4 'Jost',system-ui,-apple-system,'Segoe UI',sans-serif !important;
            caret-color:var(--r7-line-active) !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label input {
            min-height:48px !important;
            padding:22px 2px 8px !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label textarea {
            min-height:94px !important;
            padding:24px 2px 12px !important;
            resize:vertical !important;
          }

          #contacts .card:not(.card--dark) .form-group.float-label label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea + label {
            position:absolute !important;
            z-index:2 !important;
            left:1px !important;
            top:50% !important;
            margin:0 !important;
            padding:0 !important;
            border:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            color:var(--r7-label) !important;
            font:400 14px/1 'Jost',system-ui,-apple-system,'Segoe UI',sans-serif !important;
            letter-spacing:0 !important;
            text-transform:none !important;
            transform:translateY(-50%) !important;
            transform-origin:left top !important;
            white-space:nowrap !important;
            pointer-events:none !important;
            transition:top .24s cubic-bezier(.22,1,.36,1),transform .24s cubic-bezier(.22,1,.36,1),color .18s ease,font-size .20s ease,letter-spacing .20s ease !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label textarea + label {
            top:23px !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label input:focus + label,
          #contacts .card:not(.card--dark) .form-group.float-label input:not(:placeholder-shown) + label,
          #contacts .card:not(.card--dark) .form-group.float-label input:-webkit-autofill + label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea:focus + label,
          #contacts .card:not(.card--dark) .form-group.float-label textarea:not(:placeholder-shown) + label {
            top:2px !important;
            padding:0 !important;
            background:transparent !important;
            color:var(--r7-label-active) !important;
            font-size:10.5px !important;
            font-weight:500 !important;
            letter-spacing:.085em !important;
            text-transform:uppercase !important;
            transform:none !important;
          }
          #contacts .card:not(.card--dark) .form-group.float-label label::before { content:none !important; display:none !important; }

          #contacts .card:not(.card--dark) .form-note {
            margin:12px 0 0 !important;
            font-size:11.5px !important;
            line-height:1.55 !important;
          }
          #contacts .card:not(.card--dark) .btn-wa { margin-top:20px !important; }

          @media (max-width:768px) {
            html body #contacts .contacts-grid > .card:not(.card--dark),
            html:not([data-theme="dark"]) body #contacts .contacts-grid > .card:not(.card--dark),
            html[data-theme="dark"] body #contacts .contacts-grid > .card:not(.card--dark) {
              padding:30px 24px 32px !important;
              border-radius:28px 10px 28px 10px !important;
              box-shadow:0 0 0 1px var(--r7-card-ring),0 20px 52px rgba(0,0,0,.14) !important;
            }
            #contacts .card:not(.card--dark) h3 { margin-bottom:26px !important; }
            #contacts .card:not(.card--dark) .form-group.float-label textarea {
              min-height:92px !important;
              resize:none !important;
            }
          }

          @media (prefers-reduced-motion:reduce) {
            #contacts .card:not(.card--dark) .form-group.float-label::before,
            #contacts .card:not(.card--dark) .form-group.float-label label { transition:none !important; }
          }
          '''

          css = css.rstrip() + patch + '\n'
          html = html.replace('milovi-premium-r3.css?v=20260803r6', 'milovi-premium-r3.css?v=20260803r7')
          html = html.replace('milovi-premium-r3.css?v=20260803r5', 'milovi-premium-r3.css?v=20260803r7')

          css_path.write_text(css, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Verify restored state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css = Path('css/milovi-premium-r3.css').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Contact form restoration R7',
              'border-bottom:1px solid var(--r7-current-line)',
              'top:2px !important',
              'border:1px solid var(--r7-card-border)',
              'milovi-premium-r3.css?v=20260803r7',
          ]
          forbidden = ['Corrective R5', 'Corrective R6', '--r6-card-border', '--mc-label-chip-bg']
          missing = [x for x in required if x not in css and x not in html]
          present = [x for x in forbidden if x in css]
          if missing or present:
              raise SystemExit(f'missing={missing}; forbidden_present={present}')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace imbalance')
          print('R7 restoration verified')
          PY

      - name: Commit clean product state
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/apply-form-r7-restore.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add css/milovi-premium-r3.css index.html
          git commit -m 'fix: restore clean contact form interaction'
          git push origin HEAD:main
