# Temporary PR-only readout of already captured anonymous Chrome traces.
# No production visit, site edit, analytics export, or permanent CI change.
name: Temporary Gatchina fade timeline readout

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-fade-readout.yml

permissions:
  contents: read
  actions: read

jobs:
  readout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify original run and fetch digest-checked saved traces
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${{ github.repository }}/actions/runs/40567596181 --jq '.head_sha')" = \
            'db8f0bc50c8a3098416361486fd581a945c3a06e'
          test "$(gh api repos/${{ github.repository }}/actions/artifacts/12764705132 --jq '.digest')" = \
            'sha256:c55b561757d0ab798f5fc10b2dcd232996a34adeb3a9bd14d097e6cc9a2e0f7c'
          gh run download 40567596181 --repo "${{ github.repository }}" \
            -n temporary-lcp-frame-trace-40567596181-1 -D /tmp/milovi-fade-readout
      - name: Locate main JS evaluation, hero response, image-load dispatch and first paint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import gzip
          import json
          from pathlib import Path

          root = Path('/tmp/milovi-fade-readout')
          summary = json.loads((root / 'summary.json').read_text())
          assert summary['release'] == 'e4cc47a5478a2cd1cc29096f51e310633919f3e2'
          assert summary['browser'].startswith('155.')
          rows = sorted((r for r in summary['rows'] if r['page'] == 'gatchina'),
              key=lambda r: r['rawFcp'])
          assert len(rows) == 4

          for row in (rows[0], rows[-1]):
              file = root / (row['run'] + '-0.trace.json.gz')
              assert file.is_file(), file
              with gzip.open(file, 'rt') as f:
                  events = json.load(f)['traceEvents']
              nav = next(e for e in events if e['name'] == 'navigationStart'
                  and e.get('args', {}).get('data', {}).get('isOutermostMainFrame')
                  and e['args']['data'].get('documentLoaderURL', '').endswith('/prigorody/gatchina/'))
              zero = nav['ts']
              fcp = next(e for e in events if e['name'] == 'firstContentfulPaint'
                  and e['ts'] >= zero)
              assert abs((fcp['ts'] - zero) / 1000 - row['rawFcp']) < 150
              ms = lambda e: round((e['ts'] - zero) / 1000, 1)
              relevant = [e for e in events if zero <= e['ts'] < fcp['ts'] + 100000]
              urls = {e.get('args', {}).get('data', {}).get('requestId'): e['args']['data']['url']
                  for e in relevant if e['name'] == 'ResourceSendRequest'
                  and 'url' in e.get('args', {}).get('data', {})}
              resource = []
              for e in relevant:
                  if e['name'] not in ('ResourceSendRequest', 'ResourceFinish', 'ResourceReceiveResponse'):
                      continue
                  d = e.get('args', {}).get('data', {})
                  url = d.get('url') or urls.get(d.get('requestId'), '')
                  if any(needle in url for needle in ('/js/main.js', 'head_mobile.avif')):
                      resource.append({'event':e['name'], 'ms':ms(e), 'url':url.split('?')[0],
                          'status':d.get('statusCode'), 'encoded':d.get('encodedDataLength')})
              main_script = []
              for e in relevant:
                  if e['pid'] != nav['pid'] or e['tid'] != nav['tid']:
                      continue
                  if e['name'] not in ('EvaluateScript', 'FunctionCall', 'CompileScript',
                      'v8.compile', 'V8.CompileCode', 'V8.Execute'):
                      continue
                  d = e.get('args', {}).get('data', {})
                  if 'main.js' in json.dumps(d, ensure_ascii=False):
                      main_script.append({'name':e['name'], 'ms':ms(e),
                          'duration':round(e.get('dur', 0) / 1000, 1), 'data':d})
              doc_events = []
              for e in relevant:
                  if e['pid'] != nav['pid'] or e['tid'] != nav['tid']:
                      continue
                  d = e.get('args', {}).get('data', {})
                  if e['name'] in ('MarkDOMContent', 'MarkLoad', 'DOMContentLoaded',
                                  'firstContentfulPaint') or (e['name'] == 'EventDispatch'
                                  and d.get('type') in ('load', 'DOMContentLoaded', 'readystatechange')):
                      doc_events.append({'name':e['name'], 'ms':ms(e),
                          'duration':round(e.get('dur', 0) / 1000, 1), 'data':d})
              counts = collections.Counter(e['name'] for e in relevant)
              phase = 'fast' if row is rows[0] else 'slow'
              for title, value in (
                  ('resources', resource[:15]), ('main-script', main_script[:18]),
                  ('dom-events', doc_events[:30]),
                  ('event-counts', {k:counts[k] for k in ('EvaluateScript', 'FunctionCall',
                      'EventDispatch', 'MarkDOMContent', 'MarkLoad', 'Paint', 'DrawFrame')})):
                  print(f'::notice title=fade-{phase}-{title}::' +
                      json.dumps({'run':row['run'], 'rawFcp':row['rawFcp'], 'events':value},
                          ensure_ascii=False))
          PY
