name: Service worker diagnostics (experimental)

# ЭКСПЕРИМЕНТАЛЬНЫЙ лейн. Он ничего не гейтит и не заменяет обязательный прогон
# `Browser compatibility`: тот остаётся единственным источником правды о WebKit.
# Здесь собираются управляемые наблюдения там, где локальной WebKit-сборки нет:
#
#   1. matrix  — SW allow/block × storage normal/QuotaExceededError/SecurityError
#                + восемь последовательных reload, с журналом pageerror /
#                requestfailed / controller / registration.
#   2. https   — тот же артефакт страниц по настоящему TLS (HTTP/2), где
#                регистрация Service Worker разрешена так же, как в production.
#
# Оба джоба только собирают доказательства; выводы делаются в отчёте PR.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-storage-matrix:
    name: WebKit storage × service worker matrix (experimental)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --shm-size=1g
    timeout-minutes: 30
    env:
      MILOVI_BROWSER_COMPAT: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PW_DIAGNOSTICS: '1'
      HOME: /root
      DEBUG: pw:browser
      DEBUG_COLORS: '0'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Python for the local test server
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm ci

      - name: Run the storage fault matrix without retries
        # workers=1 и retries=0: повторы скрыли бы именно ту нестабильность,
        # ради которой строится матрица.
        run: |
          set -o pipefail
          npx playwright test tests/diagnostics/webkit-sw-diagnostics.spec.js \
            --project=webkit-desktop --project=webkit-mobile \
            --workers=1 --retries=0 --reporter=list,github 2>&1 \
            | tee "$RUNNER_TEMP/webkit-storage-matrix.log"

      - name: Summarize browser process events
        if: always()
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/webkit-storage-matrix.log" || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-storage-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/webkit-storage-matrix.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  service-worker-https:
    name: Service worker over TLS (experimental)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --shm-size=1g
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
      SW_HTTPS_BASE: https://127.0.0.1:4443
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Python for the pages artifact build
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm ci

      - name: Build the pages artifact
        run: npm run build:pages

      - name: Generate a throwaway TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/localhost.key -out /tmp/localhost.crt \
            -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1'

      - name: Serve the artifact over HTTP/2
        run: |
          node scripts/serve_pages_artifact_h2.mjs --root _site --port 4443 \
            --cert /tmp/localhost.crt --key /tmp/localhost.key \
            > "$RUNNER_TEMP/https-server.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -sk --http2 -o /dev/null -w '%{http_code}' https://127.0.0.1:4443/ | grep -q 200; then
              echo "HTTP/2 server is up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/https-server.log"
          exit 1

      - name: Verify the service worker on TLS in Chromium
        run: |
          set -o pipefail
          npx playwright test tests/diagnostics/sw-https.spec.js \
            --project=chromium-desktop \
            --workers=1 --retries=0 --reporter=list,github 2>&1 \
            | tee "$RUNNER_TEMP/sw-https-chromium.log"

      - name: Verify the service worker on TLS in WebKit
        env:
          MILOVI_BROWSER_COMPAT: '1'
        run: |
          set -o pipefail
          npx playwright test tests/diagnostics/sw-https.spec.js \
            --project=webkit-desktop \
            --workers=1 --retries=0 --reporter=list,github 2>&1 \
            | tee "$RUNNER_TEMP/sw-https-webkit.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sw-https-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/sw-https-chromium.log
            ${{ runner.temp }}/sw-https-webkit.log
            ${{ runner.temp }}/https-server.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
