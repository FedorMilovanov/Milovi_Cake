name: Release smoke bootstrap

on:
  push:
    branches: [hardening/consolidate-release-smoke-20260906]

permissions:
  contents: write

jobs:
  clean-smoke:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/consolidate-release-smoke-20260906

      - name: Remove accidental edit residue and validate smoke
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/production_smoke.py')
          text = path.read_text('utf-8')
          residue = '            if not args.quiet_passed_attemps if False else False:\n                pass\n'
          if text.count(residue) != 1:
              raise SystemExit(f'expected one edit residue block, got {text.count(residue)}')
          text = text.replace(residue, '', 1)
          if 'expected_version' in text or 'EXPECTED_VERSION' in text:
              raise SystemExit('legacy ambiguous global version detector still present')
          if 'content:20260728r27' in text:
              raise SystemExit('legacy hard-coded production version marker still present')
          path.write_text(text, 'utf-8')
          PY
          python3 -m py_compile scripts/production_smoke.py scripts/production_release_smoke.py
          python3 scripts/production_smoke.py

      - name: Commit cleaned production smoke
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production_smoke.py
          git diff --cached --quiet && { echo 'No smoke cleanup change'; exit 1; }
          git commit -m "test(prod): separate content smoke from release identity"
          git push origin HEAD:hardening/consolidate-release-smoke-20260906
