name: Deep polish audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deep-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Source, browser and Pages candidate audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install exact dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run complete source and browser QA
        run: npm run qa

      - name: Build sanitized Pages candidate
        run: npm run build:pages

      - name: Audit exact Pages candidate
        run: npm run audit:pages

      - name: Verify released mobile app-shell assets
        shell: bash
        run: |
          set -euo pipefail
          grep -F "milovi-cake-v2026.08.03-r75" sw.js
          grep -F "/css/contact-polish.css?v=20260803r7" sw.js
          grep -F "/css/mobile-app-shell.css?v=20260803r1" sw.js
          test -f _site/css/contact-polish-base.css
          test -f _site/css/mobile-app-shell.css
          grep -F "#mcPrivacyRow" tests/contact-privacy-regression.spec.js
          grep -F "visibleNavs" tests/contact-privacy-regression.spec.js

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-polish-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ui-audit/
          if-no-files-found: warn
          retention-days: 7
