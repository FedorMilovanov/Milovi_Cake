name: Deep polish audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deep-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Source, browser and Pages candidate audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install exact dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run complete source and browser QA
        run: npm run qa

      - name: Build sanitized Pages candidate
        run: npm run build:pages

      - name: Audit exact Pages candidate
        run: npm run audit:pages

      - name: Verify released mobile app-shell contract
        shell: bash
        run: |
          set -euo pipefail

          # `npm run qa` already proves exact asset→revision equality through
          # scripts/release_contract.py. This layer proves the required app-shell
          # assets/contracts still exist without freezing a volatile rXX label here.
          grep -Eq "^const CACHE_NAME = 'milovi-cake-v[^']+';" sw.js
          grep -Eq "'/css/final-fixes\.css\?v=[^']+'" sw.js
          grep -Eq "'/js/mc-2026\.js\?v=[^']+'" sw.js
          grep -Eq "'/js/consent-analytics\.js\?v=[^']+'" sw.js
          grep -Eq 'href="/css/final-fixes\.css\?v=[^"]+"' index.html
          grep -Eq 'src="js/mc-2026\.js\?v=[^"]+"' index.html
          grep -Eq 'src="/js/consent-analytics\.js\?v=[^"]+"' index.html
          grep -Eq "'/css/v20-fixes\.css\?v=[^']+'" sw.js

          # Existing app-shell/privacy contracts remain explicit and regression-tested.
          grep -F "#mcPrivacyRow" tests/theme-smoke.spec.js
          grep -F "visibleNavs" tests/theme-smoke.spec.js
          grep -F "CONTACTS + PRIVACY RELEASE R75" css/v20-fixes.css

          # Superseded runtime sidecars and temporary extraction artifacts must not return.
          test ! -e css/milovi-premium-r3.css
          test ! -e js/ui-polish-r3.js
          test ! -e css/contact-polish.css
          test ! -e css/contact-polish-base.css
          test ! -e css/mobile-app-shell.css
          test ! -e tests/contact-privacy-regression.spec.js
          test ! -e scripts/audit_core.py

          ! grep -Fq 'milovi-premium-r3.css' index.html
          ! grep -Fq 'ui-polish-r3.js' index.html
          ! grep -Fq 'milovi-premium-r3.css' sw.js
          ! grep -Fq 'ui-polish-r3.js' sw.js

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deep-polish-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ui-audit/
          if-no-files-found: warn
          retention-days: 7