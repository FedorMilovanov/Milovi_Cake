name: Deep polish round-two audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deep-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run permanent source contracts and security audit
        run: |
          npm run audit:js
          npm run audit:analytics
          npm run audit:security
          python3 scripts/check_prigorody_idempotent.py
          npm run audit

      - name: Audit source details missed by the first release pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          findings = []
          ignored = {'.git', 'node_modules', '_site', 'playwright-report', 'test-results', 'audit'}

          def files(pattern):
              for path in root.rglob(pattern):
                  if any(part in ignored for part in path.parts):
                      continue
                  yield path

          legacy_patterns = {
              'legacy privacy overlay': re.compile(r'id=["\']privacyOverlay["\']', re.I),
              'legacy privacy modal': re.compile(r'id=["\']privacyModal["\']', re.I),
              'legacy privacy function': re.compile(r'\b(?:openPrivacy|closePrivacy)\s*\(', re.I),
              'legacy cookie banner id': re.compile(r'id=["\']cookieBanner["\']', re.I),
              'legacy cookie copy': re.compile(r'Мы используем файлы cookie', re.I),
          }
          for path in list(files('*.html')) + list(files('*.js')):
              text = path.read_text('utf-8', errors='replace')
              for label, pattern in legacy_patterns.items():
                  if pattern.search(text):
                      findings.append(f'{path.as_posix()}: {label}')

          index = Path('index.html').read_text('utf-8', errors='replace')
          duplicate = 'с безопасным составом и любимыми персонажами, с безопасным составом и любимыми персонажами'
          if duplicate in index:
              findings.append('index.html: duplicated FAQ phrase')

          main_js = Path('js/main.js').read_text('utf-8', errors='replace')
          bad_condition = "if(STATE === 'zoom_in' && typeof lbIsOpen === 'undefined' || !lbIsOpen)"
          if bad_condition in main_js:
              findings.append('js/main.js: review animation condition has operator-precedence bug')

          package = json.loads(Path('package.json').read_text('utf-8'))
          scripts = package.get('scripts', {})
          if scripts.get('audit:security') != 'npm audit --audit-level=high':
              findings.append('package.json: high-severity dependency audit is not exact')
          if 'npm run audit:security' not in scripts.get('qa', ''):
              findings.append('package.json: qa does not enforce dependency security audit')

          sha_re = re.compile(r'^[0-9a-f]{40}$', re.I)
          for workflow in sorted((root / '.github/workflows').glob('*.yml')):
              for number, line in enumerate(workflow.read_text('utf-8', errors='replace').splitlines(), 1):
                  stripped = line.strip()
                  if not stripped.startswith('uses:'):
                      continue
                  target = stripped.split('uses:', 1)[1].strip().split()[0]
                  if target.startswith('./'):
                      continue
                  ref = target.rsplit('@', 1)[-1] if '@' in target else ''
                  if not sha_re.fullmatch(ref):
                      findings.append(f'{workflow.as_posix()}:{number}: action is not pinned to an exact SHA: {target}')

          sw = Path('sw.js').read_text('utf-8')
          if 'milovi-cake-v2026.07.28-r27' not in sw:
              findings.append('sw.js: round-two cache revision is missing')
          if '20260728r27' not in sw:
              findings.append('sw.js: precache URLs do not use the round-two asset revision')

          if findings:
              raise SystemExit('\n'.join(findings))
          print('Source round-two audit found no defects')
          PY

      - name: Build and audit exact sanitized Pages candidate
        run: |
          npm run build:pages
          npm run audit:pages

      - name: Crawl candidate sitemap, canonical and error metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re
          import xml.etree.ElementTree as ET

          site = Path('_site')
          findings = []
          sitemap_path = site / 'sitemap.xml'
          if not sitemap_path.exists():
              raise SystemExit('_site/sitemap.xml is missing')

          root = ET.fromstring(sitemap_path.read_text('utf-8'))
          urls = [node.text.strip() for node in root.findall('.//{*}loc') if node.text]
          canonical_re = re.compile(r'<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)', re.I)
          for url in urls:
              parsed = urlparse(url)
              route = parsed.path
              file = site / ('index.html' if route == '/' else route.lstrip('/') + ('index.html' if route.endswith('/') else ''))
              if not file.exists():
                  findings.append(f'{url}: missing artifact file {file.as_posix()}')
                  continue
              html = file.read_text('utf-8', errors='replace')
              if 'googletagmanager.com/gtag/js' in html or 'mc.yandex.ru/metrika/tag.js' in html:
                  findings.append(f'{url}: direct analytics URL embedded in candidate HTML')
              for marker in ('privacyOverlay', 'privacyModal', 'cookieBanner', 'openPrivacy()'):
                  if marker in html:
                      findings.append(f'{url}: legacy marker remains: {marker}')
              match = canonical_re.search(html)
              if not match:
                  findings.append(f'{url}: missing canonical')
              elif match.group(1).rstrip('/') != url.rstrip('/'):
                  findings.append(f'{url}: canonical mismatch {match.group(1)}')
              if re.search(r'<meta\b[^>]*name=["\']robots["\'][^>]*content=["\'][^"\']*noindex', html, re.I):
                  findings.append(f'{url}: sitemap URL is noindex')

          not_found = (site / '404.html').read_text('utf-8', errors='replace')
          if not re.search(r'<meta\b[^>]*(?:name=["\']robots["\'][^>]*content=["\']noindex,\s*follow["\']|content=["\']noindex,\s*follow["\'][^>]*name=["\']robots["\'])', not_found, re.I):
              findings.append('candidate 404 lacks robots noindex, follow')
          if canonical_re.search(not_found):
              findings.append('candidate 404 emits canonical')

          release = (site / 'release.json').read_text('utf-8')
          if 'FedorMilovanov/Milovi_Cake' not in release:
              findings.append('candidate release witness has repository drift')

          if findings:
              raise SystemExit('\n'.join(findings))
          print(f'Candidate crawl passed: {len(urls)} sitemap URLs')
          PY

      - name: Serve exact candidate
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/cake-candidate-server.log 2>&1 &
          echo $! >/tmp/cake-candidate-server.pid
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cake-candidate-server.log
          exit 1

      - name: Exercise candidate consent and legacy DOM in Chromium
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright')

          ;(async () => {
            const findings = []
            const browser = await chromium.launch({ headless: true })
            try {
              const denyContext = await browser.newContext()
              const denyPage = await denyContext.newPage()
              const analyticsRequests = []
              denyPage.on('request', request => {
                const url = request.url()
                if (/googletagmanager\.com|google-analytics\.com|mc\.yandex\.ru|metrika\.yandex/i.test(url)) analyticsRequests.push(url)
              })
              await denyPage.goto(`http://127.0.0.1:4173/?deep-polish=${Date.now()}`, { waitUntil: 'domcontentloaded' })
              await denyPage.waitForTimeout(800)
              const before = await denyPage.evaluate(() => ({
                consentPanels: document.querySelectorAll('.mc-consent').length,
                privacyOverlay: Boolean(document.getElementById('privacyOverlay')),
                privacyModal: Boolean(document.getElementById('privacyModal')),
                cookieBanner: Boolean(document.getElementById('cookieBanner')),
                legacyPrivacyLinks: document.querySelectorAll('[onclick*="openPrivacy"]').length,
                directAnalyticsScripts: [...document.scripts].filter(s => /googletagmanager\.com|mc\.yandex\.ru/i.test(s.src)).length,
              }))
              if (analyticsRequests.length) findings.push(`analytics requested before consent: ${analyticsRequests.join(', ')}`)
              if (before.consentPanels !== 1) findings.push(`expected one consent panel, found ${before.consentPanels}`)
              if (before.privacyOverlay || before.privacyModal || before.cookieBanner) findings.push('legacy privacy/cookie DOM remains')
              if (before.legacyPrivacyLinks) findings.push(`legacy privacy links remain: ${before.legacyPrivacyLinks}`)
              if (before.directAnalyticsScripts) findings.push('direct analytics script exists before consent')
              await denyPage.locator('.mc-consent__button--deny').click()
              await denyPage.waitForTimeout(250)
              if (analyticsRequests.length) findings.push('analytics requested after denial')
              await denyContext.close()

              const allowContext = await browser.newContext()
              const allowPage = await allowContext.newPage()
              await allowPage.goto(`http://127.0.0.1:4173/?deep-polish-allow=${Date.now()}`, { waitUntil: 'domcontentloaded' })
              await allowPage.locator('.mc-consent__button--allow').click()
              await allowPage.waitForTimeout(250)
              const afterAllow = await allowPage.evaluate(() => ({
                ga: Boolean(document.querySelector('script[data-milovi-ga]')),
                ym: Boolean(document.querySelector('script[data-milovi-ym]')),
                settings: Boolean(document.querySelector('.mc-consent-settings')),
              }))
              if (!afterAllow.ga || !afterAllow.ym) findings.push('analytics scripts were not attached after explicit consent')
              if (!afterAllow.settings) findings.push('privacy settings button missing after choice')
              await allowContext.close()
            } finally {
              await browser.close()
            }

            if (findings.length) throw new Error(findings.join('\n'))
            console.log('Candidate browser consent audit found no defects')
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          JS

      - name: Stop candidate server
        if: always()
        run: kill "$(cat /tmp/cake-candidate-server.pid)" 2>/dev/null || true
