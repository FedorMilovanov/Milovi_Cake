name: One-shot Cake QA diagnostic v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-qa-diagnostic-v2.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'feat/privacy-consent-deploy-marathon'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/privacy-consent-deploy-marathon
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Capture every QA stage
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium
          set +e
          : > CAKE_QA_DIAGNOSTIC.txt
          for command in \
            'npm run audit:js' \
            'npm run audit:analytics' \
            'python3 scripts/check_prigorody_idempotent.py' \
            'npm run audit' \
            'npm run test:playwright' \
            'RELEASE_SHA=diagnostic npm run build:pages' \
            'RELEASE_SHA=diagnostic npm run audit:pages'
          do
            echo >> CAKE_QA_DIAGNOSTIC.txt
            echo "## $command" >> CAKE_QA_DIAGNOSTIC.txt
            bash -lc "$command" >> CAKE_QA_DIAGNOSTIC.txt 2>&1
            echo "exit_code=$?" >> CAKE_QA_DIAGNOSTIC.txt
          done
          set -e
          tail -n 400 CAKE_QA_DIAGNOSTIC.txt

      - name: Commit diagnostic and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-qa-diagnostic-v2.yml
          git add CAKE_QA_DIAGNOSTIC.txt
          git commit -m "chore(ci): preserve staged Cake QA evidence"
          git push origin HEAD:feat/privacy-consent-deploy-marathon
