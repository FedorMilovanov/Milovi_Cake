# TEMPORARY PR-only diagnostic: compare fresh Chrome frames on exact live SHA.
# No source/CSS/runtime/threshold/deploy change; delete after documenting.
name: Temporary live first-paint frame trace

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-frame-trace.yml
      - scripts/diagnostics/lcp_frame_trace_temp.cjs

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_RELEASE_SHA: e4cc47a5478a2cd1cc29096f51e310633919f3e2
    steps:
      - name: Checkout PR-only script, not a deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up isolated Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Verify exact production release before any browser visit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 scripts/production_release_smoke.py --retries 2 --delay 5
      - name: Pin earlier Chrome version and Lighthouse outside checkout
        run: |
          npm install --prefix /tmp/milovi-lighthouse --no-save --ignore-scripts \
            lighthouse@12.6.1 @puppeteer/browsers@3.2.6
          /tmp/milovi-lighthouse/node_modules/.bin/browsers install \
            chrome@155.0.8059.39 --path /tmp/milovi-browser
          CHROME_PATH=/tmp/milovi-browser/chrome/linux-155.0.8059.39/chrome-linux64/chrome
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version | grep -F 155.0.8059.39
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Compare raw first paint and frame pipeline on two live URLs
        run: |
          if node scripts/diagnostics/lcp_frame_trace_temp.cjs > /tmp/lcp-frame-trace.log 2>&1; then
            cat /tmp/lcp-frame-trace.log
          else
            cat /tmp/lcp-frame-trace.log
            echo "::error title=First-paint trace control failed::$(tail -n 12 /tmp/lcp-frame-trace.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Re-prove published SHA after traced visits
        if: always()
        run: python3 scripts/production_release_smoke.py --retries 1
      - name: Preserve bounded anonymous lab evidence outside Git
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-lcp-frame-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/milovi-frame-traces/
          if-no-files-found: warn
          retention-days: 21
          include-hidden-files: false
