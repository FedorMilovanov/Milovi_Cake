name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    # Daily morning check in Moscow timezone equivalent (06:30 UTC = 09:30 MSK).
    - cron: '30 6 * * *'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run production smoke checks with deploy retry window
        run: python3 scripts/production_smoke.py --retries 6 --delay 30
