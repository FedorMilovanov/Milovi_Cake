name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    # Daily morning check in Moscow timezone equivalent (06:30 UTC = 09:30 MSK).
    - cron: '30 6 * * *'

permissions:
  actions: read
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve latest successful canonical deploy
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1")"
          sha="$(
            RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import re

          payload = json.loads(os.environ['RESPONSE'])
          runs = payload.get('workflow_runs') or []
          if len(runs) != 1:
              raise SystemExit(f'expected exactly one successful deploy run, got {len(runs)}')
          run = runs[0]
          sha = run.get('head_sha', '')
          if run.get('head_branch') != 'main':
              raise SystemExit('latest successful deploy is not from main')
          if re.fullmatch(r'[0-9a-f]{40}', sha) is None:
              raise SystemExit(f'invalid deploy SHA: {sha!r}')
          print(sha)
          PY
          )"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Latest successful canonical deploy: $sha"

      - name: Checkout exact deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.sha }}
          persist-credentials: false

      - name: Run transport/content production smoke with deploy retry window
        run: python3 scripts/production_smoke.py --retries 6 --delay 30

      - name: Verify exact deployed release, privacy and 404 semantics
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.deployed.outputs.sha }}
        run: python3 scripts/production_release_smoke.py --retries 6 --delay 30
