name: Temporary phase 2 runner

on:
  push:
    branches:
      - hardening/lighthouse-root-causes-20260906

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/lighthouse-root-causes-20260906
          fetch-depth: 0
      - name: Apply migration
        run: |
          python3 scripts/tmp_lighthouse_phase2.py
          sed -i 's/[[:space:]]\+$//' js/gallery/main.js
      - name: Regenerate and validate static contracts
        run: |
          python3 prigorody/build.py
          python3 scripts/check_prigorody_idempotent.py
          python3 scripts/a11y_static.py
          python3 scripts/release_contract.py
          python3 scripts/lighthouse_regressions.py
          python3 scripts/audit.py
          node --check js/gallery/main.js
          git diff --check
      - name: Commit final branch
        run: |
          rm -f scripts/tmp_lighthouse_phase2.py
          rm -f .github/workflows/tmp-lighthouse-phase2.yml
          rm -f .github/workflows/tmp-phase2-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Hardening: fix Lighthouse paint and layout root causes"
          git push origin HEAD:hardening/lighthouse-root-causes-20260906
