name: Collect complete round-two findings

on:
  push:
    branches: [fix/deep-polish-round2]
    paths: ['.github/workflows/_collect-round2-findings.yml']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/deep-polish-round2

      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Collect exact findings
        shell: bash
        run: |
          set -uo pipefail
          : > ROUND2_FINDINGS.txt
          echo '=== NPM AUDIT (HIGH) ===' >> ROUND2_FINDINGS.txt
          npm ci >> ROUND2_FINDINGS.txt 2>&1
          npm audit --audit-level=high >> ROUND2_FINDINGS.txt 2>&1 || true
          echo >> ROUND2_FINDINGS.txt
          echo '=== SOURCE FINDINGS ===' >> ROUND2_FINDINGS.txt
          python3 - <<'PY' >> ROUND2_FINDINGS.txt
          from pathlib import Path
          import re
          root=Path('.')
          ignored={'.git','node_modules','_site','playwright-report','test-results'}
          patterns={
            'privacyOverlay': re.compile(r'privacyOverlay'),
            'privacyModal': re.compile(r'privacyModal'),
            'openPrivacy': re.compile(r'\bopenPrivacy\b'),
            'closePrivacy': re.compile(r'\bclosePrivacy\b'),
            'cookieBanner': re.compile(r'cookieBanner'),
            'cookie copy': re.compile(r'Мы используем файлы cookie', re.I),
            'duplicate FAQ': re.compile(r'с безопасным составом и любимыми персонажами, с безопасным составом и любимыми персонажами'),
            'precedence bug': re.compile(r"if\(STATE === 'zoom_in' && typeof lbIsOpen === 'undefined' \|\| !lbIsOpen\)"),
          }
          for path in sorted(list(root.rglob('*.html'))+list(root.rglob('*.js'))+list(root.rglob('*.css'))):
            if any(p in ignored for p in path.parts): continue
            lines=path.read_text('utf-8',errors='replace').splitlines()
            for no,line in enumerate(lines,1):
              for label,pattern in patterns.items():
                if pattern.search(line): print(f'{path}:{no}: {label}: {line.strip()[:240]}')
          print('\n=== UNPINNED ACTIONS ===')
          sha=re.compile(r'^[0-9a-f]{40}$',re.I)
          for path in sorted((root/'.github/workflows').glob('*.yml')):
            for no,line in enumerate(path.read_text('utf-8').splitlines(),1):
              if 'uses:' not in line: continue
              target=line.split('uses:',1)[1].strip().split()[0]
              if target.startswith('./'): continue
              ref=target.rsplit('@',1)[-1] if '@' in target else ''
              if not sha.fullmatch(ref): print(f'{path}:{no}: {target}')
          PY

      - name: Commit report and remove collector
        shell: bash
        run: |
          rm .github/workflows/_collect-round2-findings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROUND2_FINDINGS.txt .github/workflows/_collect-round2-findings.yml
          git commit -m 'chore(diag): preserve complete round-two findings'
          git push origin HEAD:fix/deep-polish-round2
