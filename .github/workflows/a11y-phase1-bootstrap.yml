name: Temporary Lighthouse a11y phase1 bootstrap

on:
  push:
    branches: [fix/lighthouse-a11y-phase1]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout phase1 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/lighthouse-a11y-phase1

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply deterministic source migration
        run: |
          python3 scripts/_lighthouse_a11y_phase1.py
          python3 prigorody/build.py

      - name: Validate source contracts
        run: |
          npm ci
          npm run audit:all
          python3 scripts/a11y_static.py
          python3 scripts/release_contract.py
          git diff --check

      - name: Commit generated phase1 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/lighthouse-config.json privacy/index.html prigorody/_template.html prigorody/*/index.html
          git diff --cached --quiet && { echo "No durable changes to commit"; exit 1; }
          git commit -m "fix: address deterministic Lighthouse a11y findings [phase1-generated]"
          git push origin HEAD:fix/lighthouse-a11y-phase1
