name: Gallery exhaustive click audit R84

on:
  push:
    branches: [audit/gallery-deep-r78]
    paths: ['.github/workflows/gallery-deep-audit-r79.yml']

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4eb3bf6ed6fd5c3c9e4c2d857e53d8bae093370
          persist-credentials: false
      - name: Exact product guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c4eb3bf6ed6fd5c3c9e4c2d857e53d8bae093370
          ! grep -qF '.card::after{' css/gallery/gallery-2026.css
          ! grep -qF '.card:hover::after{' css/gallery/gallery-2026.css
          grep -qF '.card::before {' css/gallery/gallery-2026.css
          grep -qF '/css/gallery/gallery-2026.css?v=20260813r01' gallery/index.html
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Click every card and force every lazy medium to load
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/gallery-r84
          python3 -m http.server 4174 >/tmp/gallery-r84-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          node <<'JS'
          const { chromium, devices } = require('playwright');
          const ok=(x,m)=>{if(!x)throw new Error(m)};

          async function audit(base,mobile,label){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({...(mobile?devices['Pixel 7']:{viewport:{width:1440,height:1000}}),serviceWorkers:'block'});
            await context.addInitScript(()=>{localStorage.setItem('milovi_analytics_consent_v1','denied');localStorage.setItem('mc_theme','light')});
            const page=await context.newPage();
            const errors=[], bad=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.url().startsWith(base+'/')&&r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            await page.goto(`${base}/gallery/?r84=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('.card',{state:'visible',timeout:15000});
            await page.waitForTimeout(1000);
            const total=await page.locator('.card').count();
            ok(total===46,`${label}: expected 46 cards, got ${total}`);

            // Walk every card into the viewport so lazy images/posters/videos cannot hide below-fold failures.
            for(let i=0;i<total;i++){
              const card=page.locator('.card').nth(i);
              await card.scrollIntoViewIfNeeded();
              const media=card.locator('.card-media');
              await media.waitFor({state:'visible',timeout:5000});
              const tag=await media.evaluate(e=>e.tagName);
              if(tag==='IMG'){
                await page.waitForFunction(el=>el.complete&&el.naturalWidth>0,await media.elementHandle(),{timeout:8000});
                const dims=await media.evaluate(e=>[e.naturalWidth,e.naturalHeight]);
                ok(dims[0]>0&&dims[1]>0,`${label}: card ${i+1} image has no dimensions`);
              }else if(tag==='VIDEO'){
                const poster=await media.getAttribute('poster');
                ok(!!poster,`${label}: card ${i+1} video has no poster`);
                // IntersectionObserver should assign the deferred source when the card enters view.
                await page.waitForFunction(el=>!!el.currentSrc||!!el.src,await media.elementHandle(),{timeout:8000});
              }else throw new Error(`${label}: card ${i+1} unexpected media tag ${tag}`);
            }

            await page.evaluate(()=>scrollTo(0,0));
            await page.waitForTimeout(300);

            // Click every card. Verify that the correct item opens, metadata is populated, and close restores the page.
            for(let i=0;i<total;i++){
              const card=page.locator('.card').nth(i);
              await card.scrollIntoViewIfNeeded();
              const id=await card.getAttribute('data-id');
              const title=await card.locator('.card-title').textContent();
              await card.click();
              await page.waitForSelector('#lbRoot',{state:'visible',timeout:8000});
              ok((await page.locator('#lbTitle').textContent()).trim().length>0,`${label}: card ${i+1} lightbox title empty`);
              ok((await page.locator('#lbTitle').textContent()).trim()===(title||'').trim(),`${label}: card ${i+1} lightbox title mismatch`);
              ok(decodeURIComponent(new URL(page.url()).hash.slice(1))===id,`${label}: card ${i+1} hash mismatch`);
              ok((await page.locator('#lbCounter').textContent()).trim().startsWith(String(i+1).padStart(2,'0')+' /'),`${label}: card ${i+1} counter mismatch ${(await page.locator('#lbCounter').textContent()).trim()}`);
              await page.locator('#lbClose').click();
              await page.waitForSelector('#lbRoot',{state:'detached',timeout:5000});
              const body=await page.evaluate(()=>({position:document.body.style.position,overflow:document.body.style.overflow}));
              ok(body.position===''&&body.overflow==='',`${label}: body scroll lock leaked after card ${i+1}: ${JSON.stringify(body)}`);
            }

            // One final pass after all media were forced into view, then capture a visual proof with lazy gaps eliminated.
            for(let i=0;i<total;i++) await page.locator('.card').nth(i).scrollIntoViewIfNeeded();
            await page.waitForTimeout(600);
            await page.screenshot({path:`test-results/gallery-r84/${label}.png`,fullPage:true});
            const overflow=await page.evaluate(()=>[innerWidth,document.documentElement.scrollWidth]);
            ok(overflow[1]<=overflow[0]+2,`${label}: horizontal overflow ${overflow}`);
            ok(errors.length===0,`${label}: page errors ${errors.join(' | ')}`);
            ok(bad.length===0,`${label}: same-origin HTTP errors ${bad.join(' | ')}`);
            console.log(`PASS ${label}: ${total}/46 cards media-loaded and clicked, no HTTP/page errors`);
            await browser.close();
          }

          (async()=>{
            await audit('http://127.0.0.1:4174',false,'local-desktop');
            await audit('http://127.0.0.1:4174',true,'local-mobile');
            await audit('https://milovicake.ru',false,'live-desktop');
            await audit('https://milovicake.ru',true,'live-mobile');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Production smoke with retries
        run: python3 scripts/production_smoke.py --retries 3 --delay 10
      - name: Upload post-scroll screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gallery-r84-${{ github.run_id }}
          path: test-results/gallery-r84/
          if-no-files-found: warn
          retention-days: 7
