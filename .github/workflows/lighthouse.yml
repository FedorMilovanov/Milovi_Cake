name: Lighthouse

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Audit proven live URLs with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://milovicake.ru/
            https://milovicake.ru/gallery/
            https://milovicake.ru/svadebnye-torty/
            https://milovicake.ru/bento-torty/
            https://milovicake.ru/zakazat-tort-spb/
            https://milovicake.ru/o-konditere/
            https://milovicake.ru/prigorody/gatchina/
            https://milovicake.ru/privacy/
          configPath: ./.github/lighthouse-config.json
          uploadArtifacts: true
          temporaryPublicStorage: true
