name: Temporary landing CSS revision rollout

on:
  push:
    branches:
      - hardening/landing-a11y-20260906

permissions:
  contents: write

jobs:
  rollout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: hardening/landing-a11y-20260906
          fetch-depth: 0

      - name: Prove expected a11y patch ancestry
        run: git merge-base --is-ancestor 031d26a51babd6da71deb288e4cc94b0f57f490b HEAD

      - name: Roll shared stylesheet revision coherently
        shell: python
        run: |
          from pathlib import Path

          OLD = 'style.css?v=20260728r27'
          NEW = 'style.css?v=20260906r03'

          touched = []
          for path in sorted(Path('.').rglob('*.html')):
              text = path.read_text('utf-8')
              if OLD in text:
                  path.write_text(text.replace(OLD, NEW), 'utf-8')
                  touched.append(path.as_posix())

          required = {
              'index.html',
              'bento-torty/index.html',
              'svadebnye-torty/index.html',
              'zakazat-tort-spb/index.html',
              'detskie-torty/index.html',
              'tort-s-dostavkoy/index.html',
              'o-konditere/index.html',
              'otzyvy/index.html',
              'dostavka-i-oplata/index.html',
              'privacy/index.html',
              'prigorody/index.html',
              'prigorody/_template.html',
          }
          missing = sorted(required - set(touched) - {
              # These three were already bumped by the previous exact patch commit.
              'bento-torty/index.html',
              'svadebnye-torty/index.html',
              'zakazat-tort-spb/index.html',
          })
          if missing:
              raise SystemExit(f'expected shared CSS consumers were not revised: {missing}')

          sw = Path('sw.js')
          text = sw.read_text('utf-8')
          replacements = [
              ('Service Worker v1.7 (V20260815-R78)', 'Service Worker v1.8 (V20260906-R79)'),
              ("const CACHE_NAME = 'milovi-cake-v2026.08.15-r78';", "const CACHE_NAME = 'milovi-cake-v2026.09.06-r79';"),
              ("'/css/style.css?v=20260728r27',", "'/css/style.css?v=20260906r03',"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'sw.js expected exactly one match, found {count}: {old}')
              text = text.replace(old, new)
          sw.write_text(text, 'utf-8')

          reg = Path('scripts/lighthouse_regressions.py')
          text = reg.read_text('utf-8')
          marker = "cfg = json.loads(read('.github/lighthouse-config.json'))\n"
          if text.count(marker) != 1:
              raise SystemExit('lighthouse_regressions.py: insertion marker drifted')
          block = '''for public_html in sorted(Path('.').rglob('*.html')):\n    html = read(public_html)\n    if 'style.css?v=' in html:\n        require('style.css?v=20260906r03' in html, f'{public_html} shared style revision drifted')\n        require('style.css?v=20260728r27' not in html, f'{public_html} still references stale shared style revision')\n\nsw = read('sw.js')\nrequire("const CACHE_NAME = 'milovi-cake-v2026.09.06-r79';" in sw, 'service-worker cache generation did not roll with shared CSS')\nrequire("'/css/style.css?v=20260906r03'," in sw, 'service-worker precache still points at stale shared CSS revision')\n\n'''
          if 'service-worker cache generation did not roll with shared CSS' not in text:
              reg.write_text(text.replace(marker, block + marker), 'utf-8')

          print('Revised HTML consumers:', len(touched))
          for path in touched:
              print(path)

      - name: Verify coherent source contract
        run: |
          python3 scripts/lighthouse_regressions.py
          git diff --check

      - name: Commit coherent rollout and remove temporary workflow
        run: |
          rm .github/workflows/landing-css-revision-rollout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(a11y): roll shared CSS cache generation coherently"
          git push origin HEAD:hardening/landing-a11y-20260906
