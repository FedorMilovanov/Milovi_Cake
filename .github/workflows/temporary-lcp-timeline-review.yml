# Temporary PR-only display-mode control; delete with its runner after review.
# Match mobile direct Chrome, real fonts and exact release in headless and Xvfb.
# No Lighthouse, tracing or site edits.
name: Temporary LCP display-mode control

on:
  pull_request:
    paths:
      - .github/workflows/temporary-lcp-timeline-review.yml
      - scripts/diagnostics/lcp_paint_holding_temp.mjs

permissions:
  contents: read

jobs:
  display-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_RELEASE_SHA: e4cc47a5478a2cd1cc29096f51e310633919f3e2
    steps:
      - name: Checkout exact PR-only runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Verify unchanged deployed SHA before measuring
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 scripts/production_release_smoke.py --retries 2 --delay 5
      - name: Install isolated Lighthouse 12.6.1 and pinned Chrome 155
        run: |
          npm install --prefix /tmp/milovi-lighthouse --no-save --ignore-scripts \
            lighthouse@12.6.1 @puppeteer/browsers@3.2.6
          /tmp/milovi-lighthouse/node_modules/.bin/browsers install \
            chrome@155.0.8059.39 --path /tmp/milovi-browser
          CHROME_PATH=/tmp/milovi-browser/chrome/linux-155.0.8059.39/chrome-linux64/chrome
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version | grep -F 155.0.8059.39
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Compare headed and headless direct Chrome on a virtual display
        run: |
          command -v xvfb-run
          command -v Xvfb
          if xvfb-run -a -s '-screen 0 1920x1080x24' \
              node scripts/diagnostics/lcp_paint_holding_temp.mjs > /tmp/milovi-display-control.log 2>&1; then
            cat /tmp/milovi-display-control.log
          else
            cat /tmp/milovi-display-control.log
            echo "::error title=Display-mode control failed::$(tail -n 12 /tmp/milovi-display-control.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Verify deployed SHA again after measuring
        if: always()
        run: python3 scripts/production_release_smoke.py --retries 1
      - name: Retain anonymous lab reports and traces outside Git
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-lcp-display-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/milovi-lcp-display-control/
          if-no-files-found: warn
          retention-days: 21
