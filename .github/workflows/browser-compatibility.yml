name: Browser compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.engine }} resilient interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MILOVI_BROWSER_COMPAT: '1'
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install browser system packages
        timeout-minutes: 12
        run: npx playwright install-deps ${{ matrix.engine }}

      - name: Download browser binary
        timeout-minutes: 8
        run: npx playwright install ${{ matrix.engine }}

      - name: Exercise desktop and narrow-screen fault contracts
        run: >-
          npx playwright test
          --project=${{ matrix.engine }}-desktop --project=${{ matrix.engine }}-mobile
          --workers=1 --retries=0 --reporter=list,github,html

      - name: Upload failed browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
