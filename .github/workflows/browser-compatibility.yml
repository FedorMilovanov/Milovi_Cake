name: Browser compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.engine }} resilient interactions
    runs-on: ubuntu-24.04
    # Match the Playwright version in package.json: this official image already
    # contains its browsers and system libraries, avoiding apt/CDN setup stalls.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Provide headless browsers ample shared memory for media-heavy pages;
      # this does not alter page assets or assertions.
      options: --shm-size=1g
    # Failure-only comparisons can run after the unchanged primary matrix.
    timeout-minutes: 40
    env:
      MILOVI_BROWSER_COMPAT: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Python for the local test server
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm ci

      - name: Record browser shared memory
        run: echo "::notice title=Browser shared memory::$(df -h /dev/shm | tail -n 1)"

      - name: Exercise desktop and narrow-screen fault contracts
        shell: bash
        id: primary_contracts
        # The container runs as root; Firefox requires HOME to belong to it.
        env:
          HOME: /root
          DEBUG: ${{ matrix.engine == 'webkit' && 'pw:browser' || '' }}
          DEBUG_COLORS: '0'
        run: |
          set -o pipefail
          npx playwright test \
            --project=${{ matrix.engine }}-desktop --project=${{ matrix.engine }}-mobile \
            --workers=1 --retries=0 --reporter=list,github,html 2>&1 | tee "$RUNNER_TEMP/${{ matrix.engine }}-primary-browser.log"

      - name: Summarize WebKit primary process events
        if: failure() && matrix.engine == 'webkit' && steps.primary_contracts.outcome == 'failure'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/webkit-primary-browser.log"

      - name: Repeat WebKit storage fault interactions
        if: matrix.engine == 'webkit'
        env:
          HOME: /root
        run: >-
          npx playwright test tests/cart-accessibility.spec.js
          --project=webkit-desktop --grep='cart stays usable and warns'
          --repeat-each=3 --workers=1 --retries=0 --reporter=list,github

      - name: Repeat WebKit gallery close and delayed-load interactions
        if: matrix.engine == 'webkit'
        env:
          HOME: /root
        run: >-
          npx playwright test tests/video-posters.spec.js
          --project=webkit-desktop --project=webkit-mobile
          --grep='gallery can close an active video|late Swiper initializes'
          --repeat-each=3 --workers=1 --retries=0 --reporter=list,github

      - name: Upload failed browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/${{ matrix.engine }}-primary-browser.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

      # Failure-only diagnostics. The primary exact-HEAD step above stays
      # failed; these are independent comparisons, not retries that can turn it green.
      - name: Diagnose Firefox failures on exact source
        id: firefox_diagnostic
        if: failure() && matrix.engine == 'firefox' && steps.primary_contracts.outcome == 'failure'
        env:
          HOME: /root
        run: |
          echo '::notice title=Firefox diagnostic::Three independent runs of the two observed failures; the primary step remains failed'
          npx playwright test tests/cart-accessibility.spec.js tests/protected-interactions.spec.js \
            --project=firefox-desktop --grep='cart restoration rejects|review modal keeps Google' \
            --repeat-each=3 --workers=1 --retries=0 --reporter=list,github

      # Keep the primary result unchanged while collecting trusted input targets
      # for the intermittent photo-filter failure on the exact same source.
      - name: Diagnose Firefox photo-filter input
        if: failure() && matrix.engine == 'firefox' && steps.primary_contracts.outcome == 'failure'
        env:
          HOME: /root
        run: >-
          npx playwright test tests/video-posters.spec.js
          --project=firefox-mobile --grep='photo-only gallery can repeatedly open and close'
          --repeat-each=20 --workers=1 --retries=0 --reporter=list,github
          --output="$RUNNER_TEMP/firefox-photo-input-results"

      - name: Upload Firefox diagnostic artifacts
        if: always() && matrix.engine == 'firefox' && steps.firefox_diagnostic.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

      # This is a required stability check, not a retry that can erase a failure.
      - name: Repeat Firefox gallery focus visibility
        id: firefox_caption_repeat
        if: ${{ !cancelled() && matrix.engine == 'firefox' && steps.primary_contracts.outcome != 'skipped' }}
        env:
          HOME: /root
        run: |
          echo '::notice title=Firefox focus checks::Six independent caption keyboard checks; the primary result is unchanged'
          npx playwright test tests/video-posters.spec.js --project=firefox-desktop \
            --grep='caption reflows and remains keyboard reachable' \
            --repeat-each=6 --workers=1 --retries=0 --reporter=list,github --output="$RUNNER_TEMP/firefox-caption-results"

      - name: Upload Firefox gallery focus diagnostic artifacts
        if: always() && matrix.engine == 'firefox' && steps.firefox_caption_repeat.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-caption-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firefox-caption-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

      - name: Diagnose WebKit 1.63 active-video baseline
        shell: bash
        id: webkit_baseline
        if: failure() && matrix.engine == 'webkit'
        env:
          HOME: /root
          DEBUG: pw:browser
          DEBUG_COLORS: '0'
        run: |
          set -o pipefail
          echo '::notice title=WebKit diagnostic::Original 1.63 source, four independent active-video runs'
          npx playwright test tests/video-posters.spec.js --project=webkit-desktop \
            --grep='gallery can close an active video' --repeat-each=4 --workers=1 --retries=0 --reporter=list,github \
            2>&1 | tee "$RUNNER_TEMP/webkit-baseline-browser.log"

      - name: Summarize WebKit baseline process events
        if: failure() && matrix.engine == 'webkit' && steps.webkit_baseline.outcome != 'skipped'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/webkit-baseline-browser.log"

      - name: Upload WebKit baseline process log
        if: always() && matrix.engine == 'webkit' && steps.webkit_baseline.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-baseline-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webkit-baseline-browser.log
          if-no-files-found: error
          retention-days: 7

      - name: Compare WebKit without screencast capture
        id: webkit_no_capture
        if: failure() && matrix.engine == 'webkit' && steps.webkit_baseline.outcome != 'skipped'
        env:
          HOME: /root
        run: |
          # Diagnostic only: keep the original source, tests and assertions.
          # Trace snapshots remain available, but video and trace screenshots
          # are disabled together to isolate capture instrumentation as a group.
          cat > "$RUNNER_TEMP/milovi-no-capture.config.cjs" <<'NODE'
          const path = require('node:path');
          const root = process.env.GITHUB_WORKSPACE;
          const base = require(path.join(root, 'playwright.config.js'));
          module.exports = {
            ...base,
            testDir: path.join(root, 'tests'),
            // The generated config lives outside the checkout; serve the real site.
            webServer: { ...base.webServer, cwd: root, url: 'http://127.0.0.1:4173/gallery/' },
            use: { ...base.use, video: 'off', trace: { mode: 'retain-on-failure', screenshots: false } },
          };
          NODE
          echo '::notice title=WebKit diagnostic::Original 1.63 source without video or trace screenshots; primary result remains failed'
          npx playwright test tests/video-posters.spec.js --config="$RUNNER_TEMP/milovi-no-capture.config.cjs" \
            --project=webkit-desktop --grep='gallery can close an active video' \
            --repeat-each=4 --workers=1 --retries=0 --reporter=list,github --output="$RUNNER_TEMP/milovi-no-capture-results"

      - name: Upload WebKit capture diagnostic artifacts
        if: always() && matrix.engine == 'webkit' && steps.webkit_no_capture.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-no-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/milovi-no-capture-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

      - name: Compare without the additional video load call
        id: webkit_no_load
        if: failure() && matrix.engine == 'webkit' && steps.webkit_baseline.outcome != 'skipped'
        env:
          HOME: /root
        run: |
          cp js/gallery/main.js "$RUNNER_TEMP/gallery-main-original.js"
          sha256sum js/gallery/main.js > "$RUNNER_TEMP/gallery-main-original.sha256"
          python3 -c 'from pathlib import Path; p=Path("js/gallery/main.js"); s=p.read_text(); old="    video.load();\n"; assert s.count(old) == 1; p.write_text(s.replace(old, ""))'
          echo '::notice title=WebKit diagnostic::Experimental source without the extra video.load call; not the exact HEAD'
          npx playwright test tests/video-posters.spec.js --project=webkit-desktop \
            --grep='gallery can close an active video' --repeat-each=4 --workers=1 --retries=0 --reporter=list,github

      - name: Restore exact source after WebKit comparison
        id: webkit_restore
        if: always() && matrix.engine == 'webkit' && steps.webkit_no_load.outcome != 'skipped'
        run: |
          cp "$RUNNER_TEMP/gallery-main-original.js" js/gallery/main.js
          sha256sum --check "$RUNNER_TEMP/gallery-main-original.sha256"

  # Independent exact-HEAD stability check. It cannot change the primary
  # matrix result and reports media-query event ordering even if that long
  # matrix later fails or a renderer crashes in an unrelated scenario.
  motion-ordering:
    name: ${{ matrix.engine }} reduced-motion ordering
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1g
    timeout-minutes: 12
    env:
      HOME: /root
      MILOVI_BROWSER_COMPAT: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Python for the local test server
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: npm ci

      - name: Repeat actual motion-preference ordering
        run: >-
          npx playwright test tests/video-posters.spec.js
          --project=${{ matrix.engine }}-desktop --project=${{ matrix.engine }}-mobile
          --grep='queued grid observer callbacks respect a newly reduced-motion preference'
          --repeat-each=3 --workers=1 --retries=0 --reporter=list,github

      - name: Upload motion failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motion-ordering-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  # Reference only: the pinned 1.63 primary above remains authoritative and
  # failed even if this separate official 1.64.1 container happens to pass.
  webkit-newer-reference:
    name: WebKit 1.64 reference on unchanged source
    needs: compatibility
    if: ${{ !cancelled() && needs.compatibility.result == 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --shm-size=1g
    timeout-minutes: 15
    env:
      HOME: /root
      MILOVI_BROWSER_COMPAT: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DEBUG: pw:browser
      DEBUG_COLORS: '0'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Python for the local test server
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Install temporary matching Playwright
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.64.1 playwright@1.64.1
          # Container root and checkout ownership can differ. Trust only this
          # workspace for these Git commands, not every mounted repository.
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
          source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$source_sha" = '${{ github.event.pull_request.head.sha }}'
          echo "::notice title=WebKit reference version::$(npx playwright --version); source $source_sha"

      - name: Compare active video in the official 1.64.1 image
        shell: bash
        id: newer_video
        run: |
          set -o pipefail
          echo '::notice title=WebKit reference::Four independent checks in official Playwright 1.64.1; the failed primary remains failed'
          npx playwright test tests/video-posters.spec.js --project=webkit-desktop \
            --grep='gallery can close an active video' --repeat-each=4 --workers=1 --retries=0 --reporter=list,github \
            2>&1 | tee "$RUNNER_TEMP/webkit-newer-browser.log"

      - name: Summarize WebKit 1.64 process events
        if: failure() && steps.newer_video.outcome == 'failure'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/webkit-newer-browser.log"

      - name: Upload WebKit 1.64 reference artifacts
        if: failure() && steps.newer_video.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-164-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            ${{ runner.temp }}/webkit-newer-browser.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  # Diagnostic comparisons only. All variants retain the existing tests and
  # browser configuration; none can change the primary matrix result.
  webkit-filter-reference:
    name: WebKit gallery comparison (${{ matrix.variant }})
    needs: compatibility
    if: ${{ !cancelled() && needs.compatibility.result == 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1g
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [original, no-filter-interpolation, release-grid-media]
    env:
      HOME: /root
      MILOVI_BROWSER_COMPAT: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DEBUG: pw:browser
      DEBUG_COLORS: '0'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Python for the local test server
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: npm ci

      - name: Prepare controlled gallery variant
        run: |
          cp css/gallery/gallery-2026.css "$RUNNER_TEMP/gallery-original.css"
          cp js/gallery/main.js "$RUNNER_TEMP/gallery-original.js"
          sha256sum css/gallery/gallery-2026.css js/gallery/main.js > "$RUNNER_TEMP/gallery-original.sha256"
          if [ '${{ matrix.variant }}' = 'no-filter-interpolation' ]; then
            python3 scripts/gallery_filter_experiment.py css/gallery/gallery-2026.css "$RUNNER_TEMP/gallery-experiment.css"
            cp "$RUNNER_TEMP/gallery-experiment.css" css/gallery/gallery-2026.css
          elif [ '${{ matrix.variant }}' = 'release-grid-media' ]; then
            python3 scripts/gallery_media_experiment.py js/gallery/main.js "$RUNNER_TEMP/gallery-experiment.js"
            cp "$RUNNER_TEMP/gallery-experiment.js" js/gallery/main.js
          fi
          echo '::notice title=WebKit gallery comparison::Variant ${{ matrix.variant }}; browser and assertions remain unchanged'

      - name: Compare real gallery interactions
        shell: bash
        id: filter_tests
        run: |
          set -o pipefail
          npx playwright test tests/video-posters.spec.js --project=webkit-desktop --project=webkit-mobile \
            --grep='fallback supports buttons|gallery can close an active video|gallery media, caption and controls do not overlap' \
            --repeat-each=2 --workers=1 --retries=0 --reporter=list,github \
            2>&1 | tee "$RUNNER_TEMP/webkit-filter-${{ matrix.variant }}.log"

      - name: Measure filter-transition precondition
        shell: bash
        id: filter_probe
        if: ${{ !cancelled() && steps.filter_tests.outcome != 'skipped' && matrix.variant != 'release-grid-media' }}
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/filter-http.log" 2>&1 &
          server_pid=$!
          cleanup() { if kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; fi; }
          trap cleanup EXIT
          MILOVI_FILTER_VARIANT='${{ matrix.variant }}' MILOVI_FILTER_SERVER_PID="$server_pid" node scripts/gallery_filter_probe.cjs \
            2>&1 | tee "$RUNNER_TEMP/webkit-filter-probe-${{ matrix.variant }}.log"
          kill -0 "$server_pid" # Reject a server that exited during the probe.

      - name: Measure grid-media lifecycle
        shell: bash
        id: media_probe
        if: ${{ !cancelled() && steps.filter_tests.outcome != 'skipped' && matrix.variant != 'no-filter-interpolation' }}
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/media-http.log" 2>&1 &
          server_pid=$!
          cleanup() { if kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; fi; }
          trap cleanup EXIT
          MILOVI_MEDIA_VARIANT='${{ matrix.variant }}' MILOVI_MEDIA_SERVER_PID="$server_pid" node scripts/gallery_media_probe.cjs \
            2>&1 | tee "$RUNNER_TEMP/webkit-media-probe-${{ matrix.variant }}.log"
          kill -0 "$server_pid" # Reject a server that exited during the probe.

      - name: Restore and verify exact gallery assets
        if: always()
        run: |
          cp "$RUNNER_TEMP/gallery-original.css" css/gallery/gallery-2026.css
          cp "$RUNNER_TEMP/gallery-original.js" js/gallery/main.js
          sha256sum --check "$RUNNER_TEMP/gallery-original.sha256"
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code

      - name: Summarize filter-comparison process events
        if: failure() && steps.filter_tests.outcome == 'failure'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/webkit-filter-${{ matrix.variant }}.log"

      - name: Summarize filter-probe process events
        if: failure() && steps.filter_probe.outcome == 'failure'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/webkit-filter-probe-${{ matrix.variant }}.log"

      - name: Summarize media-probe process events
        if: failure() && steps.media_probe.outcome == 'failure'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/webkit-media-probe-${{ matrix.variant }}.log"

      - name: Upload filter-comparison artifacts
        if: failure() && (steps.filter_tests.outcome == 'failure' || steps.filter_probe.outcome == 'failure' || steps.media_probe.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-filter-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            ${{ runner.temp }}/webkit-filter-${{ matrix.variant }}.log
            ${{ runner.temp }}/webkit-filter-probe-${{ matrix.variant }}.log
            ${{ runner.temp }}/webkit-media-probe-${{ matrix.variant }}.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  # Diagnostic only: compare identical real interactions in isolated copies.
  # Removing audio is not a proposed site change or a way to pass primary CI.
  webkit-audio-investigation:
    name: WebKit audio-stream investigation (${{ matrix.variant }})
    needs: compatibility
    if: ${{ !cancelled() && needs.compatibility.result == 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1g
    timeout-minutes: 25
    env:
      HOME: /root
      MILOVI_BROWSER_COMPAT: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DEBUG: pw:browser
      DEBUG_COLORS: '0'
    strategy:
      fail-fast: false
      matrix:
        variant: [original, video-only]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Setup Python for the local test server
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: npm ci
      - name: Prepare isolated exact-source comparison
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$source_sha" = '${{ github.event.pull_request.head.sha }}'
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
          scratch="$RUNNER_TEMP/audio-investigation"
          mkdir -p "$scratch"
          # `git archive` omits tests/config via export-ignore; copy tracked
          # checkout files instead, after verifying clean exact HEAD above.
          git -c safe.directory="$GITHUB_WORKSPACE" ls-files -z | tar --null -T - -cf - | tar -x -C "$scratch"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$scratch/node_modules"
          # Dedicated port and no reuse: both variants must actually serve their
          # own scratch files, not an unrelated server in the runner.
          cat > "$scratch/audio-playwright.config.cjs" <<'CONFIG'
          const base = require('./playwright.config.js');
          const storageState = require('./tests/analytics-denied.storage-state.json');
          const oldOrigin = 'http://127.0.0.1:4173', newOrigin = 'http://127.0.0.1:4179';
          if (!storageState.origins.some(entry => entry.origin === oldOrigin)) throw new Error('Missing original consent fixture');
          storageState.origins = storageState.origins.map(entry => ({ ...entry, origin: entry.origin === oldOrigin ? newOrigin : entry.origin }));
          module.exports = { ...base,
            use: { ...base.use, baseURL: newOrigin, storageState },
            webServer: { ...base.webServer, command: 'python3 -m http.server 4179 --bind 127.0.0.1',
              url: 'http://127.0.0.1:4179/gallery/', reuseExistingServer: false }
          };
          CONFIG
          if [ '${{ matrix.variant }}' = 'video-only' ]; then
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
              apt-get update && apt-get install -y --no-install-recommends ffmpeg
            fi
            count=0
            for video in "$scratch"/img/gallery/videos/*.webm; do
              [ -f "$video" ] || exit 1
              output="$RUNNER_TEMP/$(basename "$video")"
              before="$(ffmpeg -v error -i "$video" -map 0:v:0 -c copy -f hash -hash sha256 -)"
              ffmpeg -v error -i "$video" -map 0:v:0 -c copy -an -y "$output"
              after="$(ffmpeg -v error -i "$output" -map 0:v:0 -c copy -f hash -hash sha256 -)"
              test "$before" = "$after"
              test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$output")" = ''
              mv "$output" "$video"
              count=$((count + 1))
            done
            test "$count" = 16
            echo "::notice title=Audio investigation::16 isolated WebM files remuxed; video stream SHA-256 preserved, audio streams absent"
          else
            echo '::notice title=Audio investigation::Original exact-HEAD assets in isolated checkout'
          fi
      - name: Compare active-video interaction with unchanged assertions
        shell: bash
        id: audio_tests
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/audio-investigation"
          npx playwright test tests/video-posters.spec.js --config=audio-playwright.config.cjs \
            --project=webkit-desktop --project=webkit-mobile \
            --grep='gallery can close an active video and reopen without CDN' \
            --repeat-each=4 --workers=1 --retries=0 --reporter=list,github \
            2>&1 | tee "$RUNNER_TEMP/audio-investigation-${{ matrix.variant }}.log"
      - name: Summarize audio-comparison process events
        if: failure() && steps.audio_tests.outcome == 'failure'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/audio-investigation-${{ matrix.variant }}.log"
      - name: Upload audio-comparison artifacts
        if: failure() && steps.audio_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-audio-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/audio-investigation/test-results/
            ${{ runner.temp }}/audio-investigation-${{ matrix.variant }}.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  # Reference only: compare the PR and its base with the same real photo UI.
  # A separate media-blocked lane is an experiment, not a primary test change.
  webkit-base-investigation:
    name: WebKit base comparison (${{ matrix.source }}, ${{ matrix.media }})
    needs: compatibility
    if: ${{ !cancelled() && needs.compatibility.result == 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1g
    timeout-minutes: 20
    env:
      HOME: /root
      MILOVI_BROWSER_COMPAT: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DEBUG: pw:browser
      DEBUG_COLORS: '0'
    strategy:
      fail-fast: false
      matrix:
        source: [head, base]
        media: [normal, blocked]
    steps:
      - name: Checkout exact PR head and base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Setup Python for the local test server
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: npm ci
      - name: Prepare isolated base comparison
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$HEAD_SHA"
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
          git -c safe.directory="$GITHUB_WORKSPACE" cat-file -e "$BASE_SHA^{commit}"
          scratch="$RUNNER_TEMP/base-investigation"
          mkdir -p "$scratch"
          if [ '${{ matrix.source }}' = 'base' ]; then
            # Release assets from exact base, plus the same HEAD tests/config.
            git -c safe.directory="$GITHUB_WORKSPACE" archive "$BASE_SHA" | tar -x -C "$scratch"
            cp -a tests "$scratch/tests"
            cp playwright.config.js package.json "$scratch/"
            source_sha="$BASE_SHA"
          else
            git -c safe.directory="$GITHUB_WORKSPACE" ls-files -z | tar --null -T - -cf - | tar -x -C "$scratch"
            source_sha="$HEAD_SHA"
          fi
          ln -s "$GITHUB_WORKSPACE/node_modules" "$scratch/node_modules"
          cat > "$scratch/base-playwright.config.cjs" <<'CONFIG'
          const base = require('./playwright.config.js');
          const storageState = require('./tests/analytics-denied.storage-state.json');
          const oldOrigin = 'http://127.0.0.1:4173', newOrigin = 'http://127.0.0.1:4179';
          if (!storageState.origins.some(entry => entry.origin === oldOrigin)) throw new Error('Missing original consent fixture');
          storageState.origins = storageState.origins.map(entry => ({ ...entry, origin: entry.origin === oldOrigin ? newOrigin : entry.origin }));
          module.exports = { ...base, use: { ...base.use, baseURL: newOrigin, storageState },
            webServer: { ...base.webServer, command: 'python3 -m http.server 4179 --bind 127.0.0.1',
              url: 'http://127.0.0.1:4179/gallery/', reuseExistingServer: false } };
          CONFIG
          echo "::notice title=Base comparison::site SHA $source_sha; HEAD tests; media ${{ matrix.media }}"
      - name: Compare real photo interactions on base and head
        shell: bash
        id: base_tests
        env:
          MILOVI_DIAGNOSTIC_BLOCK_VIDEO: ${{ matrix.media == 'blocked' && '1' || '0' }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/base-investigation"
          npx playwright test tests/video-posters.spec.js --config=base-playwright.config.cjs \
            --project=webkit-desktop --project=webkit-mobile \
            --grep='photo-only gallery can repeatedly open and close without CDN' \
            --repeat-each=4 --workers=1 --retries=0 --reporter=list,github \
            2>&1 | tee "$RUNNER_TEMP/base-${{ matrix.source }}-${{ matrix.media }}.log"
      - name: Summarize base comparison process events
        if: failure() && steps.base_tests.outcome == 'failure'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/base-${{ matrix.source }}-${{ matrix.media }}.log"
      - name: Upload base comparison artifacts
        if: failure() && steps.base_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-base-${{ matrix.source }}-${{ matrix.media }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/base-investigation/test-results/
            ${{ runner.temp }}/base-${{ matrix.source }}-${{ matrix.media }}.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  # Failure-only experiment: keep HEAD assets and unchanged primary assertions,
  # compare normal decoding with an independently verified WebP fallback.
  webkit-image-investigation:
    name: WebKit image comparison (${{ matrix.image }})
    needs: compatibility
    if: ${{ !cancelled() && needs.compatibility.result == 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1g
    timeout-minutes: 20
    env:
      HOME: /root
      MILOVI_BROWSER_COMPAT: '1'
      MILOVI_DIAGNOSTIC_IMAGE_MODE: ${{ matrix.image }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DEBUG: pw:browser
      DEBUG_COLORS: '0'
    strategy:
      fail-fast: false
      matrix:
        image: [original, webp]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Setup Python for the local test server
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: npm ci
      - name: Compare gallery image decoding
        shell: bash
        id: image_tests
        run: |
          set -o pipefail
          echo '::notice title=Image comparison::Exact HEAD; ${{ matrix.image }} image requests; same tests and assertions; diagnostic only'
          npx playwright test tests/video-posters.spec.js \
            --project=webkit-desktop --project=webkit-mobile \
            --grep='photo-only gallery can repeatedly open and close|gallery can close an active video' \
            --repeat-each=4 --workers=1 --retries=0 --reporter=list,github \
            2>&1 | tee "$RUNNER_TEMP/webkit-image-${{ matrix.image }}.log"
      - name: Summarize image-comparison process events
        if: failure() && steps.image_tests.outcome == 'failure'
        run: python3 scripts/browser_log_summary.py "$RUNNER_TEMP/webkit-image-${{ matrix.image }}.log"
      - name: Upload image-comparison artifacts
        if: failure() && steps.image_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-image-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            ${{ runner.temp }}/webkit-image-${{ matrix.image }}.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  # Diagnostic only: process tracing changes timing and is isolated from the
  # unchanged primary job. A debugger stop is not automatically a crash.
  webkit-native-investigation:
    name: WebKit native process investigation
    needs: compatibility
    if: ${{ !cancelled() && needs.compatibility.result == 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --shm-size=1g --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    timeout-minutes: 20
    env:
      HOME: /root
      MILOVI_BROWSER_COMPAT: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DEBUG: pw:browser
      DEBUG_COLORS: '0'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Setup Python for the local test server
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install project and debugger dependencies
        run: |
          npm ci
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gdb
      - name: Verify debugger on a controlled native signal
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 scripts/webkit_native_monitor.py monitor "$RUNNER_TEMP/native-preflight" &
          monitor=$!
          python3 scripts/webkit_native_probe.py &
          probe=$!
          set +e
          wait "$probe"
          probe_status=$?
          # GDB can flush its backtrace slightly after the inferior exits.
          python3 - "$RUNNER_TEMP/native-preflight" <<'PY'
          import pathlib, sys, time
          root = pathlib.Path(sys.argv[1])
          for _ in range(80):
              if any('received signal SIGABRT' in p.read_text(errors='replace') for p in root.glob('wpe-*.log')):
                  break
              time.sleep(.1)
          PY
          kill "$monitor"
          wait "$monitor"
          set -e
          python3 scripts/webkit_native_monitor.py summary "$RUNNER_TEMP/native-preflight"
          test "$probe_status" -eq 134
          grep -El 'received signal SIGABRT' "$RUNNER_TEMP"/native-preflight/wpe-*.log
      - name: Compare unchanged gallery under native debugger
        shell: bash
        id: native_tests
        run: |
          set -uo pipefail
          ulimit -c 0
          python3 scripts/webkit_native_monitor.py monitor "$RUNNER_TEMP/native-traces" &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null; wait "$monitor" 2>/dev/null' EXIT
          echo '::notice title=Native investigation::Debugger attachment changes timing; primary result remains unchanged'
          # GitHub invokes bash with -e: preserve failures, but first stop the
          # debugger and publish the evidence instead of exiting mid-pipeline.
          set +e
          npx playwright test tests/video-posters.spec.js \
            --project=webkit-desktop --project=webkit-mobile \
            --grep='gallery can close an active video|photo-only gallery can repeatedly open and close' \
            --repeat-each=4 --workers=1 --retries=0 --reporter=list,github \
            2>&1 | tee "$RUNNER_TEMP/webkit-native.log"
          statuses=("${PIPESTATUS[@]}")
          result=${statuses[0]}
          if [ "$result" -eq 0 ] && [ "${statuses[1]}" -ne 0 ]; then result=${statuses[1]}; fi
          kill "$monitor"
          wait "$monitor"
          monitor_result=$?
          set -e
          trap - EXIT
          python3 scripts/webkit_native_monitor.py summary "$RUNNER_TEMP/native-traces"
          if [ "$result" -eq 0 ] && [ "$monitor_result" -ne 0 ]; then result=$monitor_result; fi
          exit "$result"
      - name: Upload native investigation artifacts
        if: always() && steps.native_tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-traces/
            ${{ runner.temp }}/webkit-native.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
