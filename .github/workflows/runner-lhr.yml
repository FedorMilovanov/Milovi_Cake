name: Runner LHR extract

# Зачем: песочница расследования не открывает прод и не скачивает артефакты
# Actions (блоб-хост вне egress). Раннер открывает и то, и другое, поэтому
# разбор чисел раннера идёт здесь, а результат коммитится в ветку.
# Запускается сам при правке скрипта/воркфлоу, либо вручную с нужным run_id.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID прогона Actions с артефактом lighthouse-results (пусто = последний Lighthouse)'
        required: false
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/runner_lhr_extract.py'
      - '.github/workflows/runner-lhr.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: runner-lhr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve lighthouse run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          run_id="${INPUT_RUN_ID:-}"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lighthouse.yml/runs?per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "не нашёл прогон Lighthouse" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "использую прогон $run_id"

      - name: Download lighthouse-results artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name=="lighthouse-results")][0].id')
          if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
            echo "в прогоне $RUN_ID нет артефакта lighthouse-results" >&2
            exit 1
          fi
          mkdir -p /tmp/lh
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/lh.zip
          unzip -q -o /tmp/lh.zip -d /tmp/lh
          echo "распаковано: $(find /tmp/lh -name '*.json' | wc -l) json-файлов, $(du -sh /tmp/lh | cut -f1)"

      - name: Extract runner numbers
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/runner_lhr_extract.py /tmp/lh --out "docs/data/runner-lhr-${RUN_ID}.json"

      - name: Annotate key numbers
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 - "docs/data/runner-lhr-${RUN_ID}.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          for report in data["reports"][:9]:
              url = (report.get("url") or "?").replace("https://milovicake.ru", "")
              metrics = report["metrics"]
              window = report["tbt_window"]
              print(
                  f"::notice::{url or '/'} | benchmarkIndex {report.get('benchmark_index')} | "
                  f"FCP {metrics['fcp']} | TTI {metrics['tti']} | "
                  f"TBT {metrics['tbt']} (пересчёт {window['recomputed']}) | "
                  f"LCP {metrics['lcp']} | main-thread {report['main_thread']['total_ms']} мс"
              )
          PY

      - name: Commit extraction to branch
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "на main не коммитим — это инструмент расследования"
            exit 0
          fi
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@users.noreply.github.com'
          git checkout -B "$GITHUB_REF_NAME"
          git add docs/data
          if git diff --cached --quiet; then
            echo "данные не изменились"
            exit 0
          fi
          git commit \
            -m "chore(perf): числа раннера из артефакта прогона $RUN_ID" \
            -m "Извлечено scripts/runner_lhr_extract.py из lighthouse-results; полные LHR остаются в артефакте." \
            -m "Co-authored-by: arena-agent"
          git push origin "HEAD:$GITHUB_REF_NAME"
