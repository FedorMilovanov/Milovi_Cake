name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build exact Pages candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete source and browser QA
        run: npm run qa

      - name: Upload UI audit proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ui-audit/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

      - name: Build sanitized immutable Pages artifact
        run: npm run build:pages

      - name: Audit exact Pages artifact
        run: npm run audit:pages

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: Deploy exact candidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact candidate
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live-proof-smoke-indexnow:
    name: Prove live release, smoke production, notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.sha }}
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
      LIVE_BASE: https://milovicake.ru
    steps:
      - name: Checkout the same source for smoke and IndexNow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for CDN and prove exact live release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --connect-timeout 10 --max-time 20 "$LIVE_BASE/release.json?attempt=$attempt" || true)"
            if BODY="$body" python3 -c 'import json,os,sys; p=json.loads(os.environ["BODY"]); sys.exit(0 if p.get("repository")=="FedorMilovanov/Milovi_Cake" and p.get("sha")==os.environ["EXPECTED_SHA"] else 1)' 2>/dev/null; then
              echo "Live release witness matches $EXPECTED_SHA"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Live release witness did not reach $EXPECTED_SHA" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Run transport/content smoke after proven deploy
        run: python3 scripts/production_smoke.py --retries 3 --delay 10

      - name: Verify exact release, privacy and true 404
        run: python3 scripts/production_release_smoke.py --retries 3 --delay 10

      - name: Notify IndexNow only after all live gates succeed
        run: python3 scripts/submit_indexnow.py
