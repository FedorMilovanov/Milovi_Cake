name: Lighthouse artifact

# Аудит артефакта, а не живого URL.
#
# После deploy скачивается именно опубликованный immutable Pages payload.
# Ручной запуск проверяет пересборку выбранного source SHA. Оба режима требуют
# exact release witness. Локальный gzip исключает CDN, но не CPU/планировщик.
# LCP 2500 ms / TBT 300 ms пока warn: SUCCESS не означает соблюдение бюджета.

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/lighthouse-artifact-config.json'
      - '.github/workflows/lighthouse-artifact.yml'
      - '.github/workflows/browser-compatibility.yml'
      - 'scripts/serve_pages_artifact.py'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'fonts/**'
      - '*.html'
      - 'prigorody/**'
      - 'sw.js'
      - 'manifest.json'
      - '**/*.html'

permissions:
  contents: read
  actions: read

concurrency:
  group: lighthouse-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AUDIT_SHA }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'

      - name: Install locked build and artifact-audit dependencies
        run: npm ci

      - name: Download the published Pages payload
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$DEPLOY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name github-pages --dir "$RUNNER_TEMP/pages-release"
          mkdir -p _site
          tar --extract --file "$RUNNER_TEMP/pages-release/artifact.tar" \
            --directory _site --no-same-owner --no-same-permissions

      - name: Build exact source snapshot for a direct audit
        if: github.event_name != 'workflow_run'
        run: |
          set -euo pipefail
          npm run build:pages

      - name: Prove the payload release identity
        run: npm run audit:pages

      - name: Serve published artifact via production-like HTTPS/HTTP2
        run: |
          set -euo pipefail
          # Only the loopback fixture uses a temporary self-signed certificate.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/pages-local.key" \
            -out "$RUNNER_TEMP/pages-local.crt" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" >/dev/null 2>&1
          node --check scripts/serve_pages_artifact_h2.mjs
          node scripts/serve_pages_artifact_h2.mjs --port 4300 --root _site \
            --cert "$RUNNER_TEMP/pages-local.crt" \
            --key "$RUNNER_TEMP/pages-local.key" > "$RUNNER_TEMP/pages-h2.log" 2>&1 &
          echo $! > /tmp/artifact-server.pid
          for _ in $(seq 1 30); do
            if curl -fsS --http2 --cacert "$RUNNER_TEMP/pages-local.crt" \
                https://127.0.0.1:4300/release.json >/dev/null 2>&1; then
              echo "Pages HTTP/2 artifact server ready"
              break
            fi
            sleep 1
          done
          curl -fsS --http2 --cacert "$RUNNER_TEMP/pages-local.crt" \
            https://127.0.0.1:4300/release.json

      - name: Verify immutable artifact bytes and negotiated HTTP/2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, os, subprocess
          from pathlib import Path
          cert = str(Path(os.environ['RUNNER_TEMP']) / 'pages-local.crt')
          url = 'https://127.0.0.1:4300/'
          headers = Path(os.environ['RUNNER_TEMP']) / 'pages-response-headers.txt'
          encoded = subprocess.check_output([
              'curl', '--fail', '--silent', '--show-error', '--http2',
              '--cacert', cert, '-H', 'Accept-Encoding: gzip',
              '-D', str(headers), url], timeout=20)
          if b'content-encoding: gzip' not in headers.read_bytes().lower():
              raise SystemExit('Pages artifact HTML lacks gzip transfer')
          body = gzip.decompress(encoded)
          if body != Path('_site/index.html').read_bytes():
              raise SystemExit('served HTML differs from immutable Pages payload')
          proto = subprocess.check_output([
              'curl','--fail','--silent','--show-error','--http2',
              '--cacert',cert,'-o','/dev/null','-w','%{http_version}',url],timeout=20).decode()
          if proto != '2':
              raise SystemExit('Pages fixture did not negotiate HTTP/2: '+proto)
          release = json.loads(subprocess.check_output([
              'curl','--fail','--silent','--show-error','--http2',
              '--cacert',cert,url+'release.json'],timeout=20))
          if release.get('sha') != os.environ['AUDIT_SHA']:
              raise SystemExit('served release witness differs from audit SHA')
          print(f'ok: exact release, gzip, HTTP/2, {len(body)} bytes HTML')
          PY

      - name: Audit artifact with Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://127.0.0.1:4300/
            https://127.0.0.1:4300/gallery/
            https://127.0.0.1:4300/svadebnye-torty/
            https://127.0.0.1:4300/bento-torty/
            https://127.0.0.1:4300/zakazat-tort-spb/
            https://127.0.0.1:4300/o-konditere/
            https://127.0.0.1:4300/prigorody/gatchina/
            https://127.0.0.1:4300/privacy/
          configPath: ./.github/lighthouse-artifact-config.json
          uploadArtifacts: true

      - name: Report per-run numbers
        if: always()
        run: |
          set -euo pipefail
          # Отчёт по каждому прогону, а не только медиана: решение о пороге
          # принимается по разбросу, и он должен быть виден в аннотациях.
          # find -print -quit вместо `find | head -1`: под pipefail head
          # закрывает канал раньше, find получает SIGPIPE и шаг падает.
          results=$(find "$GITHUB_WORKSPACE" /tmp -maxdepth 6 -type d -name '.lighthouseci' -print -quit 2>/dev/null || true)
          if [ -z "$results" ]; then
            echo "::error::каталог .lighthouseci не найден — измерение не подтверждено"
            exit 1
          fi
          python3 scripts/runner_lhr_extract.py "$results" --out /tmp/artifact-runs.json
          python3 - /tmp/artifact-runs.json <<'PY'
          import json, statistics as st, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception as exc:
              raise SystemExit(f'не удалось прочитать извлечение: {exc}')

          pages = {}
          for report in data.get('reports', []):
              url = (report.get('url') or '?').replace('https://127.0.0.1:4300', '') or '/'
              pages.setdefault(url, []).append(report)

          def stat(values):
              clean = [v for v in values if isinstance(v, (int, float))]
              if not clean:
                  return '?'
              return f'{st.median(clean):.0f}/{max(clean):.0f}'

          for url, reports in pages.items():
              if len(reports) != 3:
                  raise SystemExit(f'{url}: expected 3 independent runs, found {len(reports)}')
              metrics = [r['metrics'] for r in reports]
              print(
                  f"::notice::artifact {url} | n={len(reports)} "
                  f"| FCP {stat([m['fcp'] for m in metrics])} "
                  f"| LCP {stat([m['lcp'] for m in metrics])} "
                  f"| TBT {stat([m['tbt'] for m in metrics])} "
                  f"| work {stat([r['main_thread']['total_ms'] for r in reports])} "
                  f"| bytes {stat([r['bytes']['total'] for r in reports])} "
                  f"| tx JS {stat([r['bytes']['observed_network_transfer']['by_type_bytes'].get('Script', 0) for r in reports])} "
                  f"| CSS {stat([r['bytes']['observed_network_transfer']['by_type_bytes'].get('Stylesheet', 0) for r in reports])} "
                  f"| fonts {stat([r['bytes']['observed_network_transfer']['by_type_bytes'].get('Font', 0) for r in reports])} "
                  f"| images {stat([r['bytes']['observed_network_transfer']['by_type_bytes'].get('Image', 0) for r in reports])} "
                  f"(медиана/максимум)"
              )
          PY

      - name: Stop artifact server
        if: always()
        run: |
          # kill по сохранённому PID: pkill -f убил бы собственный shell шага,
          # потому что шаблон есть в его командной строке.
          if [ -f /tmp/artifact-server.pid ]; then
            kill "$(cat /tmp/artifact-server.pid)" 2>/dev/null || true
          fi
