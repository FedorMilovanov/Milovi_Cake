name: Temporary landing a11y patch

on:
  push:
    branches:
      - hardening/landing-a11y-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: hardening/landing-a11y-20260906
          fetch-depth: 0

      - name: Apply exact a11y source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]}')
              p.write_text(text.replace(old, new), 'utf-8')

          replace_once(
              'css/style.css',
              '.lp-btn-primary{background:var(--gold);color:#fff;box-shadow:0 12px 32px rgba(201,147,74,.28)}',
              '.lp-btn-primary{background:var(--gold);color:#2c1a10;box-shadow:0 12px 32px rgba(201,147,74,.28)}',
          )
          replace_once(
              'css/style.css',
              ".bridal-callout-inner a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;background:var(--gold);color:#fff;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.10em;text-transform:uppercase}",
              ".bridal-callout-inner a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;background:var(--gold);color:#2c1a10;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.10em;text-transform:uppercase}",
          )
          replace_once(
              'css/style.css',
              '.landing-footer nav a{font-size:12px;letter-spacing:.10em;text-transform:uppercase}',
              '.landing-footer nav a{display:flex;align-items:center;min-height:24px;font-size:12px;letter-spacing:.10em;text-transform:uppercase}',
          )

          for page in (
              'svadebnye-torty/index.html',
              'bento-torty/index.html',
              'zakazat-tort-spb/index.html',
          ):
              replace_once(
                  page,
                  '/css/style.css?v=20260728r27',
                  '/css/style.css?v=20260906r03',
              )

          regression = Path('scripts/lighthouse_regressions.py')
          text = regression.read_text('utf-8')
          marker = "cfg = json.loads(read('.github/lighthouse-config.json'))\n"
          if text.count(marker) != 1:
              raise SystemExit('lighthouse_regressions.py: insertion marker drifted')
          block = '''landing_css = read('css/style.css')
          require(
              '.lp-btn-primary{background:var(--gold);color:#2c1a10;' in landing_css,
              'commercial landing primary CTA contrast regressed',
          )
          require(
              'background:var(--gold);color:#2c1a10;text-decoration:none;font-size:12px' in landing_css,
              'wedding callout CTA contrast regressed',
          )
          require(
              '.landing-footer nav a{display:flex;align-items:center;min-height:24px;' in landing_css,
              'landing footer link target-size contract regressed',
          )
          for path in ['svadebnye-torty/index.html', 'bento-torty/index.html', 'zakazat-tort-spb/index.html']:
              require('/css/style.css?v=20260906r03' in read(path), f'{path} landing a11y CSS revision drifted')

          '''
          regression.write_text(text.replace(marker, block + marker), 'utf-8')

      - name: Verify source contract
        run: |
          python3 scripts/lighthouse_regressions.py
          git diff --check

      - name: Commit final source diff and remove temporary workflow
        run: |
          rm .github/workflows/landing-a11y-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css svadebnye-torty/index.html bento-torty/index.html zakazat-tort-spb/index.html scripts/lighthouse_regressions.py .github/workflows/landing-a11y-patch.yml
          git commit -m "fix(a11y): harden landing CTA contrast and targets"
          git push origin HEAD:hardening/landing-a11y-20260906
