name: One-shot TBT evidence readout

# TEMPORARY diagnostic workflow (remove after use).
# It does not visit the site, does not touch production and does not change CI gates:
# it only re-reads already saved Lighthouse CI artifacts of existing Lighthouse runs
# and republishes a compact summary as check annotations, because artifact download
# is blocked in the agent sandbox.

on:
  push:
    branches: [arena/b2e5e24a-milovi-cake]
    paths:
      - .github/workflows/_temp-tbt-readout.yml

permissions:
  actions: read
  contents: read

jobs:
  readout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download saved Lighthouse CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lh-art
          for spec in \
            "red:40736722642:12838091844" \
            "green:40435836396:12704810272" \
            "prior:40408519461:12693075585"
          do
            label=${spec%%:*}
            rest=${spec#*:}
            run_id=${rest%%:*}
            artifact_id=${rest##*:}
            curl -sSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" \
              -o "/tmp/${label}.zip"
            mkdir -p "/tmp/lh-art/${label}"
            unzip -oq "/tmp/${label}.zip" -d "/tmp/lh-art/${label}"
            printf '%s saved LHRs: ' "$label"
            find "/tmp/lh-art/${label}" -name 'lhr-*.json' | wc -l
          done

      - name: Summarize saved reports as annotations
        run: |
          python3 - <<'PY'
          import glob
          import json

          RELEASES = [
              ('red', 'RED run 40736722642 @ c0d1a51 2026-10-28'),
              ('green', 'GREEN run 40435836396 @ e4cc47a 2026-10-27'),
              ('prior', 'PRIOR run 40408519461 @ f7c2aa08 2026-10-26'),
          ]

          def esc(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          def emit(title, body):
              print('::warning title=%s::%s' % (esc(title), esc(body)))
              print(title)
              print(body)
              print('-' * 70)

          def short(value):
              return (value or 'unattributable').replace('https://milovicake.ru', '') or '/'

          def num(value):
              if value is None:
                  return 'n/a'
              if isinstance(value, float):
                  return ('%.3f' % value).rstrip('0').rstrip('.')
              return str(value)

          def seq(items):
              return '[' + ', '.join(num(item) for item in items) + ']'

          def audit_value(lhr, audit):
              return (lhr.get('audits', {}).get(audit, {}) or {}).get('numericValue')

          def metrics_item(lhr):
              items = (lhr.get('audits', {}).get('metrics', {}).get('details', {}).get('items') or [])
              return items[0] if items else {}

          def diagnostics_item(lhr):
              items = (lhr.get('audits', {}).get('diagnostics', {}).get('details', {}).get('items') or [])
              return items[0] if items else {}

          def mainthread(lhr):
              items = (lhr.get('audits', {}).get('mainthread-work-breakdown', {})
                       .get('details', {}).get('items') or [])
              return {item.get('group'): item.get('duration') for item in items}

          def load_lhrs(label):
              files = sorted(glob.glob('/tmp/lh-art/%s/**/lhr-*.json' % label, recursive=True))
              out = []
              for path in files:
                  with open(path) as handle:
                      out.append(json.load(handle))
              return out

          def assertion_results(label):
              hits = glob.glob('/tmp/lh-art/%s/**/assertion-results.json' % label, recursive=True)
              if not hits:
                  return None
              with open(hits[0]) as handle:
                  return json.load(handle)

          for label, caption in RELEASES:
              lhrs = load_lhrs(label)
              if not lhrs:
                  emit('ARTIFACT %s missing' % label, 'no lhr-*.json found')
                  continue
              first = lhrs[0]
              versions = sorted({lhr.get('lighthouseVersion') for lhr in lhrs if lhr.get('lighthouseVersion')})
              uas = sorted({lhr.get('userAgent') or '' for lhr in lhrs})
              chromes = sorted({ua.split('Chrome/')[-1].split(' ')[0] for ua in uas if 'Chrome/' in ua})
              emit(
                  'ARTIFACT %s meta' % label,
                  '%s | LHRs=%d | lighthouse=%s | Chrome=%s | throttling=%s | formFactor=%s' % (
                      caption, len(lhrs), ','.join(versions) or 'n/a', ','.join(chromes) or 'n/a',
                      first.get('configSettings', {}).get('throttlingMethod'),
                      first.get('configSettings', {}).get('formFactor'),
                  ),
              )

              grouped = {}
              for lhr in lhrs:
                  url = lhr.get('finalUrl') or lhr.get('requestedUrl') or '?'
                  grouped.setdefault(url, []).append((lhr.get('fetchTime') or '', lhr))
              for url in grouped:
                  grouped[url].sort(key=lambda pair: pair[0])

              lines = []
              for url, runs in sorted(grouped.items()):
                  values = [lhr for _, lhr in runs]
                  obs = [metrics_item(lhr) for lhr in values]
                  diag = [diagnostics_item(lhr) for lhr in values]
                  groups = [mainthread(lhr) for lhr in values]
                  lines.append('%s' % short(url))
                  lines.append('  TBT %s | LCP %s | FCP %s | TTI %s | perf %s' % (
                      seq([audit_value(lhr, 'total-blocking-time') for lhr in values]),
                      seq([audit_value(lhr, 'largest-contentful-paint') for lhr in values]),
                      seq([audit_value(lhr, 'first-contentful-paint') for lhr in values]),
                      seq([audit_value(lhr, 'interactive') for lhr in values]),
                      seq([((lhr.get('categories', {}).get('performance') or {}).get('score')) for lhr in values]),
                  ))
                  lines.append('  observed LCP %s | observed FCP %s | mainthread total %s | styleLayout %s' % (
                      seq([item.get('observedLargestContentfulPaint') for item in obs]),
                      seq([item.get('observedFirstContentfulPaint') for item in obs]),
                      seq([sum(group.values()) if group else None for group in groups]),
                      seq([group.get('styleLayout') for group in groups]),
                  ))
                  lines.append('  tasks>50ms %s | tasks>100ms %s | totalTaskTime %s | benchIndex %s | DOM %s' % (
                      seq([item.get('numTasksOver50ms') for item in diag]),
                      seq([item.get('numTasksOver100ms') for item in diag]),
                      seq([item.get('totalTaskTime') for item in diag]),
                      seq([(lhr.get('environment') or {}).get('benchmarkIndex') for lhr in values]),
                      seq([audit_value(lhr, 'dom-size') for lhr in values]),
                  ))
                  warnings = [lhr.get('runWarnings') or [] for lhr in values]
                  if any(warnings):
                      lines.append('  runWarnings %s' % json.dumps(warnings))

              chunk = []
              size = 0
              index = 0
              for line in lines:
                  if size + len(line) > 2800 and chunk:
                      index += 1
                      emit('ARTIFACT %s per-URL #%d' % (label, index), '\n'.join(chunk))
                      chunk = []
                      size = 0
                  chunk.append(line)
                  size += len(line) + 2
              if chunk:
                  index += 1
                  emit('ARTIFACT %s per-URL #%d' % (label, index), '\n'.join(chunk))

              results = assertion_results(label)
              if results:
                  rows = []
                  for item in sorted(results, key=lambda i: (i.get('url') or '', i.get('auditId') or '')):
                      rows.append('%s | %s | %s | actual=%s | values=%s | %s' % (
                          short(item.get('url')), item.get('auditId'), item.get('name'),
                          num(item.get('actual')),
                          '[' + ', '.join(num(v) for v in (item.get('values') or [])) + ']',
                          'passed' if item.get('passed') else item.get('level'),
                      ))
                  emit('ARTIFACT %s assertions' % label, '\n'.join(rows))

              for url, runs in sorted(grouped.items()):
                  if 'zakazat-tort-spb' not in url:
                      continue
                  rows = []
                  for _, lhr in runs:
                      group = mainthread(lhr)
                      diag = diagnostics_item(lhr)
                      rows.append('%s | mainthread %s | totalTaskTime %s | tasks>50 %s' % (
                          lhr.get('fetchTime'),
                          ', '.join('%s=%s' % (key, num(value)) for key, value in sorted(group.items())),
                          num(diag.get('totalTaskTime')), num(diag.get('numTasksOver50ms')),
                      ))
                      tasks = (lhr.get('audits', {}).get('long-tasks', {}).get('details', {}).get('items') or [])
                      rows.append('  longtasks: %s' % (' | '.join(
                          '%s %s@%s' % (short(task.get('url')), num(task.get('duration')), num(task.get('startTime')))
                          for task in tasks) or 'none'))
                  emit('ARTIFACT %s zakazat detail' % label, '\n'.join(rows))
          PY
